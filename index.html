<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pacemaker Navi">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Pacemaker Navi — Cardiac Device Quick Reference</title>
<style>
:root{
 --page:#F4F6F7; --surface:#FFFFFF; --ink:#1B2A2F; --ink2:#4E5F66; --ink3:#83939A;
 --line:#DCE3E5; --line2:#EBF0F1;
 --teal:#0F766E; --teal-d:#0A5A54; --teal-t:#E6F2F0; --teal-t2:#CDE6E2;
 --ok:#15803D; --ok-t:#E7F4EB; --warn:#A35A07; --warn-t:#FCF3E2; --danger:#B42318; --danger-t:#FCEBE9; --gray:#66767D; --gray-t:#EEF2F3;
 --r-lg:13px; --r-md:10px; --r-sm:7px;
 --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom); --sal:env(safe-area-inset-left); --sar:env(safe-area-inset-right);
 --nav-h:52px;
 --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5}
body{padding-bottom:calc(var(--nav-h) + var(--sab) + 8px);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--teal)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.wrap{max-width:760px;margin:0 auto;padding:0 max(16px,var(--sal)) 0 max(16px,var(--sar))}
.hidden{display:none!important}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(244,246,247,.92);-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);padding-top:var(--sat);border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.bar{display:flex;align-items:center;gap:8px;min-height:42px;padding-top:4px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.mark{width:26px;height:26px;border-radius:8px;background:var(--teal);display:grid;place-items:center;flex:none}
.mark svg{width:19px;height:12px}
.brandtx{min-width:0}
.brandtx b{display:block;font-size:17px;font-weight:750;letter-spacing:-.02em;line-height:1.15}
.brandtx small{display:block;font-size:10.5px;color:var(--ink3);letter-spacing:.01em;line-height:1.3}
.bar .spacer{flex:1}
.count-pill{font-size:11px;color:var(--ink3)}
.backbtn{display:flex;align-items:center;gap:2px;color:var(--teal);font-weight:600;font-size:15px;min-height:40px;padding-right:6px}
.backbtn svg{width:20px;height:20px}
.vtitle{font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--ink2)}
.iconbtn svg{width:20px;height:20px}
.searchrow{padding:6px 0 8px}
.sbox{position:relative}
.sbox svg.mag{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink3);pointer-events:none}
.sbox input{width:100%;height:40px;border:1px solid var(--line);border-radius:11px;background:var(--surface);padding:0 40px 0 36px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none;box-shadow:0 1px 1px rgba(20,40,45,.03)}
.sbox input::placeholder{color:var(--ink3)}
.sbox input:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-t2)}
.sbox input::-webkit-search-cancel-button{display:none}
.sclear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;display:none;place-items:center;color:var(--ink3)}
.sclear.on{display:grid}
.sclear svg{width:16px;height:16px}

/* ---------- common ---------- */
main{padding-top:4px}
.view{display:none}
.view.on{display:block}
h2.sec{font-size:13.5px;font-weight:700;margin:18px 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2.sec .aside{font-size:11px;font-weight:500;color:var(--ink3)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-padding:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:29px;padding:0 10px;border-radius:15px;border:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--ink2);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip .n{font-size:10.5px;color:var(--ink3)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.on .n{color:rgba(255,255,255,.8)}
.chip[disabled],.chip.zero{opacity:.45}
.flabel{font-size:11px;color:var(--ink3);margin:8px 0 3px}
.seg{display:flex;background:#E7ECED;border-radius:9px;padding:2px;gap:2px;margin:2px 0 6px}
.seg button{flex:1;height:28px;border-radius:7px;font-size:12px;color:var(--ink2);font-weight:600}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,40,45,.12)}
.muted{color:var(--ink3)}
.empty{padding:30px 12px;text-align:center;color:var(--ink2);font-size:13px}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.note{font-size:12px;line-height:1.6;color:var(--ink2)}
.btn{height:40px;padding:0 14px;border-radius:10px;font-weight:650;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--teal);color:#fff}
.btn.ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.block{width:100%}
.linkish{color:var(--teal);font-weight:600;font-size:13px;min-height:36px;display:inline-flex;align-items:center}

/* ---------- home ---------- */
.lead{margin:10px 0 2px}
.lead h1{font-size:21px;line-height:1.3;font-weight:750;letter-spacing:-.02em;margin:0 0 4px}
.lead p{margin:0;font-size:12.5px;color:var(--ink2);line-height:1.6}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 11px 9px;text-align:left;min-height:78px;display:flex;flex-direction:column}
.tile:active{background:var(--teal-t)}
.tile .ti{width:28px;height:28px;border-radius:8px;background:var(--teal-t);color:var(--teal);display:grid;place-items:center;margin-bottom:6px}
.tile .ti svg{width:17px;height:17px}
.tile b{font-size:13.5px;font-weight:700;line-height:1.3}
.tile span{font-size:11px;color:var(--ink3);line-height:1.4;margin-top:1px}
.tile .tn{position:absolute;right:10px;top:10px;font-size:11px;color:var(--ink3)}
.examples .chip{height:28px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.stat div{display:flex;justify-content:space-between;align-items:baseline;padding:8px 12px;border-top:1px solid var(--line2);font-size:13px}
.stat div:first-child{border-top:0}
.stat div span:last-child{font-weight:650}
.stat small{color:var(--ink3);font-size:11px;font-weight:400;margin-left:6px}

/* ---------- rows ---------- */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.row{display:flex;gap:9px;width:100%;text-align:left;padding:9px 12px;border-top:1px solid var(--line2);align-items:flex-start;background:var(--surface)}
.row:first-child{border-top:0}
.row:active{background:var(--teal-t)}
.row .ri{flex:none;width:25px;height:25px;border-radius:7px;background:var(--gray-t);color:var(--ink2);display:grid;place-items:center;margin-top:1px}
.row .ri svg{width:15px;height:15px}
.row .rb{flex:1;min-width:0}
.row .rt{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.row .rn{font-size:14px;font-weight:650;line-height:1.35;word-break:break-word}
.row .rn mark{background:#D7EEEA;color:inherit;border-radius:3px;padding:0 1px}
.row .rm{font-size:11px;color:var(--ink2);margin-top:1px;display:flex;flex-wrap:wrap;gap:1px 8px}
.row .rm .md{font-weight:600;color:var(--ink)}
.row .rs{font-size:12px;color:var(--ink2);line-height:1.5;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{flex:none;font-size:10px;font-weight:650;height:19px;line-height:17px;padding:0 7px;border-radius:10px;border:1px solid var(--teal-t2);color:var(--teal-d);background:var(--teal-t);white-space:nowrap}
.badge.gray{border-color:var(--line);color:var(--gray);background:var(--gray-t)}
.badge.warn{border-color:#F1D9A8;color:var(--warn);background:var(--warn-t)}
.badge.ok{border-color:#BFE3CB;color:var(--ok);background:var(--ok-t)}
.ghead{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 5px}
.ghead b{font-size:12px;color:var(--ink2);font-weight:700}
.ghead button{font-size:12px;color:var(--teal);font-weight:600;min-height:28px}
.more{display:block;width:100%;padding:10px;text-align:center;color:var(--teal);font-weight:650;font-size:13px;border-top:1px solid var(--line2);background:var(--surface)}
.sentinel{height:1px}
.rescount{font-size:11px;color:var(--ink3);margin:8px 2px 0}

/* ---------- notices ---------- */
.notice{border-radius:var(--r-md);padding:9px 11px;font-size:12px;line-height:1.55;display:flex;gap:8px;align-items:flex-start}
.notice svg{flex:none;width:16px;height:16px;margin-top:1px}
.notice.warn{background:var(--warn-t);color:#7A4305}
.notice.info{background:var(--teal-t);color:var(--teal-d)}
.notice.gray{background:var(--gray-t);color:var(--ink2)}
.notice.danger{background:var(--danger-t);color:#8A1B12}
.notice.ok{background:var(--ok-t);color:#135E30}

/* ---------- MRI ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:11px 12px}
.step{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.step i{font-style:normal;width:19px;height:19px;border-radius:50%;background:var(--teal);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.step b{font-size:13px}
.field{margin:8px 0 0}
.field label{display:block;font-size:11px;color:var(--ink2);margin-bottom:3px;font-weight:600}
.field select,.field input{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;font-size:16px;-webkit-appearance:none;appearance:none}
.field select{background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 18px) 17px,calc(100% - 13px) 17px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.chosen{display:flex;align-items:center;gap:8px;border:1px solid var(--teal-t2);background:var(--teal-t);border-radius:10px;padding:8px 11px}
.chosen .cb{flex:1;min-width:0}
.chosen b{display:block;font-size:14px}
.chosen span{font-size:11px;color:var(--ink2)}
.sugg{margin-top:6px}
.verdict{border-radius:var(--r-lg);padding:11px 12px;margin-top:10px;border:1px solid}
.verdict.hit{border-color:var(--teal-t2);background:var(--teal-t)}
.verdict.miss{border-color:#F1D9A8;background:var(--warn-t)}
.verdict h3{margin:0 0 3px;font-size:15px}
.verdict p{margin:3px 0 0;font-size:12px;line-height:1.55;color:var(--ink2)}
.tesla{display:flex;gap:6px;margin-top:8px}
.tesla span{font-size:12px;font-weight:650;border-radius:8px;padding:4px 9px;background:var(--surface);border:1px solid var(--line)}
.tesla span.y{color:var(--teal-d);border-color:var(--teal-t2)}
.tesla span.n{color:var(--gray)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,35,40,.38);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--surface);border-radius:18px 18px 0 0;max-height:calc(100% - var(--sat) - 18px);height:calc(100% - var(--sat) - 18px);display:flex;flex-direction:column;transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -6px 30px rgba(20,35,40,.12);max-width:760px;margin:0 auto}
.sheet.on{transform:none}
.sheet .grab{padding:6px 0 0;display:grid;place-items:center;touch-action:none}
.sheet .grab i{width:34px;height:4px;border-radius:3px;background:#CDD6D8}
.shead{padding:4px 14px 8px;display:flex;gap:8px;align-items:flex-start;touch-action:pan-y}
.shead .sh{flex:1;min-width:0}
.shead h2{margin:3px 0 1px;font-size:17px;line-height:1.35;letter-spacing:-.01em;word-break:break-word}
.shead .ss{font-size:12px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:1px 8px}
.shead .acts{display:flex;gap:4px;flex:none}
.shead .acts button{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);background:var(--gray-t)}
.shead .acts button svg{width:17px;height:17px}
.shead .acts button.saved{color:var(--teal);background:var(--teal-t)}
.stabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line2);overflow-x:auto;scrollbar-width:none;flex:none}
.stabs::-webkit-scrollbar{display:none}
.stabs button{flex:none;height:35px;padding:0 9px;font-size:12.5px;color:var(--ink2);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.stabs button.on{color:var(--teal);border-bottom-color:var(--teal)}
.sbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:10px 14px calc(20px + var(--sab))}
.kv{margin:0}
.kv>div{padding:7px 0;border-top:1px solid var(--line2)}
.kv>div:first-child{border-top:0}
.kv dt{font-size:11px;color:var(--ink3);font-weight:600;margin-bottom:1px}
.kv dd{margin:0;font-size:13.5px;line-height:1.6;word-break:break-word}
.kv dd .cond{display:block;font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.55}
.prose{font-size:13.5px;line-height:1.72;word-break:break-word}
.prose p{margin:0 0 .6em}
.prose strong{font-weight:700;color:var(--ink)}
.prose code,.kv code{font-size:.9em;background:var(--gray-t);border-radius:5px;padding:1px 5px;font-family:inherit}
.xref{color:var(--teal);font-weight:600;text-decoration:underline;text-decoration-color:var(--teal-t2);text-underline-offset:3px;background:none;padding:0;font-size:inherit}
ul.plist{list-style:none;margin:0;padding:0}
ul.plist li{padding:7px 0 7px 13px;border-top:1px solid var(--line2);position:relative;font-size:13.5px;line-height:1.6}
ul.plist li:first-child{border-top:0}
ul.plist li:before{content:"";position:absolute;left:2px;top:16px;width:4px;height:4px;border-radius:50%;background:var(--teal)}
.vgrid>div{display:grid;grid-template-columns:92px 1fr;gap:8px;padding:7px 0;border-top:1px solid var(--line2)}
.vgrid>div:first-child{border-top:0}
.vgrid .vk{font-size:11px;font-weight:700;color:var(--ink2);padding-top:2px}
.vgrid .vv{font-size:13.5px;line-height:1.6;word-break:break-word}
.vgrid .vv.none{color:var(--ink3)}
.subh{font-size:11.5px;font-weight:700;color:var(--teal-d);margin:14px 0 3px}
.subh:first-child{margin-top:2px}
.tech{margin:22px 0 0;font-size:11px;color:var(--ink3);word-break:break-all}
details.other{margin-top:14px;border:1px solid var(--line);border-radius:var(--r-md)}
details.other summary{padding:9px 11px;font-size:12px;font-weight:650;color:var(--ink2);cursor:pointer;list-style:none}
details.other summary::-webkit-details-marker{display:none}
details.other[open] summary{border-bottom:1px solid var(--line2)}
details.other .kv{padding:0 11px}
.rel{display:flex;flex-wrap:wrap;gap:5px}
.rel button{min-height:30px;padding:5px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:12px;text-align:left;line-height:1.35}
.future{border:1px dashed var(--line);border-radius:var(--r-md);padding:7px 11px;margin-top:6px}
.future div{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:4px 0}
.future div span:last-child{color:var(--ink3)}

/* ---------- nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.94);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);border-top:1px solid var(--line);padding:0 var(--sar) var(--sab) var(--sal)}
.nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#8A989E;font-size:10px;font-weight:650}
.nav button svg{width:21px;height:21px}
.nav button.on{color:var(--teal)}
@media (max-width:959px){body.kb .nav{transform:translateY(120%)}}
.nav{transition:transform .15s}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--sab) + 12px);transform:translateX(-50%) translateY(20px);background:#223338;color:#fff;font-size:12px;padding:9px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:90;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.loading{padding:60px 0;text-align:center;color:var(--ink3);font-size:14px}
.err{margin-top:30px}

@media (min-width:700px){
 .tiles{grid-template-columns:repeat(3,1fr)}
}
@media (min-width:960px){
 .sheet{left:auto;right:0;top:0;bottom:0;height:100%;max-height:100%;width:540px;border-radius:0;margin:0;transform:translateX(102%);box-shadow:-8px 0 30px rgba(20,35,40,.12)}
 .sheet.on{transform:none}
 .sheet .grab{display:none}
 .shead{padding-top:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top" id="top">
 <div class="wrap">
  <div class="bar" id="bar"></div>
  <div class="searchrow" id="searchrow">
   <div class="sbox">
    <svg class="mag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
    <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="製品名・型番・機能・用語を検索" aria-label="製品名・型番・機能・用語を検索">
    <button class="sclear" id="qclear" aria-label="検索語を消す"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm3.5 12.1-1.4 1.4L12 13.4l-2.1 2.1-1.4-1.4 2.1-2.1-2.1-2.1 1.4-1.4 2.1 2.1 2.1-2.1 1.4 1.4-2.1 2.1 2.1 2.1Z"/></svg></button>
   </div>
  </div>
 </div>
</header>
<main class="wrap" id="main">
 <div class="loading" id="loading">データを読み込んでいます…</div>
 <section class="view" id="v-home"></section>
 <section class="view" id="v-search"></section>
 <section class="view" id="v-list"></section>
 <section class="view" id="v-mri"></section>
 <section class="view" id="v-history"></section>
 <section class="view" id="v-saved"></section>
 <section class="view" id="v-menu"></section>
 <section class="view" id="v-more"></section>
</main>
<nav class="nav" id="nav" aria-label="メイン">

/* ---------- 検索（現行版の表記ゆれ辞書 SYN と概念マップ CONCEPT_MAP を引き継ぐ） ---------- */
var SYN_N=(typeof SYN!=="undefined"?SYN:[]).map(function(g){return g.map(nq)});
function expandQ(qraw){
 var qn=nq(qraw);if(!qn)return [];
 var out=[qn];
 SYN_N.forEach(function(grp){
  var hit=grp.some(function(w){return w===qn||(qn.length>=3&&w.indexOf(qn)>=0)||(w.length>=3&&qn.indexOf(w)>=0)});
  if(hit)grp.forEach(function(w){if(out.indexOf(w)<0)out.push(w)});
 });
 return out;
}
function conceptTargets(qraw){
 if(typeof CONCEPT_MAP==="undefined")return [];
 var qn=nq(qraw),q=String(qraw||"").trim().toLowerCase();
 var names=CONCEPT_MAP[q]||CONCEPT_MAP[qn];if(names)return names;
 var cands=[qn].concat(expandQ(qraw));
 for(var i=0;i<cands.length;i++){var cq=cands[i];
  if(CONCEPT_MAP[cq])return CONCEPT_MAP[cq];
  for(var k in CONCEPT_MAP){var kn=nq(k);if(!kn)continue;if(kn===cq||(cq.length>=3&&kn.indexOf(cq)>=0)||(kn.length>=3&&cq.indexOf(kn)>=0))return CONCEPT_MAP[k]}
 }
 return [];
}
function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}
function prepQuery(qraw){
 var qn=nq(qraw);if(!qn)return null;
 var ql=nf(qraw).trim().toLowerCase();
 var ex=expandQ(qraw).filter(function(x){return x!==qn&&x.length>=3});
 var shortEx=expandQ(qraw).filter(function(x){return x!==qn&&x.length<3}).map(function(t){return new RegExp("(^|[^a-z0-9])"+reEsc(t)+"([^a-z0-9]|$)","i")});
 var concept={};conceptTargets(qraw).forEach(function(n){concept[n]=1});
 return {raw:qraw,qn:qn,ql:ql,ex:ex,shortEx:shortEx,concept:concept};
}
function score(r,Q){
 var qn=Q.qn;
 if(r.n===qn)return 0;
 for(var i=0;i<r.aln.length;i++)if(r.aln[i]===qn)return 1;
 if(r.n.indexOf(qn)===0)return 2;
 for(i=0;i<r.aln.length;i++)if(r.aln[i].indexOf(qn)===0)return 3;
 if(r.n.indexOf(qn)>=0)return 4;
 for(i=0;i<r.aln.length;i++)if(r.aln[i].indexOf(qn)>=0)return 5;
 if(r.type==="term"&&Q.concept[r.raw.term])return 5.5;
 if(r.hay.indexOf(qn)>=0||(Q.ql&&r.hayRaw.indexOf(Q.ql)>=0))return 6;
 for(i=0;i<Q.ex.length;i++)if(r.hay.indexOf(Q.ex[i])>=0)return 7;
 for(i=0;i<Q.shortEx.length;i++)if(Q.shortEx[i].test(r.hayRaw))return 7;
 return -1;
}
function makerOk(r,mk){if(!mk)return true;return (r.makers||[]).indexOf(mk)>=0}
function search(qraw,opt){
 opt=opt||{};var Q=prepQuery(qraw);var out={all:[],by:{term:[],algo:[],feat:[],prod:[],mri:[]}};
 if(!Q)return out;
 var types=opt.types||ORDER;
 types.forEach(function(t){
  var arr=DB[t],res=out.by[t];
  for(var i=0;i<arr.length;i++){var r=arr[i];if(opt.maker&&!makerOk(r,opt.maker))continue;if(opt.filter&&!opt.filter(r))continue;
   var s=score(r,Q);if(s>=0)res.push({r:r,s:s})}
  res.sort(function(a,b){return (a.s-b.s)||(a.r.idx-b.r.idx)});
 });
 return out;
}

var route={path:"home",params:{}};
function parseHash(){
 var h=location.hash.replace(/^#\/?/,"");var qi=h.indexOf("?");var path=(qi<0?h:h.slice(0,qi))||"home";var params={};
 if(qi>=0)h.slice(qi+1).split("&").forEach(function(p){if(!p)return;var kv=p.split("=");params[decodeURIComponent(kv[0])]=decodeURIComponent((kv[1]||"").replace(/\+/g," "))});
 return {path:path,params:params};
}
function buildHash(path,params){var q=Object.keys(params||{}).filter(function(k){return params[k]!==""&&params[k]!=null}).map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(params[k])}).join("&");return "#/"+path+(q?"?"+q:"")}
var keepScroll=false;
function go(path,params,replace){var h=buildHash(path,params);if(replace){keepScroll=true;history_replace(h)}else location.hash=h}
function history_replace(h){try{window.history.replaceState(null,"",h)}catch(e){location.replace(h)}onRoute()}
function setParam(k,v,replace){var p=Object.assign({},route.params);if(v===""||v==null)delete p[k];else p[k]=v;go(route.path,p,replace)}

var scrollMem={};
var lastViewKey=null;

function onRoute(){
 var nr=parseHash();
 var prevKey=lastViewKey;
 var nk=viewKey(nr);
 if(prevKey&&prevKey!==nk)scrollMem[prevKey]=window.scrollY;
 route=nr;
 if(prevKey!==nk){var ks=keepScroll&&prevKey&&prevKey.split("?")[0]===nk.split("?")[0];var y0=window.scrollY;renderView();lastViewKey=nk;var y=ks?y0:(scrollMem[nk]||0);requestAnimationFrame(function(){window.scrollTo(0,y)})}

}

  LS.set("saved",saved);toast(n?n+" 件を保存に追加しました":"取り込める項目はありませんでした");renderMenu()};
}

/* ---------- 詳細シート ---------- */
var sheetKey=null,sheetTab=null;
var pushedDetail=false;
function openDetail(k){var p=Object.assign({},route.params);p.d=k;pushedDetail=true;go(route.path,p)}
function openSheet(k){
 var r=BYKEY[k];
 if(!r){closeSheet(true);toast("項目が見つかりません");return}
 if(sheetKey!==k){sheetKey=k;sheetTab=null;addHistory(k)}
 var D=buildDetail(r);
 var tabs=D.tabs.filter(function(t){return t.html});
 if(!tabs.length)tabs=[{k:"ov",label:"概要",html:'<p class="note">登録されている項目はありません。</p>'}];
 if(!sheetTab||!tabs.some(function(t){return t.k===sheetTab}))sheetTab=tabs[0].k;
 $("#shead").innerHTML='<div class="sh"><span class="badge'+(r.type==="mri"&&r.raw.verify?" gray":"")+'">'+esc(D.badge)+'</span><h2 id="sTitle">'+esc(D.title)+'</h2><div class="ss">'+D.sub.filter(Boolean).map(function(s){return "<span>"+s+"</span>"}).join("")+'</div></div>'+
  '<div class="acts"><button id="sSave" class="'+(isSaved(k)?"saved":"")+'" aria-label="保存">'+(isSaved(k)?ICON.bmOn:ICON.bm)+'</button><button id="sLink" aria-label="リンクをコピー">'+ICON.link+'</button><button id="sClose" aria-label="閉じる">'+ICON.close+'</button></div>';
 $("#stabs").innerHTML=tabs.length>1?tabs.map(function(t){return '<button role="tab" aria-selected="'+(t.k===sheetTab)+'" class="'+(t.k===sheetTab?"on":"")+'" data-tab="'+t.k+'">'+esc(t.label)+'</button>'}).join(""):"";
 $("#stabs").style.display=tabs.length>1?"":"none";
 var body=function(){var t=tabs.filter(function(t){return t.k===sheetTab})[0];var last=sheetTab===tabs[tabs.length-1].k;$("#sbody").innerHTML=t.html+(last?(D.other||"")+D.tech:"");$("#sbody").scrollTop=0};
 /* 「そのほかの登録項目」は最後のタブの下に必ず出す（どのフィールドも隠さない） */
 body();
 $$("#stabs button").forEach(function(b){b.onclick=function(){sheetTab=b.dataset.tab;$$("#stabs button").forEach(function(x){x.classList.toggle("on",x===b);x.setAttribute("aria-selected",x===b)});body()}});
 $("#sSave").onclick=function(){toggleSave(k);var on=isSaved(k);this.classList.toggle("saved",on);this.innerHTML=on?ICON.bmOn:ICON.bm;if(route.path==="saved")renderSaved()};
 $("#sLink").onclick=function(){var url=location.href.split("#")[0]+buildHash("home",{d:k});if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(function(){toast("リンクをコピーしました")},function(){toast(url)})}else toast(url)};
 $("#sClose").onclick=closeViaBack;
 if(!$("#sheet").classList.contains("on")){lockScroll(true);$("#sheet").classList.add("on");$("#scrim").classList.add("on")}
}
function closeViaBack(){if(route.params.d){var p=Object.assign({},route.params);delete p.d;
 if(pushedDetail)window.history.back();else go(route.path,p,true)}else closeSheet()}
function closeSheet(silent){
 if(!$("#sheet").classList.contains("on"))return;
 $("#sheet").classList.remove("on");$("#scrim").classList.remove("on");lockScroll(false);sheetKey=null;
 if(route.path==="history")renderHistory();
}
var lockY=0;
function lockScroll(on){
 if(on){lockY=window.scrollY;document.body.style.position="fixed";document.body.style.top=-lockY+"px";document.body.style.left="0";document.body.style.right="0"}
 else{document.body.style.position="";document.body.style.top="";document.body.style.left="";document.body.style.right="";window.scrollTo(0,lockY)}
}
/* 下にスワイプして閉じる（ハンドルとヘッダ） */
(function(){
 var y0=null,dy=0,sh=$("#sheet");
 function st(e){if(window.innerWidth>=960)return;y0=e.touches[0].clientY;dy=0;sh.style.transition="none"}
 function mv(e){if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);sh.style.transform="translateY("+dy+"px)"}
 function en(){if(y0==null)return;sh.style.transition="";sh.style.transform="";if(dy>90)closeViaBack();y0=null}
 ["grab","shead"].forEach(function(id){var el=$("#"+id);el.addEventListener("touchstart",st,{passive:true});el.addEventListener("touchmove",mv,{passive:true});el.addEventListener("touchend",en)});
})();

/* ---------- 共通のクリック処理 ---------- */
document.addEventListener("click",function(e){
 var t=e.target.closest("[data-open],[data-q],[data-go],[data-nav],[data-cat],[data-mk],[data-mk-clear],[data-p-kd],[data-p-mk],[data-p-ct],[data-p-dv],[data-p-ty],[data-p-per],[data-mri-dev],[data-mri-reset]");
 if(!t)return;
 if(t.dataset.open!=null){e.preventDefault();openDetail(t.dataset.open);return}
 if(t.dataset.q!=null){e.preventDefault();var q=t.dataset.q;commitRecentQ(q);$("#q").value=q;go("search",{q:q});return}
 if(t.dataset.go!=null){e.preventDefault();location.hash=t.dataset.go;return}
 if(t.dataset.nav!=null){e.preventDefault();var n=t.dataset.nav;
  if(n==="search"){go("search",searchState.q?{q:searchState.q,c:searchState.c,m:searchState.m}:{});$("#searchrow").classList.remove("hidden");if(!searchState.q)$("#q").focus()}
  else go(n,{});return}
 if(t.dataset.cat!=null){var p=Object.assign({},route.params);p.c=t.dataset.cat;if(p.c==="all")delete p.c;go("search",p,true);window.scrollTo(0,0);return}
 if(t.dataset.mk!=null){var p2=Object.assign({},route.params);if(t.dataset.mk)p2.m=t.dataset.mk;else delete p2.m;go("search",p2,true);return}
 if(t.dataset.mkClear!=null){var p3=Object.assign({},route.params);delete p3.m;go("search",p3,true);return}
 var keys=["kd","mk","ct","dv","ty","per"];
 for(var i=0;i<keys.length;i++){var dk="p"+keys[i].charAt(0).toUpperCase()+keys[i].slice(1);if(t.dataset[dk]!=null){var pp=Object.assign({},route.params);var v=t.dataset[dk];if(v)pp[keys[i]]=v;else delete pp[keys[i]];if(keys[i]==="kd"||keys[i]==="mk")delete pp.ct;go(route.path,pp,true);return}}
 if(t.dataset.mriDev!=null){go("mri",{dev:t.dataset.mriDev,dm:t.dataset.mriDm,dt:t.dataset.mriDt});return}
 if(t.dataset.mriReset!=null){go("mri",{});return}
});
$("#scrim").addEventListener("click",closeViaBack);
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&$("#sheet").classList.contains("on"))closeViaBack()});

/* ---------- 上部検索（入口） ---------- */
(function(){
 var q=$("#q"),clr=$("#qclear"),tm=null;
 q.addEventListener("input",function(){
  clr.classList.toggle("on",!!q.value);
  clearTimeout(tm);
  var v=q.value;
  if(route.path!=="search"){if(v.trim()){go("search",{q:v})}return}
  tm=setTimeout(function(){var p=Object.assign({},route.params);if(v)p.q=v;else delete p.q;delete p.d;
   try{window.history.replaceState(null,"",buildHash("search",p))}catch(e){}
   route=parseHash();lastViewKey=viewKey(route);searchState.q=v;searchState.c=route.params.c||"all";searchState.m=route.params.m||"";drawSearch()},90);
 });
 q.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();commitRecentQ(q.value);q.blur()}});
 q.addEventListener("blur",function(){if(q.value.trim().length>=2&&route.path==="search")commitRecentQ(q.value)});
 clr.addEventListener("click",function(){q.value="";clr.classList.remove("on");q.focus();if(route.path==="search"){var p=Object.assign({},route.params);delete p.q;go("search",p,true)}});
 /* 画面キーボードが実際に出ているときだけ下部ナビを隠す（iOS：visualViewport が縮む／Android：innerHeight が縮む） */
 var maxH=window.innerHeight;
 function kbCheck(){
  maxH=Math.max(maxH,window.innerHeight);
  var a=document.activeElement,typing=a&&a.matches&&a.matches("input,textarea");
  var vv=window.visualViewport,shrink=(vv?window.innerHeight-vv.height:0)>120||window.innerHeight<maxH*0.78;
  document.body.classList.toggle("kb",!!(typing&&shrink));
 }
 if(window.visualViewport)window.visualViewport.addEventListener("resize",kbCheck);
 window.addEventListener("resize",kbCheck);
 document.addEventListener("focusin",function(){setTimeout(kbCheck,250)});
 document.addEventListener("focusout",function(){setTimeout(kbCheck,60)});
})();
window.addEventListener("scroll",function(){$("#top").classList.toggle("scrolled",window.scrollY>4)},{passive:true});

var toastTm=null;
function toast(msg){var t=$("#toast");t.textContent=msg;t.classList.add("on");clearTimeout(toastTm);toastTm=setTimeout(function(){t.classList.remove("on")},1800)}

/* ---------- 読み込み ---------- */
var ready=false,EMBED=false;
var DATA_SRC={offline:false,fetched:null};   /* Service Worker が保存分を返したとき offline=true */
function readEmbedded(name){var el=document.getElementById("pn-data-"+name);if(!el)return null;try{return JSON.parse(el.textContent)}catch(e){return null}}
function loadAll(){
 var emb={};FILES.forEach(function(f){var d=readEmbedded(f);if(d)emb[f]=d});
 if(Object.keys(emb).length===FILES.length){EMBED=true;return Promise.resolve(emb)}
 return Promise.all(FILES.map(function(f){return fetch(f+".json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw new Error(f+".json（"+r.status+"）");
   if(r.headers.get("x-pn-cache")==="hit"){DATA_SRC.offline=true;var t=r.headers.get("x-pn-fetched");if(t&&(!DATA_SRC.fetched||t<DATA_SRC.fetched))DATA_SRC.fetched=t}
   return r.json()})}))
  .then(function(arr){var o={};FILES.forEach(function(f,i){o[f]=arr[i]});return o});
}
loadAll().then(function(o){
 RAW=o;indexAll();ready=true;$("#loading").remove();
 if("serviceWorker" in navigator&&!EMBED&&(location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1")){
  navigator.serviceWorker.register("sw.js").catch(function(){});
 }
 window.addEventListener("hashchange",onRoute);onRoute();
}).catch(function(err){
 $("#loading").innerHTML='<div class="notice danger err">'+ICON.warn+'<div><b>データを読み込めませんでした。</b><br>'+esc(err.message)+'<br>通信できる場所で開き直してください。一度開いたことがある端末では、次からは電波がなくても表示できます。<br>（ファイルを直接開いた場合は、data.json などと同じフォルダに置いて Web サーバ経由で開いてください）</div></div>';
});

/* 動作確認用の読み取り専用フック（データは返すだけで変更しない） */
window.PNV2={
 counts:function(){return {gloss:DB.term.length,feats:DB.feat.length,algos:DB.algo.length,products:DB.prod.length,mri:DB.mri.length}},
 keys:function(){return ORDER.map(function(t){return DB[t].map(function(r){return r.key})})},
 detailText:function(k){var r=BYKEY[k];if(!r)return null;var D=buildDetail(r);var div=document.createElement("div");div.innerHTML=D.title+" "+D.sub.join(" ")+" "+D.tabs.map(function(t){return t.html}).join(" ")+" "+(D.other||"")+" "+D.tech;return div.textContent},
 search:function(q,o){var r=search(q,o||{});var out={};ORDER.forEach(function(t){out[t]=r.by[t].slice(0,10).map(function(x){return x.r.key})});out.total=ORDER.reduce(function(a,t){return a+r.by[t].length},0);return out},
 raw:function(k){var r=BYKEY[k];return r?r.raw:null},
 ready:function(){return ready}
};
})();
