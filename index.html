<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#0d9488"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Pacemaker Navi"/>
<link rel="apple-touch-icon" href="icon.png"/>
<link rel="icon" href="icon.png"/>
<title>Pacemaker Navi — PM / ICD / CRT</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--border:#e2e8f0;--ink:#0f172a;--sub:#475569;--muted:#94a3b8;--teal:#0d9488;--teal-d:#0f766e;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif;}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:rgba(248,250,252,.96);backdrop-filter:saturate(180%) blur(8px);border-bottom:1px solid var(--border)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);margin:0}
.titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:2px}
h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.totals{font-family:var(--mono);font-size:11px;color:var(--muted)}
.seg{display:flex;gap:4px;background:#eef2f6;border-radius:10px;padding:3px;margin-top:10px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:8px;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;font-family:var(--sans)}
.seg button.active{background:#fff;color:var(--teal-d);box-shadow:0 1px 2px rgba(15,23,42,.08)}
.searchbox{position:relative;margin-top:10px}
.searchbox input{width:100%;border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:11px 36px;font-size:14px;font-family:var(--sans);outline:none;color:var(--ink)}
.searchbox input::placeholder{color:var(--muted)}
.searchbox input:focus{border-color:var(--teal);box-shadow:0 0 0 3px #99f6e4}
.searchbox .icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.clearbtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:6px;padding:4px;display:none;line-height:0}
.clearbtn:hover{background:#f1f5f9;color:var(--sub)}
.filterlabel{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin:10px 0 0}
.chips{display:flex;gap:7px;overflow-x:auto;padding:6px 0 2px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid #cbd5e1;background:#fff;color:var(--sub);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
.chip:hover{border-color:#94a3b8;background:#f8fafc}
.chip.active{background:var(--teal);border-color:var(--teal);color:#fff}
.chip .n{font-family:var(--mono);margin-left:6px;color:var(--muted)}.chip.active .n{color:#ccfbf1}
.chip.dev.active{background:#334155;border-color:#334155}.chip.dev.active .n{color:#cbd5e1}
.actions{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0 12px}
.addbtn{border:0;background:var(--teal);color:#fff;font-weight:600;font-size:14px;padding:9px 16px;border-radius:10px;cursor:pointer;font-family:var(--sans)}
.addbtn:hover{background:var(--teal-d)}
details.datamenu{position:relative}
details.datamenu>summary{list-style:none;cursor:pointer;font-size:13px;color:var(--sub);padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:#fff;user-select:none}
details.datamenu>summary::-webkit-details-marker{display:none}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(15,23,42,.12);padding:6px;min-width:210px;z-index:30}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;font-size:13px;color:var(--ink);border-radius:8px;cursor:pointer;font-family:var(--sans)}
.menu button:hover{background:#f1f5f9}.menu button.danger{color:#be123c}
main{padding:12px 0 40px}
.count{font-family:var(--mono);font-size:11px;color:var(--muted);margin:0 0 12px}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.cardrow{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.cardhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.term{font-family:var(--mono);font-size:16px;font-weight:600;line-height:1.35;margin:0}
.term .abbr{color:var(--teal);margin-left:6px;font-size:13px}
.fn{font-size:15px;font-weight:700;line-height:1.4;margin:0}
.cardtools{display:flex;align-items:center;gap:6px;flex-shrink:0}
.pill{border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.iconbtn{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:3px;border-radius:6px;line-height:0}
.iconbtn:hover{background:#f1f5f9;color:var(--sub)}
.metarow{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:10px;font-weight:600;color:#64748b;background:#f1f5f9;border-radius:5px;padding:2px 7px}
.tag.mk{color:#7c2d12;background:#ffedd5}
.en{font-family:var(--mono);font-size:12px;color:var(--muted);margin:5px 0 0}
.short{font-size:14px;line-height:1.6;color:var(--ink);margin:8px 0 0}
.vgrid{margin-top:10px;border-top:1px dashed #e2e8f0;padding-top:8px}
.vrow{display:grid;grid-template-columns:6.5em 1fr;gap:8px;padding:4px 0;align-items:baseline}
.vrow+.vrow{border-top:1px solid #f1f5f9}
.vlabel{font-size:11px;font-weight:700;color:var(--teal-d)}
.vval{font-size:13px;line-height:1.5;color:var(--ink)}
.vval.none{color:#cbd5e1}
.note{font-size:12px;line-height:1.6;color:var(--sub);margin:9px 0 0;background:#f8fafc;border-radius:8px;padding:8px 10px}
.empty{border:1px dashed #cbd5e1;background:#fff;border-radius:12px;padding:40px 16px;text-align:center}
.empty p{margin:0}.empty .big{font-size:14px;font-weight:600;color:var(--sub)}.empty .sm{font-size:12px;color:var(--muted);margin-top:4px}
.disclaimer{text-align:center;font-size:12px;line-height:1.7;color:var(--muted);margin-top:32px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.overlay.open{display:flex}
.modal{background:#fff;width:100%;max-width:680px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media(min-width:680px){.overlay{align-items:center;padding:16px}.modal{border-radius:16px}}
.modal h2{font-size:16px;margin:0 0 14px}
.field{margin-bottom:11px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:5px}
.field input,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;font-size:14px;font-family:var(--sans);color:var(--ink);outline:none;background:#fff}
.field textarea{min-height:60px;resize:vertical;line-height:1.6}
.field input:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #99f6e4}
.row2{display:flex;gap:8px}.row2 .field{flex:1}
.modalbtns{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;padding:11px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid transparent;font-family:var(--sans)}
.btn.primary{background:var(--teal);color:#fff}.btn.primary:hover{background:var(--teal-d)}
.btn.ghost{background:#fff;border-color:#cbd5e1;color:var(--sub)}.btn.ghost:hover{background:#f8fafc}
.btn.del{background:#fff;border-color:#fecdd3;color:#be123c;flex:0 0 auto;padding:11px 14px}.btn.del:hover{background:#fff1f2}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#0f766e;color:#fff;font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:60}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.syncstat{font-family:var(--mono);font-size:11px;color:#0f766e;margin:-6px 0 12px}.synchelp{font-size:12px;line-height:1.6;color:var(--sub);margin:0 0 10px;background:#f0fdfa;border-radius:8px;padding:9px 10px}.syncstate{font-size:13px;margin:0 0 12px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* 旧ヘッダーCSSはブランドカードに置き換えたため削除 */
.eyebrow{letter-spacing:.02em;font-size:11px;margin:0}
h1{font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.1;color:#12324e;margin:0}
.titlerow{margin-top:3px;align-items:flex-end}
.totals{font-size:11px}
.suggestbox{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(15,23,42,.16);z-index:45;max-height:min(50vh,340px);overflow:auto;display:none}
.suggestbox.open{display:block}
.sugg{display:flex;align-items:baseline;gap:8px;padding:11px 14px;cursor:pointer;border-bottom:1px solid #f1f5f9}
.sugg:last-child{border-bottom:0}.sugg:active{background:#f0fdfa}
.sugg .st{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ink)}
.sugg .sa{font-family:var(--mono);font-size:12px;color:var(--teal)}
.sugg .sc{margin-left:auto;font-size:10px;font-weight:700;border-radius:5px;padding:2px 7px;white-space:nowrap}

.cardrow{cursor:pointer}
.short{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.detailmodal{max-height:88vh;overflow:auto}
.dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.dterm{font-family:var(--mono);font-size:20px;font-weight:700;line-height:1.3;margin:0}
.dterm .abbr{color:var(--teal);margin-left:8px;font-size:15px}
.dshort{font-size:15px;line-height:1.85;color:var(--ink);margin:12px 0 0;white-space:pre-wrap}
.dnote{font-size:13px;line-height:1.7;color:var(--sub);margin:12px 0 0;background:#f8fafc;border-radius:8px;padding:10px 12px}

.menu{z-index:60}
.sortbar{display:flex;justify-content:flex-end;margin:2px 0 10px}
.sortsel{width:auto;min-width:118px;font-size:13px;font-weight:600;color:var(--sub);padding-top:8px;padding-bottom:8px}
.star{border:0;background:transparent;cursor:pointer;padding:2px;line-height:0;color:#cbd5e1}
.star:hover{color:#94a3b8}.star.on{color:#f59e0b}

.fsel{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px 34px 10px 12px;font-size:14px;font-family:var(--sans);color:var(--ink);background:#fff;outline:none;-webkit-appearance:none;appearance:none;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8" viewBox="0 0 12 8"><path d="M1 1l5 5 5-5" stroke="%2394a3b8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>');background-repeat:no-repeat;background-position:right 12px center}
.fsel:focus{border-color:var(--teal);box-shadow:0 0 0 3px #99f6e4}
.chkrow{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--sub);border:1px solid #cbd5e1;border-radius:9px;padding:8px 11px;cursor:pointer;user-select:none;background:#fff}
.chk input{accent-color:var(--teal);width:17px;height:17px;margin:0}
.chk input:checked + span{color:var(--teal);font-weight:600}


/* ===== 下部タブバー ===== */
body{padding-bottom:calc(58px + env(safe-area-inset-bottom))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;
 background:rgba(255,255,255,.97);backdrop-filter:saturate(180%) blur(10px);
 border-top:1px solid #e6f2ee;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;background:none;border:0;padding:7px 1px 6px;cursor:pointer;
 display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);
 font-size:9.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.tabbar button svg{width:21px;height:21px;stroke-width:1.9}
.tabbar button.on{color:var(--teal-d)}
.tabbar button:focus-visible{outline:2px solid var(--teal);outline-offset:-2px;border-radius:8px}
/* ===== 汎用フィルタ ===== */
.fbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.fbar .fsel{flex:1 1 44%;min-width:0}
.chipline{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
.chipline::-webkit-scrollbar{display:none}
.chipline button{white-space:nowrap;border:1px solid var(--border);background:#fff;
 border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--sub);cursor:pointer}
.chipline button.on{background:var(--teal);border-color:var(--teal);color:#fff}
/* ===== 製品・アルゴ・MRIカード ===== */
.pcard{background:var(--card);border:1px solid var(--border);border-radius:14px;
 padding:13px 14px;margin-bottom:9px}
.pcard h3{margin:0;font-size:15.5px;font-weight:800;line-height:1.35;color:var(--ink)}
.pcard .pmeta{margin:5px 0 0;display:flex;gap:6px;flex-wrap:wrap}
.pcard .pmeta span{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;
 background:#f1f5f9;color:var(--sub)}
.pcard .pmeta span.mk{background:#ecfdf5;color:var(--teal-d)}
.pcard .pmeta span.warn{background:#fef3c7;color:#92400e}
.pcard dl{margin:9px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.pcard dt{color:var(--muted);font-weight:700;white-space:nowrap}
.pcard dd{margin:0;color:var(--ink)}
.pcard .src{margin:9px 0 0;font-size:11px;color:var(--muted)}
.pcard .src a{color:var(--teal-d)}
/* ===== タブ内の検索欄（製品・アルゴリズム） ===== */
.tabsearch{flex:1 1 100%;margin-top:0}
.tabsearch input{font-size:14px}
/* ===== 製品：一覧行 ===== */
.prow .ico{flex:0 0 26px;height:26px;color:var(--muted)}
.prow b .mdl{color:var(--teal-d)}
.prow em{color:var(--muted);font-size:12px}
.pdet .kv dd{text-align:right}
/* ===== 空状態 ===== */
.blank{border:1px dashed #cbd5e1;border-radius:14px;padding:22px 18px;text-align:center;
 background:#fff;color:var(--sub)}
.blank b{display:block;font-size:14.5px;color:var(--ink);margin-bottom:6px}
.blank p{margin:0;font-size:13px;line-height:1.75}
.blank code{background:#f1f5f9;padding:1px 6px;border-radius:5px;font-size:12px}

/* ===== 背景を固定 ===== */
html{background:#f8fafc;height:100%;overscroll-behavior:none}
body{overscroll-behavior:none;background:transparent;min-height:100%}
/* 上端に引っ張ったときもヘッダーと同じ色を見せる固定レイヤー */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
 background:linear-gradient(180deg,#eafaf5 0,#f8fafc 260px)}
/* ヘッダー背景がスクロールでずれないようにする */
header{background-attachment:scroll}

/* ===== アルゴ：モード切替 ===== */
.amode{display:flex;gap:6px;margin:0 0 10px}
.amode button{flex:1;border:1px solid var(--border);background:#fff;border-radius:10px;
 padding:8px 4px;font-size:13px;font-weight:800;color:var(--sub);cursor:pointer}
.amode button.on{background:var(--teal);border-color:var(--teal);color:#fff}
/* ===== アルゴ：メーカー見出しと行 ===== */
.mkhead{margin:16px 0 8px;font-size:12px;font-weight:800;letter-spacing:.06em;
 text-transform:uppercase;color:var(--teal-d)}
.mkhead:first-child{margin-top:2px}
.arow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
 background:var(--card);border:1px solid var(--border);border-radius:13px;
 padding:12px 13px;margin-bottom:8px;cursor:pointer}
.arow:active{background:#f8fafc}
.arow .ico{flex:0 0 26px;height:26px;color:var(--muted)}
.arow .atxt{flex:1;min-width:0}
.arow b{display:block;font-size:14.5px;font-weight:800;color:var(--ink);line-height:1.35}
.arow small{display:block;margin-top:2px;font-size:11.5px;color:var(--muted)}
.arow em{display:block;margin-top:5px;font-size:12.5px;font-style:normal;line-height:1.6;color:var(--sub)}
.arow .chev{flex:0 0 8px;color:var(--muted)}
/* ===== アルゴ：詳細 ===== */
.adet{padding-top:calc(env(safe-area-inset-top) + 10px)}
.adet .back{display:inline-flex;align-items:center;gap:5px;background:none;border:0;
 color:var(--teal-d);font-size:14px;font-weight:800;padding:2px 0 12px;cursor:pointer}
.adet h2{margin:0;font-size:21px;font-weight:800;line-height:1.3;color:var(--ink)}
.adet .kv{margin:14px 0 0;border-top:1px solid var(--border)}
.adet .kv div{display:flex;gap:12px;justify-content:space-between;
 padding:10px 0;border-bottom:1px solid var(--border)}
.adet .kv dt{font-size:13px;font-weight:700;color:var(--muted);flex:0 0 auto}
.adet .kv dd{margin:0;font-size:13.5px;font-weight:700;color:var(--ink);text-align:right}
.adet section{margin:18px 0 0}
.adet h4{margin:0 0 6px;font-size:12px;font-weight:800;letter-spacing:.05em;
 text-transform:uppercase;color:var(--teal-d)}
.adet p.body{margin:0;font-size:14px;line-height:1.85;color:var(--ink)}
.kv dd .cond{display:block;margin-top:3px;font-size:11px;line-height:1.6;color:var(--muted)}
.connbox{margin:2px 0 10px;padding:12px 10px;background:var(--bg);
 border:1px solid var(--border);border-radius:12px;color:var(--sub);overflow-x:auto}
.connbox svg{display:block;width:100%;max-width:330px;height:auto;margin:0 auto}
.connbox .cap{margin:6px 0 0;font-size:11px;color:var(--muted);text-align:center}
.adet ul.par{margin:0;padding-left:18px;font-size:14px;line-height:1.9;color:var(--ink)}
.adet .path{margin:0;font-size:13.5px;line-height:1.7;color:var(--ink);
 background:#f1f5f9;border-radius:9px;padding:9px 11px}

/* ===== モーダル表示中はタブバーを退避（ボタンが隠れる不具合の対策） ===== */
.tabbar{z-index:40}
body.modal-open .tabbar{display:none}
body.modal-open{padding-bottom:0}

/* ===== ズーム抑止と背景の全面固定 ===== */
html,body{width:100%;max-width:100%;overflow-x:hidden;
 touch-action:manipulation;                    /* 縦スクロールのみ許可＝ピンチ無効 */
 -webkit-text-size-adjust:100%;text-size-adjust:100%}
body::before{position:fixed;top:-10vh;left:-10vw;right:-10vw;bottom:-10vh;
 background:linear-gradient(180deg,#eafaf5 0,#f8fafc 340px)}
/* 入力欄はiOSの自動ズームを避けるため16px以上を確保 */
input,select,textarea{font-size:16px}
/* ダブルタップによる拡大を止める */
button,.chip,.arow,.cardrow,.tabbar button{touch-action:manipulation}

/* ===== 詳細画面のスワイプ戻り ===== */
.adet{touch-action:pan-y;will-change:transform}
.adet.swiping{transition:none}

/* ===== MRI 組合せ検索 ===== */
.mriform{background:var(--card);border:1px solid var(--border);border-radius:14px;
 padding:14px;margin-bottom:12px}
.mriform label{display:block;font-size:11.5px;font-weight:800;color:var(--muted);
 letter-spacing:.03em;margin:0 0 4px}
.mriform .row{margin-bottom:11px}
.mriform .row:last-child{margin-bottom:0}
.mriform select{width:100%;padding:11px 12px;border:1px solid var(--border);
 border-radius:10px;background:#fff;color:var(--ink);font-weight:700}
.mriform select:disabled{background:#f8fafc;color:var(--muted)}
.mrireset{width:100%;margin-top:14px;padding:13px;border:0;
 background:var(--teal);border-radius:11px;font-size:15px;font-weight:800;color:#fff;cursor:pointer}
.mrireset:active{background:var(--teal-d)}
.mriclear{display:block;margin:9px auto 0;background:none;border:0;font-size:12.5px;
 font-weight:700;color:var(--muted);text-decoration:underline;cursor:pointer}
/* 判定結果 */
.verdict{border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid}
.verdict.ok{background:#ecfdf5;border-color:#a7f3d0}
.verdict.ng{background:#fef2f2;border-color:#fecaca}
.verdict.wait{background:#f8fafc;border-color:var(--border)}
.verdict .vt{margin:0;font-size:12px;font-weight:800;letter-spacing:.05em;
 text-transform:uppercase;color:var(--muted)}
.verdict .vv{margin:6px 0 0;font-size:26px;font-weight:800;line-height:1.2}
.verdict.ok .vv{color:#047857}
.verdict.ng .vv{color:#b91c1c}
.verdict.wait .vv{font-size:15px;color:var(--sub)}
.verdict .vs{margin:8px 0 0;font-size:13px;line-height:1.7;color:var(--sub)}
.tesla{display:flex;gap:8px;margin:10px 0 0}
.tesla span{flex:1;text-align:center;padding:9px 0;border-radius:10px;
 font-size:14px;font-weight:800;border:1px solid}
.tesla span.y{background:#fff;border-color:#a7f3d0;color:#047857}
.tesla span.n{background:#fff;border-color:var(--border);color:#cbd5e1}
.mrinote{font-size:11.5px;line-height:1.7;color:var(--muted);
 background:#f8fafc;border-radius:10px;padding:10px 12px;margin-top:12px}

/* ===== 各タブのページ見出し（上部余白の確保） ===== */
.pagehead{padding:calc(env(safe-area-inset-top) + 14px) 0 2px;margin:0 0 14px;
 border-bottom:1px solid var(--border)}
.pagehead h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
.pagehead p{margin:4px 0 12px;font-size:12.5px;line-height:1.6;color:var(--muted)}
#secProducts,#secAlgos,#secMri{padding-top:2px}

.cmp .mk.none dd{color:var(--muted)}
.cmp .mk.none .dash{opacity:.55}
/* ===== 一覧表：タップで開閉 ===== */
.cmp{background:var(--card);border:1px solid var(--border);border-radius:13px;
 margin-bottom:8px;overflow:hidden}
.cmp>button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
 background:none;border:0;padding:13px 14px;cursor:pointer}
.cmp>button:active{background:#f8fafc}
.cmp .ctxt{flex:1;min-width:0}
.cmp b{display:block;font-size:14.5px;font-weight:800;color:var(--ink);line-height:1.4}
.cmp small{display:block;margin-top:3px;font-size:11.5px;color:var(--muted)}
.cmp .cnt{flex:0 0 auto;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;
 background:#ecfdf5;color:var(--teal-d)}
.cmp .arw{flex:0 0 12px;color:var(--muted);transition:transform .18s ease}
.cmp.open .arw{transform:rotate(90deg)}
.cmp .cbody{display:none;padding:0 14px 13px;border-top:1px solid var(--border)}
.cmp.open .cbody{display:block}
.cmp .mk{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #f1f5f9}
.cmp .mk:last-child{border-bottom:0}
.cmp .mk dt{flex:0 0 92px;font-size:11.5px;font-weight:800;color:var(--teal-d);
 letter-spacing:.01em;padding-top:1px}
.cmp .mk dd{margin:0;flex:1;font-size:13.5px;line-height:1.65;color:var(--ink)}
.cmp .cnote{margin:11px 0 0;font-size:12px;line-height:1.7;color:var(--sub);
 background:#f8fafc;border-radius:9px;padding:9px 11px}

   <div class="suggestbox" id="suggest"></div>
  </div>

    <div class="menu">
     <button id="refreshBtn">☁ 最新版に更新（マスター再取得）</button>

     <button id="importBtn">変更を読み込み</button>
     <button id="resetBtn" class="danger">変更をリセット（マスターに戻す）</button>
    </div>
   </details>
  </div>
 </div>
</header>

":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"洞不全症候群の一型で、徐脈と心房頻拍/心房細動などの頻脈が交互に出現する。頻拍停止直後の長い心停止が失神の原因となる。","tags":"Clinical / PM / ICD / CRT / General / bradycardia-tachycardia / syndrome / AF"},{"term":"心外膜リード","en":"epicardial lead","abbr":"","cat":"リード","device":"PM / ICD / CRT","maker":"General","short":"開胸や胸腔鏡で心臓の外側（心外膜）に縫着・固定するリード。経静脈アプローチが困難な例や、小児・先天性心疾患などで用いられる。閾値が高くなりやすく、経年的な上昇にも注意する。","tags":"Lead / PM / ICD / CRT / General / epicardial / lead / threshold / capture"},{"term":"心室ペーシング","en":"ventricular pacing","abbr":"VP","cat":"ペーシング","device":"PM","maker":"General","short":"右室、左室、His束/左脚領域などから心室を電気刺激すること。刺激部位によりQRS波形と興奮伝播が変わる。","tags":"PM / General / ventricular / pacing / threshold / capture"},{"term":"心室リード","en":"ventricular lead","abbr":"RV lead","cat":"リード","device":"PM / ICD / CRT","maker":"General","short":"心室のセンシング・ペーシングに用いるリード。通常はRV leadを指すが、用途によりLV/CSP leadも含む。ICDではショックコイルを備えたリードを用いる。","tags":"Lead / PM / ICD / CRT / General / ventricular / lead / threshold / capture"},{"term":"心内膜ペーシング","en":"endocardial pacing","abbr":"","cat":"ペーシング","device":"PM","maker":"General","short":"心腔内に置いた電極から心内膜側を刺激する一般的な経静脈ペーシング。開胸して心外膜側から刺激する心外膜ペーシングと対になる。","tags":"PM / General / endocardial / pacing / threshold / capture"},{"term":"心内膜リード","en":"endocardial lead","abbr":"","cat":"リード","device":"PM / ICD / CRT","maker":"General","short":"心腔内の心内膜面に接して留置されるペーシング/センシングリード。経静脈的に挿入する通常のリードがこれにあたる。","tags":"Lead / PM / ICD / CRT / General / endocardial / lead / threshold / capture"},{"term":"心拍出量","en":"cardiac output","abbr":"CO","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"心臓が1分間に送り出す血液量。1回拍出量×心拍数で決まり、房室同期や適切なレートが保たれると増える。ペースメーカ設定が血行動態に影響する理由。房室同期と適切なレートの確保が設定上の目標となる。","tags":"Clinical / PM / ICD / CRT / General / cardiac / output"},{"term":"心房キック","en":"atrial kick","abbr":"","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"心室拡張末期の心房収縮によって心室充満が追加される成分。AV同期の意義に関係する。安静時でも心拍出量の2割前後を担い、拡張障害があるとさらに重要。","tags":"Clinical / PM / ICD / CRT / General / atrial / kick"},{"term":"心房・心室順次ペーシング","en":"atrio-ventricular sequential pacing","abbr":"DVI","cat":"モード","device":"PM","maker":"General","short":"心房刺激後に設定AV delayを置いて心室刺激するAV sequential pacing。房室同期が保たれ、心房キックを活かせる。","tags":"PM / General / atrio-ventricular / sequential / pacing / threshold / capture"},{"term":"心房用Jリード","en":"atrial J lead","abbr":"","cat":"リード","device":"PM / ICD / CRT","maker":"General","short":"先端がJ字状に湾曲した心房リード。右心耳に引っ掛けて安定して留置できる形状で、受動的固定で用いられることが多い。右房が拡大した症例では固定が不安定になることがある。","tags":"Lead / PM / ICD / CRT / General / atrial / lead / threshold / capture"},{"term":"スタイレット","en":"stylet","abbr":"","cat":"植込み・手技","device":"PM / ICD / CRT","maker":"General","short":"リード内腔に通して操作性と形状を与える細い鋼線。挿入や位置決めの際に用い、留置後は抜去する。先端を曲げて向きを調整できる。血液が付着して内腔で凝固すると操作が困難になる。","tags":"Procedure / PM / ICD / CRT / General / stylet / threshold / capture"},{"term":"生体適性","en":"biocompatibility","abbr":"","cat":"デバイス構造","device":"PM / ICD / CRT","maker":"General","short":"材料が体内で過度な炎症・毒性・血栓形成等を起こしにくい性質。biocompatibility。金属・樹脂を選定するうえで欠かせない条件となる。","tags":"Device / PM / ICD / CRT / General / biocompatibility"},{"term":"生理的ペーシング","en":"physiological pacing","abbr":"","cat":"ペーシング","device":"PM","maker":"General","short":"AV同期や自然な心室興奮順序など、本来の生理に近い循環動態を目指すペーシング概念。現在はCSPや自己伝導温存機能もこの概念に含む。","tags":"PM / General / physiological / pacing / threshold / capture physiological pacing DDD 右室ペーシング率 自己房室伝導維持 CSP 非生理的"},{"term":"絶縁体","en":"insulation","abbr":"","cat":"リード","device":"PM / ICD / CRT","maker":"General","short":"導線を覆う高抵抗の被膜。**素材はシリコン、ポリウレタン、両者の長所を融合した Optim の3系統**が使われる。損傷すると電流が漏れてインピーダンスが低下し、オーバーセンシングや捕捉不全を招く。損傷時は極性を双極から単極へ変更して一時的にしのぐことがある。**リード不具合の原因としては絶縁体のトラブルが最大**で、絶縁不良が全体の56％を占めたという報告がある（Kleeman ほか、Circulation 2007）。","tags":"Lead / PM / ICD / CRT / General / insulation / noise / oversensing / lead trouble / threshold / capture シリコン ポリウレタン Optim 絶縁素材 56% Kleeman 2007"},{"term":"絶対不応期","en":"absolute refractory period","abbr":"","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"直前の興奮の直後で、どれほど強い刺激でも新たな活動電位を生じない期間。心筋を保護し、期外刺激による頻拍を防ぐ生理的な仕組み。どれほど強い刺激でも興奮しない。","tags":"EP / PM / ICD / CRT / General / absolute / refractory / period ARP blanking"},{"term":"設定レート","en":"rate / pacing rate","abbr":"","cat":"AV・タイミング","device":"PM","maker":"General","short":"デバイスにプログラムするペーシング速度。下限レートや上限レート等がある。下限・上限追従・センサー上限で目的が異なる。","tags":"PM / General / rate / pacing / threshold / capture"},{"term":"センシング不全","en":"sensing failure","abbr":"","cat":"センシング","device":"PM / ICD / CRT","maker":"General","short":"適切な自己波認識ができない状態の総称。undersensingとoversensingの双方を含む。心電図モニタや遠隔モニタリングの記録で発見する。","tags":"Trouble / PM / ICD / CRT / General / sensing / failure / noise / oversensing / lead trouble"},{"term":"総機能回復時間","en":"total recovery time","abbr":"","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"オーバードライブ刺激終了から最初の自己興奮までを含めた洞結節機能評価指標の古典的表現。現在は洞結節機能回復時間として評価することが多い。","tags":"EP / PM / ICD / CRT / General / total / recovery / time"},{"term":"双極リード","en":"bipolar lead","abbr":"","cat":"リード","device":"PM / ICD / CRT","maker":"General","short":"tip と ring の2電極間でセンシング／刺激するリード。**利点は EMI（電磁干渉）の影響を受けにくいこと、双極・単極を切り替えられるプログラミングの柔軟性。欠点はリード径が太くなること、心電図上のスパイクが小さく確認しづらいこと。**現在の標準構成。","tags":"Lead / PM / ICD / CRT / General / bipolar / lead / threshold / capture バイポーラ bipolar EMI 電磁干渉 プログラミングの柔軟性 切り替え リード径 スパイク"},{"term":"脱分極","en":"depolarization","abbr":"","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"心筋細胞膜電位が興奮方向へ変化し、活動電位が成立する過程。心電図ではP波やQRSとして現れる。","tags":"EP / PM / ICD / CRT / General / depolarization"},{"term":"単極リード","en":"unipolar lead","abbr":"","cat":"リード","device":"PM / ICD / CRT","maker":"General","short":"リード tip とデバイス缶の間で刺激／センシングする構成。**利点は構造が単純で（コイルが1本）耐久性に優れること、リード径が細いこと、スパイクが大きく確認しやすいこと。欠点は Twitching（本体付近の筋刺激）を起こす可能性があることと、ノイズを拾いやすいこと。**","tags":"Lead / PM / ICD / CRT / General / unipolar / lead / threshold / capture ユニポーラ unipolar 構造が単純 コイル1本 耐久性 細い スパイク Twitching ノイズ"},{"term":"チタン","en":"titanium","abbr":"","cat":"デバイス構造","device":"PM / ICD / CRT","maker":"General","short":"CIED本体ケースに広く用いられる、生体適合性と耐食性に優れた金属。単極ペーシングでは対極（陽極）としても働く。","tags":"Device / PM / ICD / CRT / General / titanium"},{"term":"デマンドペーシング","en":"demand pacing","abbr":"","cat":"モード","device":"PM","maker":"General","short":"自己心拍があるときは刺激を抑制し、必要時のみ刺激するペーシング。自己脈との競合やspike on Tを避けられる。","tags":"PM / General / demand / pacing / threshold / capture"},{"term":"電磁干渉","en":"electromagnetic interference","abbr":"EMI","cat":"MRI・EMI","device":"PM / ICD / CRT","maker":"General","short":"電磁場によってデバイスが不要信号を感知したり動作が一時的に変化する現象。EMI。多くはノイズが人体を介して混入して生じる。","tags":"Trouble / PM / ICD / CRT / General / electromagnetic / interference 電磁障害 EMI electromagnetic interference 電気干渉 electrical interference"},{"term":"電池交換時期","en":"elective replacement time","abbr":"ERT","cat":"電池","device":"PM / ICD / CRT","maker":"General","short":"電池消耗が進み、計画的なジェネレータ交換を検討する段階。ERT/RRTなど表現はメーカーで異なる。機種ごとの基準を確認し、余裕をもって計画する。","tags":"Battery / PM / ICD / CRT / General / elective / replacement / time"},{"term":"洞機能不全症候群","en":"sick sinus syndrome","abbr":"SSS","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"洞徐脈、洞停止、洞房ブロック、徐脈頻脈症候群などを含む洞結節機能障害。SSS/SND。症状と徐脈の関連が確認できればペーシングの適応となる。","tags":"Clinical / PM / ICD / CRT / General / sick / sinus / syndrome"},{"term":"洞結節機能回復時間","en":"sinus node recovery time","abbr":"SNRT / SRT","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"心房オーバードライブ刺激終了から最初の洞性興奮までの時間。SNRT。延長は洞機能不全を示唆する。","tags":"EP / PM / ICD / CRT / General / sinus / node / recovery / time"},{"term":"導体","en":"conductor","abbr":"","cat":"リード","device":"PM / ICD / CRT","maker":"General","short":"リード内で電流を伝える芯線。断線するとインピーダンスが上昇し、出力不全や雑音の原因になる。複数の線を撚った構造は屈曲による疲労に強い。鎖骨下や三尖弁輪など屈曲を受ける部位で損傷しやすい。","tags":"Lead / PM / ICD / CRT / General / conductor / threshold / capture"},{"term":"2度房室ブロック","en":"2nd degree A-V block","abbr":"","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"心房興奮の一部が心室へ伝導しない房室ブロック。Mobitz I/IIなどに分類する。Mobitz II型は高度な障害で、恒久ペーシングを要することが多い。","tags":"Clinical / PM / ICD / CRT / General / nd / degree / A-V / block"},{"term":"バースト持続時間","en":"burst duration","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"ATPの1シーケンスで刺激列を継続する時間/拍数に関する設定。拍数が多いほど停止率は上がるが、加速のリスクも増える。","tags":"ICD / General / burst / duration"},{"term":"バースト・レート","en":"burst rate","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"ATP刺激列の速さ。多くは頻拍周期に対する割合または刺激間隔で設定する。速いほど停止しやすいが、頻拍の加速や細動化を招きうる。","tags":"ICD / General / burst / rate"},{"term":"パルス","en":"pulse / impulse","abbr":"","cat":"ペーシング","device":"PM","maker":"General","short":"デバイスが心筋を刺激するために放出する電気パルス。振幅（電圧）と幅（時間）で刺激エネルギーが決まり、心電図上はスパイクとして現れる。捕捉には閾値を超える出力が必要。閾値を下回ると心筋は反応せず、スパイクのみが記録される。","tags":"PM / General / pulse / impulse / threshold / capture"},{"term":"パルス幅","en":"pulse width / pulse duration","abbr":"Pulse width","cat":"ペーシング","device":"PM","maker":"General","short":"1回の刺激パルスを通電する時間（ms）。出力電圧とともに刺激エネルギーを決め、閾値に対する安全域を確保するよう設定する。幅を延ばすと捕捉しやすくなるが、電池消耗も増える。標準は0.4ms前後。強さ-時間曲線の平坦部にあたる。","tags":"PM / General / pulse / width / duration / threshold / capture インパルス持続時間 Pulse width impulse duration"},{"term":"パルスレート","en":"pulse rate","abbr":"","cat":"AV・タイミング","device":"PM","maker":"General","short":"1分あたりの刺激回数。基本となるペーシング頻度で下限レートと連動する。運動時はレート応答や自己P波の追従によって、これより速いレートで刺激されることがある。レートヒストグラムで実際の分布を確認できる。","tags":"PM / General / pulse / rate / threshold / capture"},{"term":"ピール・アウェイ・シース","en":"peel-away sheath / split-sheath lead introducer","abbr":"","cat":"植込み・手技","device":"PM / ICD / CRT","maker":"General","short":"リード挿入後に縦方向へ裂いて除去できる静脈アクセス用イントロデューサーシース。リードを抜かずにシースだけを除去できる。","tags":"Procedure / PM / ICD / CRT / General / peel-away / sheath / split-sheath / lead / threshold / capture"},{"term":"ヒス束","en":"His bundle","abbr":"","cat":"不整脈・EP","device":"PM / CRT / CSP","maker":"General","short":"房室結節から左右脚へ分岐するまでの刺激伝導路。ここを直接刺激するヒス束ペーシング（HBP）は、生理的な心室興奮が得られる伝導系ペーシングの一つ。線維三角を貫いて心室へ向かう。","tags":"CSP / PM / CRT / General / His / bundle / threshold / capture AVB 房室束 中心線維体"},{"term":"ヒステレシス","en":"hysteresis","abbr":"","cat":"AV・タイミング","device":"PM","maker":"General","short":"自己心拍を優先するため、自己波後に一時的に基本レートより低いレートまで待つ機能。不要なペーシングを減らせるが、待つ間の心拍数は低くなる。","tags":"PM / General / hysteresis / threshold / capture ヒステリシス hysteresis"},{"term":"不応期","en":"refractory period","abbr":"","cat":"AV・タイミング","device":"PM","maker":"General","short":"特定イベント後にセンシング入力を無視または分類限定する時間。生理的不応期とデバイス不応期を区別する。心筋の生理的不応期とデバイス設定上の不応期は別物。","tags":"PM / General / refractory / period / threshold / capture"},{"term":"副伝導路","en":"accessory pathway","abbr":"","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"正常刺激伝導系以外に心房と心室などを結ぶ異常伝導路。WPWなどでリエントリー基質となる。Kent束が代表で、房室回帰性頻拍の回路となる。","tags":"EP / PM / ICD / CRT / General / accessory / pathway"},{"term":"ペーシング不全","en":"pacing failure","abbr":"","cat":"トラブル","device":"PM / ICD / CRT","maker":"General","short":"必要なペーシング刺激が出ない、または刺激が出てもcaptureしない状態の総称。出力不全と捕捉不全に分けて原因を切り分ける。","tags":"Trouble / PM / ICD / CRT / General / pacing / failure / threshold / capture"},{"term":"ペースメーカ依存","en":"pacemaker dependent","abbr":"","cat":"フォロー","device":"PM / ICD / CRT","maker":"General","short":"安全な自己調律が乏しく、ペーシング停止で重大な徐脈/無収縮を生じ得る状態。閾値測定や交換時はバックアップ手段を用意する。","tags":"Clinical / PM / ICD / CRT / General / pacemaker / dependent Pacing dependency Pacemaker dependency"},{"term":"ペースメーカ介在性頻拍","en":"pacemaker-mediated tachycardia","abbr":"PMT","cat":"トラブル","device":"PM / ICD / CRT","maker":"General","short":"逆行性VA伝導を心房感知し、心室追従が連鎖して持続するendless-loop tachycardia。PMT。PVARP延長やPMT対応機能で輪を断ち切る。","tags":"Trouble / PM / ICD / CRT / General / pacemaker-mediated / tachycardia / PMT ペースメーカ誘発性頻拍 pacemaker-induced tachycardia PMT ELT endless loop 逆行性伝導 PVARP TARP PVC PMT防止機能 PMT ペースメーカ誘発性頻拍 pacemaker induced tachycardia PMT termination PMT対応"},{"term":"ペースメーカ症候群","en":"pacemaker syndrome","abbr":"","cat":"トラブル","device":"PM / ICD / CRT","maker":"General","short":"AV/VA同期不良などにより、動悸、頸部拍動、低血圧、倦怠感等を来す血行動態不良。VV **締めすぎると絶縁体を傷めるため、適度な固定にとどめる。","tags":"Lead / PM / ICD / CRT / General / suture / sleeve / threshold / capture シリコン Suture Sleeve"},{"term":"URL","en":"Upper Rate Limit","abbr":"URL","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"上限レートの総称。心房追従上限（MTR）とセンサー駆動上限（MSR）を文脈で区別する。どちらを指すかは機種の表記で確認する。","tags":"PM / ICD / CRT / General / Upper / Rate / Limit / threshold / capture"},{"term":"MSR","en":"Maximum Sensor Rate","abbr":"MSR","cat":"レート応答","device":"PM / ICD / CRT","maker":"General","short":"レートレスポンスによるセンサー駆動レートの上限。Maximum Sensor Rate。高すぎると軽い動作で心拍が上がりすぎる。","tags":"PM / ICD / CRT / General / Maximum / Sensor / Rate"},{"term":"SAV","en":"Sensed AV Delay","abbr":"SAV","cat":"AV・タイミング","device":"PM / CRT","maker":"General","short":"心房自己波（AS）から心室刺激までのAV delay。Sensed AV Delay。P波感知の遅れを見込んでPAVより短く設定する。","tags":"PM / CRT / General / Sensed / AV / Delay / threshold / capture"},{"term":"PAV","en":"Paced AV Delay","abbr":"PAV","cat":"AV・タイミング","device":"PM / CRT","maker":"General","short":"心房刺激（AP）から心室刺激までのAV delay。Paced AV Delay。刺激と同時に計時が始まるためSAVより長めにする。","tags":"PM / CRT / General / Paced / AV / Delay / threshold / capture"},{"term":"PVARP","en":"Post-Ventricular Atrial Refractory Period","abbr":"PVARP","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"心室イベント後、心房イベントを追従トリガーとして扱わない不応期。PMT/FFRW対策に重要。長すぎるとTARPが延び、上限追従レートが制限される。","tags":"PM / ICD / CRT / General / Post-Ventricular / Atrial / Refractory / Period / PMT 心室後心房不応期 post ventricular atrial refractory period"},{"term":"TARP","en":"Total Atrial Refractory Period","abbr":"TARP","cat":"AV・タイミング","device":"PM / CRT","maker":"General","short":"AV delayとPVARPを合わせた、心房イベントの追従可能上限に影響する総不応期間。2:1ブロックレート＝60,000÷TARP（ms）で境界が計算できる。","tags":"PM / CRT / General / Total / Atrial / Refractory / Period"},{"term":"モードスイッチ","en":"Automatic Mode Switch","abbr":"AMS","cat":"モード","device":"PM / ICD / CRT","maker":"General","short":"AMS。AT/AF検出時にDDD(R)からDDI/VDI等へ自動切替する機能。検出基準と復帰条件はメーカーごとに異なる。","tags":"PM / ICD / CRT / General / Automatic / Mode / Switch / threshold / capture / AF AMS AMS Automatic Mode Switch"},{"term":"VP%","en":"Ventricular Pacing Percentage","abbr":"VP%","cat":"フォロー","device":"PM / ICD / CRT","maker":"General","short":"観察期間中の心室ペーシング割合。高いVP%は適応や心機能、CSP/CRTの必要性と合わせて解釈する。洞不全では低いほど望ましく、CRTでは高く保つ。","tags":"Follow-up / PM / ICD / CRT / General / Ventricular / Pacing / Percentage"},{"term":"AP%","en":"Atrial Pacing Percentage","abbr":"AP%","cat":"フォロー","device":"PM / ICD / CRT","maker":"General","short":"観察期間中の心房ペーシング割合。洞機能やLRL、rate response設定の影響を受ける。下限レートやレート応答の設定に影響される。","tags":"Follow-up / PM / ICD / CRT / General / Atrial / Pacing / Percentage"},{"term":"FFRW","en":"Far-Field R-Wave","abbr":"FFRW","cat":"センシング","device":"PM / ICD / CRT","maker":"General","short":"心房チャネルが心室脱分極（far-field R wave）を感知する現象。誤AMS/AHREの原因となる。PVABの設定で防ぎ、長すぎる設定は心房感知の欠落を招く。","tags":"Trouble / PM / ICD / CRT / General / Far-Field / R-Wave"},{"term":"TWOS","en":"T-Wave Oversensing","abbr":"TWOS","cat":"ICD","device":"ICD / CRT-D","maker":"General","short":"T波をR波として二重感知するT-wave oversensing。ICDでは不適切治療につながり得る。CRTでは両室ペーシング率の低下も招く。","tags":"Trouble / ICD / CRT-D / General / T-Wave / Oversensing / noise / oversensing / lead trouble T波オーバーセンシング R波振幅減少 QT延長 高カリウム 極性変更 フィルタ 再留置 T wave oversensing T波オーバーセンシング Twave oversensing"},{"term":"VT zone","en":"Ventricular Tachycardia Zone","abbr":"","cat":"ICD","device":"ICD / CRT-D","maker":"General","short":"心室頻拍として検出・治療判定するレート/周期帯。治療内容・判別・検出時間と一体で設定する。まずATPを試み、停止しなければショックへ移行する設定が一般的。","tags":"ICD / CRT-D / General / Ventricular / Tachycardia / Zone"},{"term":"VF zone","en":"Ventricular Fibrillation Zone","abbr":"","cat":"ICD","device":"ICD / CRT-D","maker":"General","short":"最も速い心拍数域に設定する検出ゾーン。心室細動を想定してショックを主体に治療するが、充電中ATP（Pain-Free）を併用できる機種もある。ここでは鑑別ロジックを効かせず、治療を優先する。","tags":"ICD / CRT-D / General / Ventricular / Fibrillation / Zone"},{"term":"NID","en":"Number of Intervals to Detect","abbr":"NID","cat":"ICD","device":"ICD / CRT-D","maker":"General","short":"頻拍と診断するまでに必要なinterval数。Number of Intervals to Detect。検出遅延/不要治療抑制に関係する。大きくすると自然停止する頻拍への不要な治療を減らせる。","tags":"ICD / CRT-D / General / Number / of / Intervals / to"},{"term":"ATP","en":"Antitachycardia Pacing","abbr":"ATP","cat":"ICD","device":"ICD / CRT-D","maker":"General","short":"頻拍より速い短いペーシング列でリエントリー性VT停止を狙う抗頻拍ペーシング。無痛で停止できるため、ショックの前に必ず試みる価値がある。","tags":"ICD / CRT-D / General / Antitachycardia / Pacing 自動抗頻拍ペーシング ATP automatic antitachycardia pacing"},{"term":"ATP during charging","en":"ATP during charging","abbr":"","cat":"ICD","device":"ICD / CRT-D","maker":"General","short":"VF/高速VTでショック充電中にATPを行い、停止すればショック回避を狙う機能。停止すれば充電を中止でき、患者の負担を減らせる。","tags":"ICD / CRT-D / General / ATP / during / charging"},{"term":"SVT discrimination","en":"Supraventricular Tachycardia Discrimination","abbr":"","cat":"ICD","device":"ICD / CRT-D","maker":"General","short":"心房情報、AV関係、形態、規則性、発症様式などでSVTとVTを鑑別し不適切治療を減らすロジック。心房リードがあると鑑別精度が上がる。","tags":"ICD / CRT-D / General / Supraventricular / Tachycardia / Discrimination / noise / oversensing / lead trouble / AF"},{"term":"Shock impedance","en":"High-voltage shock impedance","abbr":"","cat":"ICD","device":"ICD / CRT-D","maker":"General","short":"除細動コイルを含む高電圧ショック経路のインピーダンス。HV lead/coil/接続評価に用いる。高値はコイル断線、低値は絶縁不良を示唆する。","tags":"ICD / CRT-D / General / High-voltage / shock / impedance"},{"term":"Electrical storm","en":"Electrical storm","abbr":"","cat":"ICD","device":"ICD / CRT-D","maker":"General","short":"短期間にVT/VFが反復し、複数回のICD治療や緊急介入を要する状態。鎮静・抗不整脈薬・原因是正・アブレーションを組み合わせる。","tags":"Clinical / ICD / CRT-D / General / Electrical / storm"},{"term":"BiV%","en":"Biventricular pacing percentage","abbr":"","cat":"フォロー","device":"CRT","maker":"General","short":"観察期間中の両室ペーシング割合。CRTでは高い実効ペーシング率の維持が重要。一般に98％以上を目標とする。","tags":"CRT / General / Biventricular / pacing / percentage / threshold / capture / AF 両心室ペーシング率 BiV pacing percentage"},{"term":"Effective CRT","en":"Effective CRT pacing","abbr":"","cat":"CRT・CSP","device":"CRT","maker":"General","short":"単なるVPカウントでなく、融合/偽融合を除き実際に再同期に寄与する刺激が成立したかを見る概念。見かけのペーシング率が高くても実効率は低いことがある。","tags":"CRT / General / Effective / pacing"},{"term":"LV lead","en":"Left ventricular lead","abbr":"","cat":"CRT・CSP","device":"CRT","maker":"General","short":"冠静脈洞を経由して左室側壁の静脈に留置する左室リード。CRTで左室を刺激し、両室の同期を回復させる。刺激部位を選べる四極リードが主流。心外膜側から刺激するため閾値が高くなりやすい。","tags":"CRT / General / Left / ventricular / lead / threshold / capture 左室リード CS lead 左室 CS lead 冠静脈洞リード coronary sinus lead"},{"term":"LV threshold","en":"Left ventricular pacing threshold","abbr":"","cat":"CRT・CSP","device":"CRT","maker":"General","short":"選択したLVベクトルで左室心筋をcaptureできる最小刺激強度。上昇するとそのまま両室ペーシングの欠落につながる。","tags":"CRT / General / Left / ventricular / pacing / threshold / capture"},{"term":"CSP","en":"Conduction System Pacing","abbr":"CSP","cat":"CRT・CSP","device":"PM / CRT","maker":"General","short":"His束や左脚領域を刺激し、刺激伝導系を利用して生理的な心室興奮を目指すConduction System Pacing。右室ペーシングによる非同期収縮を避けられる。","tags":"CSP / PM / CRT / General / Conduction / System / Pacing / threshold / capture conduction system pacing 刺激伝導系ペーシング His束ペーシング 左脚ペーシング"},{"term":"HBP","en":"His Bundle Pacing","abbr":"HBP","cat":"CRT・CSP","device":"PM / CRT","maker":"General","short":"His束を直接/近傍から捕捉するHis Bundle Pacing。閾値が高くなりやすく、心房波オーバーセンシングも課題。","tags":"CSP / PM / CRT / General / His / Bundle / Pacing / threshold / capture クラスIIa クラスIIb EF36-50 フォーカスアップデート 2021年 シースデリバー"},{"term":"LBBP","en":"Left Bundle Branch Pacing","abbr":"LBBP","cat":"CRT・CSP","device":"PM / CRT","maker":"General","short":"左脚の直接captureを確認して行うLeft Bundle Branch Pacing。ヒス束ペーシングが無効な場合の選択肢となる。","tags":"CSP / PM / CRT / General / Left / Bundle / Branch / Pacing / threshold / capture left bundle branch pacing 左脚ペーシング"},{"term":"LBBAP","en":"Left Bundle Branch Area Pacing","abbr":"LBBAP","cat":"CRT・CSP","device":"PM / CRT","maker":"General","short":"深部中隔から左脚領域を刺激するLeft Bundle Branch Area Pacing。LBB captureを確認できないLV septal pacingも包括し得る。閾値が安定しやすく、近年広く行われている。ターゲットはRAO30度でヒス電位から心尖方向に15〜35mm、三尖弁輪の中隔尖の下で、LAO30度で中隔に垂直に貫通する向きに留置する。","tags":"CSP / PM / CRT / General / Left / Bundle / Branch / Area / threshold / capture 左脚ペーシング クラスIIb ヒス束無効時 2021年ガイドライン left bundle branch area pacing 左脚領域ペーシング RAO30 LAO30 15mm 35mm 三尖弁輪 中隔尖 ターゲット部位 Abbott"},{"term":"LVAT","en":"Left Ventricular Activation Time","abbr":"LVAT","cat":"CRT・CSP","device":"PM / CRT","maker":"General","short":"左室活性化時間。ペーシング刺激からV5またはV6誘導のR波ピークまでの時間として計測し、80ms未満が目安。左脚が捕捉できているかの判断材料になる。高出力でも低出力でも一貫していることが重要で、LVATが短く一貫していてインピーダンスが高いままなら、リード本体を回転させて固定を進める。","tags":"CSP / PM / CRT / General / Left / Ventricular / Activation / Time / threshold / capture left ventricular activation time 左室興奮時間 LVAT 80ms V5 V6 R波ピーク 高出力 低出力 一貫 リード固定 Abbott LBBAP"},{"term":"V6 RWPT","en":"V6 R-wave Peak Time","abbr":"V6 RWPT","cat":"CRT・CSP","device":"PM / CRT","maker":"General","short":"刺激スパイクからV6誘導R波頂点までの時間。LBB capture評価に用いる。V1誘導はRV中隔、V6誘導は外側LVを観察しており、両者のRWPTの差（V6−V1）で判定する。差がわずかなら心筋／LV中隔での捕捉（脱分極は同時）、44msより大きければセレクティブLBBAP、33msより大きければノンセレクティブかセレクティブのどちらかが達成されている。","tags":"CSP / PM / CRT / General / V6 / R-wave / Peak / Time / threshold / capture V6 R wave peak time V6-V1 RWPT差 44ms 33ms interpeak V1 RV中隔 外側LV セレクティブ ノンセレクティブ"},{"term":"Selective HBP","en":"Selective His Bundle Pacing","abbr":"","cat":"CRT・CSP","device":"PM / CRT","maker":"General","short":"His束のみがcaptureされ、局所心室筋の直接captureを伴わないHBP。刺激から興奮開始までにわずかな間隔が見られる。","tags":"CSP / PM / CRT / General / Selective / His / Bundle / Pacing / threshold / capture"},{"term":"Non-selective HBP","en":"Non-selective His Bundle Pacing","abbr":"","cat":"CRT・CSP","device":"PM / CRT","maker":"General","short":"ヒス束と周囲の心筋を同時に捕捉するヒス束ペーシング。QRSにデルタ様の立ち上がりを伴い、選択的HBPより閾値が低いことが多いが、波形はやや幅広くなる。選択的HBPより閾値が低いことが多い。","tags":"CSP / PM / CRT / General / Non-selective / His / Bundle / Pacing / threshold / capture"},{"term":"Leadless pacemaker","en":"Leadless Pacemaker","abbr":"","cat":"リードレス","device":"Leadless","maker":"General","short":"経静脈リードと皮下ポケットを用いず、心腔内へ本体を直接留置するペースメーカ。リード断線やポケット感染という従来の弱点を回避できる。","tags":"Leadless / General / Pacemaker"},{"term":"Micra","en":"Micra Transcatheter Pacing System","abbr":"","cat":"リードレス","device":"Leadless","maker":"Medtronic","short":"Medtronicの右室内留置型リードレスペースメーカ製品群。長さ約25.9mm・容積1cc・重さ1.75gのカプセル型。","tags":"Leadless / Medtronic / Micra / Transcatheter / Pacing / System ニチノールタイン FlexFix リトリーバルヘッド 27Fr 大腿静脈 Micra TPS 25.9mm 20Fr 1cc Tip-Ring18mm 心室中壁 穿孔 VDD"},{"term":"Micra AV","en":"Micra AV","abbr":"","cat":"リードレス","device":"Leadless","maker":"Medtronic","short":"加速度センサーで心房機械イベントを検出し、VDD様のAV同期を目指すMicra系リードレスPM。心房リードなしで房室ブロックにも対応できる。","tags":"Leadless / Medtronic / Micra / AV / threshold / capture"},{"term":"Aveir VR","en":"Aveir VR","abbr":"","cat":"リードレス","device":"Leadless","maker":"Abbott","short":"Abbott AVEIRの心室用リードレスペースメーカ（LSP112V）。全長38.0mm・容積1.1cc・質量2.4g・外径6.5mm。シングルヘリックス設計で、1.63mmのアウターヘリックスが固定と先端電極を兼ねる。バッテリー容量243mAh、ISO規格設定（VVIR 60bpm・2.5V／0.4ms・600Ω・100％ペーシング）に基づく予測寿命は10.3年。レート応答は温度ベース。固定前のプレマッピングが可能で、専用リトリーバルカテーテルによる抜去に対応する。推奨留置部位は右心室の低位中隔から中隔。X線コードは NT。","tags":"Leadless / Abbott / Aveir / VR LSP112V 38.0mm 1.1cc 2.4g 6.5mm 243mAh 10.3年 10.3 years 温度ベース 低位中隔 シングルヘリックス 1.63mm NT アヴェイル LP"},{"term":"Aveir AR","en":"Aveir AR","abbr":"","cat":"リードレス","device":"Leadless","maker":"Abbott","short":"Abbott AVEIRの心房用リードレスペースメーカ（LSP201A）。全長32.2mm・外径6.5mm、デュアルヘリックス設計（アウターヘリックス1.63mmで固定、インナーヘリックスが固定性・安定性を高めると同時に先端電極として機能）。推奨留置部位は右心耳基部。単独では AAI(R)、心室用 AVEIR VR と組み合わせると AAI(R)＋VVI または DDD(R) で使える。第2世代の AVEIR AR2（LSP203A）が後継。植込み3か月後の有効性エンドポイント（閾値≦3.0V@0.4ms かつ P波高値≧1mV）の達成率は90.2％、波高値を0.5mV以上とした場合は95.2％。留置部位は右心耳基部が推奨で、IDE 試験では植込み全体の61.1％がここだった。深部右心耳は脱落率が高く（4.4％ 対 0.9％）、組織が薄くパーフォレーションのリスクがあり、i2i 通信の距離も延びる。植込み時に心房の閾値が大幅に上昇することは珍しくない。","tags":"Leadless / Abbott / Aveir / AR LSP201A AR2 LSP203A アヴェイル LP AAI AAI+VVI DDD 32.2mm 6.5mm デュアルヘリックス 1.63mm 右心耳基部 90.2% 95.2% 3.0V 1mV 0.5mV 61.1% 4.4% 0.9% 深部右心耳 脱落 閾値上昇 分界稜"},{"term":"Aveir DR","en":"Aveir DR","abbr":"","cat":"リードレス","device":"Leadless","maker":"Abbott","short":"AVEIR ARとVRを組み合わせ、i2i通信でbeat-to-beatのデュアルチャンバー同期を行うシステム。リードレスでDDD様の動作を可能にした。AAI(R)＋VVI モードを選べば、心房ペーシング主体で心室はバックアップとなり、両デバイスの寿命延長が期待できる。AVEIR DR i2i スタディでは、デュアルチャンバの手術成功率98.3％、複数の姿勢と歩行で観察された平均房室同期97.3％、安全性達成率90.3％、心房用LPの有効性エンドポイント90.2％が報告されている（NEJM 2023）。デュアルチャンバのアルゴリズムとして AMS（心内心電図を最大4つ保存）・VIP・ヒステリシス・A Pace on PMT を持つ。植込みは「検査室・患者の準備」と「静脈アクセス」（各1回）に続き、各デバイス共通の6ステップ（①カテーテルとデバイスの準備 ②血管への挿入 ③目標位置までの操作 ④マッピングと固定 ⑤テザーとテスト ⑥リリース・取外し・プログラミング）を、心室用LP → 心房用LP の順に繰り返す。","tags":"Leadless / Abbott / Aveir / DR / threshold / capture AAI+VVI DDD(R) i2i 4/7 i2i設定レベル1〜7 寿命延長 バックアップ 98.3% 手術成功率 97.3% AV同期 90.3% 安全性 90.2% 有効性 NEJM 2023 Knops アップグレーダブル ペアリング AMS VIP A Pace on PMT 6ステップ 植込み手順 心室先行"},{"term":"i2i communication","en":"Implant-to-Implant communication","abbr":"","cat":"リードレス","device":"Leadless","maker":"Abbott","short":"AVEIRの心房・心室デバイス間で、低エネルギーの導電性通信を用いて毎拍イベントを共有する技術。無線に比べ消費電力が少ないのが利点。データパルスは各ペーシングイベントまたはセンシングイベントと同時に送信されるため、ペーシングやセンシングそのものには影響しない。さまざまな姿勢で観察された平均房室（AV）同期率は95％以上とされる。通信出力は［i2i 設定レベル］1〜7 で設定し、植込み時にプログラマの［i2i 設定管理］で方向別（RV→RA／RA→RV）のスループット（％）と強度を自動評価して推奨レベルが提示される。レベル7にすると電池寿命が短くなる旨の警告が画面に出る。電池寿命表の条件「i2i＝4/7」はこのレベル4を指す。スループットは主に2デバイス間の距離と角度で決まり、RAO 30° でのボタン間距離 70mm 以下・相対角度 40° 以下が理想とされる。","tags":"Leadless / Abbott / Implant-to-Implant / communication i2i 4/7 i2i設定レベル 1〜7 スループット 強度 70mm 40度 V2A A2V 導電性通信 房室同期 DDD 毎心拍 データパルス 同時送信 95% AV同期率 beat-to-beat synchrony"},{"term":"Pre-mapping","en":"Pre-mapping","abbr":"","cat":"植込み・手技","device":"Leadless","maker":"General","short":"最終固定前に候補部位のセンシング・閾値・インピーダンス等を評価して留置位置を選ぶ工程。条件のよい留置部位を選ぶための工程。","tags":"Procedure / Leadless / General / Pre-mapping / threshold / capture"},{"term":"Retrieval","en":"Device retrieval","abbr":"","cat":"リードレス","device":"Leadless","maker":"General","short":"留置済みリードレスデバイス等を専用カテーテルで回収・抜去する手技。組織で覆われると回収は難しくなる。","tags":"Procedure / Leadless / General / Device / retrieval / threshold / capture"},{"term":"Remote monitoring","en":"Remote Device Monitoring","abbr":"","cat":"フォロー","device":"PM / ICD / CRT","maker":"General","short":"CIEDデータを家庭から自動/手動送信し、デバイス状態や不整脈イベントを遠隔管理する仕組み。緊急対応システムではないことを患者へ説明する。","tags":"Follow-up / PM / ICD / CRT / General / Remote / Device / Monitoring 遠隔モニタリング RM Home Monitoring 2008年 2010年 保険償還 早期発見"},{"term":"AT/AF burden","en":"Atrial Tachyarrhythmia Burden","abbr":"","cat":"フォロー","device":"PM / ICD / CRT","maker":"General","short":"一定期間に心房頻拍・心房細動が生じていた時間の割合（心房負荷）。遠隔モニタリングで追跡でき、抗凝固療法や治療方針を判断する材料になる。脳梗塞リスクの評価や抗凝固の判断材料になる。","tags":"Follow-up / PM / ICD / CRT / General / Atrial / Tachyarrhythmia / Burden / AF"},{"term":"AHRE","en":"Atrial High Rate Episode","abbr":"AHRE","cat":"フォロー","device":"PM / ICD / CRT","maker":"General","short":"CIEDが設定基準以上の高心房レートとして記録したエピソード。臨床的AFの確定診断とは同義ではない。心内電位を確認せずに臨床的AFと断定はできない。","tags":"Follow-up / PM / ICD / CRT / General / Atrial / High / Rate / Episode / AF"},{"term":"Capture management","en":"Automatic Capture Management","abbr":"","cat":"ペーシング","device":"PM / ICD / CRT","maker":"General","short":"定期的にcapture閾値を測定し、安全域を保ちながら出力を自動調整する機能の総称。過剰出力を避けて電池を節約しつつ、閾値上昇にも追従できる。","tags":"PM / ICD / CRT / General / Automatic / Capture / Management / threshold / capture"},{"term":"AutoCapture","en":"Automatic capture verification","abbr":"","cat":"ペーシング","device":"PM / ICD / CRT","maker":"General","short":"Abbott等で用いられるcapture確認/出力自動調整機能名。非capture時にbackup pulseを出す機構を持つ。閾値ぎりぎりまで出力を下げられ、電池寿命の延長につながる。","tags":"PM / ICD / CRT / General / Automatic / capture / verification / threshold オートキャプチャ 自動キャプチャ auto capture"},{"term":"MVP","en":"Managed Ventricular Pacing","abbr":"MVP","cat":"ペーシング","device":"PM","maker":"Medtronic","short":"Medtronicの心室ペーシング抑制アルゴリズム。AAI(R)ベース＋心室backupで自己AV伝導を優先し、必要時DDD(R)へ移行する。右室ペーシング率を大きく下げるが、RNRVASを誘発することがある。","tags":"Manufacturer / PM / Medtronic / Managed / Ventricular / Pacing RNRVAS対応 AAI DDD 自己伝導優先 右室ペーシング最小化 90%削減 心房細動40%抑制 AAI DDD 洞不全症候群"},{"term":"VIP","en":"Ventricular Intrinsic Preference","abbr":"VIP","cat":"ペーシング","device":"PM","maker":"Abbott","short":"AbbottのVentricular Intrinsic Preference。AV delayを動的に延長して自己AV伝導を検索し、不要なRV pacingを減らす。自己伝導が出るまで待つため、一時的にAV間隔が長くなる。","tags":"Manufacturer / PM / Abbott / Ventricular / Intrinsic / Preference"},{"term":"RYTHMIQ","en":"RYTHMIQ","abbr":"RYTHMIQ","cat":"ペーシング","device":"PM","maker":"Boston Scientific","short":"Boston Scientificの心室ペーシング抑制機能。AAI(R)＋VVI backupで動作し、AV同期消失時にDDD(R)へ切替する。AAI(R)動作中は心室ペーシングがほぼ入らない。","tags":"Manufacturer / PM / Boston Scientific / RYTHMIQ"},{"term":"IRSplus","en":"Intrinsic Rhythm Support plus","abbr":"","cat":"ペーシング","device":"PM","maker":"BIOTRONIK","short":"BIOTRONIKのIntrinsic Rhythm Support plus。AV hysteresis/自己伝導探索を用いて不要な心室ペーシングを抑える機能群。AVヒステリシスの延長幅と探索間隔を設定できる。","tags":"Manufacturer / PM / BIOTRONIK / Intrinsic / Rhythm / Support / plus"},{"term":"Asynchronous pacing","en":"Asynchronous pacing","abbr":"","cat":"モード","device":"PM / ICD / CRT","maker":"General","short":"自己心拍を感知せず設定レートで刺激するAOO/VOO/DOO等の非同期ペーシング。自己脈があると競合やR on Tのリスクがある。","tags":"PM / ICD / CRT / General / Asynchronous / pacing / threshold / capture"},{"term":"NBG code","en":"NASPE/BPEG Generic Pacemaker Code","abbr":"","cat":"モード","device":"PM / ICD / CRT","maker":"General","short":"ペーシングモードを、刺激腔・感知腔・感知応答・レート応答・多部位刺激の文字コードで表す体系。3文字目のI/T/Dが感知への応答様式を表す。","tags":"PM / ICD / CRT / General 反応様式 mode"},{"term":"AAI","en":"AAI pacing mode","abbr":"AAI","cat":"モード","device":"PM","maker":"General","short":"心房を刺激・感知し、心房自己波で刺激を抑制するモード。AV伝導が保たれたSNDなどで使用。後から房室ブロックが出ると対応できない点に注意する。","tags":"PM / General 心房抑制心房ペーシング AAI P-wave inhibited atrial pacing"},{"term":"VVI","en":"VVI pacing mode","abbr":"VVI","cat":"モード","device":"PM / ICD / CRT","maker":"General","short":"心室を刺激・感知し、心室自己波で刺激を抑制する単腔心室モード。房室同期は得られず、ペースメーカ症候群の原因になりうる。","tags":"PM / ICD / CRT / General / AF R波抑制型心室ペーシング VVI R-wave inhibited ventricular pacing 心室抑制型心室ペーシング VVI ventricular inhibited ventricular pacing 心室デマンド型ペーシング・モード ventricular demand pacing mode"},{"term":"DDD","en":"DDD pacing mode","abbr":"DDD","cat":"モード","device":"PM / ICD / CRT","maker":"General","short":"心房・心室を刺激/感知し、感知に対して抑制・追従の両方を行える標準的dual chamber mode。心房頻拍を追従してしまうため、モードスイッチで対処する。","tags":"PM / ICD / CRT / General"},{"term":"DDI","en":"DDI pacing mode","abbr":"DDI","cat":"モード","device":"PM / ICD / CRT","maker":"General","short":"心房・心室を刺激/感知するが、心房感知イベントを心室追従のトリガーにしないdual chamber mode。モードスイッチの切替先としてよく用いられる。","tags":"PM / ICD / CRT / General / AF"},{"term":"VDD","en":"VDD pacing mode","abbr":"VDD","cat":"モード","device":"PM","maker":"General","short":"心房を感知し心室を刺激/感知するが、心房刺激は行わないAV synchronous ventricular pacing。洞徐脈が出ると対応できないため、洞機能が保たれた房室ブロックが適応。","tags":"PM / General 心房同期心室ペーシング VAT atrial-synchronized ventricular pacing 心房同期心室抑制ペーシング VDD atrial-synchronized ventricular-inhibited pacing"},{"term":"AOO","en":"AOO pacing mode","abbr":"AOO","cat":"モード","device":"PM","maker":"General","short":"心房を固定レートで刺激し、自己P波を感知しない非同期モード。自己心拍と競合するリスクがあるため、電気メス使用時や磁石適用時など一時的な場面に限って用い、日常の恒久設定にはほぼ使わない。自己P波と競合し、心房細動を誘発しうる。","tags":"PM / General / MRI"},{"term":"VOO","en":"VOO pacing mode","abbr":"VOO","cat":"モード","device":"PM / ICD / CRT","maker":"General","short":"心室を固定レートで刺激し、自己心拍を感知しない非同期モード。感知を止めるため雑音に強い一方、自己脈と競合してR on Tを起こしうる。磁石適用や電気メス使用時などに限定して用いる。MRI検査時や電気メス使用時など、限られた場面で用いる。","tags":"PM / ICD / CRT / General / MRI 心室非同期型ペーシング様式 VOO ventricular asynchronous pacing mode"},{"term":"DOO","en":"DOO pacing mode","abbr":"DOO","cat":"モード","device":"PM / ICD / CRT","maker":"General","short":"心房・心室を設定レートとAVディレイで非同期に順次刺激するモード。感知しないため競合の危険があり、強い電磁干渉が予想される場面や、磁石適用時のバックアップ動作として現れる。デバイスリセット時のバックアップ動作としても現れる。","tags":"PM / ICD / CRT / General / MRI"},{"term":"ERI","en":"Elective Replacement Indicator","abbr":"ERI","cat":"電池","device":"PM / ICD / CRT","maker":"General","short":"電池消耗が進んだことを知らせる交換推奨サイン（Elective Replacement Indicator）。この時点から一定の余裕期間があり、計画的に本体交換を行う。以降はEOS（寿命末期）に至る。以降はフォロー間隔を短縮し、交換の日程を立てる。","tags":"Battery / PM / ICD / CRT / General 電池交換指示信号 ERI elective replacement indicator"},{"term":"RRT","en":"Recommended Replacement Time","abbr":"RRT","cat":"電池","device":"PM / ICD / CRT / Leadless","maker":"General","short":"メーカーが交換を推奨する電池ステータス。名称と定義は製品群で異なる。表示後も一定の猶予期間があるが、放置はしない。AVEIR VR では RRT＝2.71V で、到達するとアラート表示・センサOff・マグネットモード65bpmとなる。電池は24時間ごとに自動テストされ、電圧のトレンドが表示される。","tags":"Battery / PM / ICD / CRT / Leadless / General AVEIR VR 2.71V センサOff マグネット65bpm 24時間ごと自動テスト リードレス"},{"term":"EOS","en":"End of Service","abbr":"EOS","cat":"電池","device":"PM / ICD / CRT / Leadless","maker":"General","short":"サービス寿命末期。通常機能が維持できない/停止へ向かう終末ステータス。テレメトリーや頻拍治療が制限されるため、ここに至る前に交換する。","tags":"Battery / PM / ICD / CRT / Leadless / General EOL end of life 寿命末期 電池寿命末期 EOL end-of-life"},{"term":"P-wave amplitude","en":"Atrial sensing amplitude","abbr":"","cat":"センシング","device":"PM / ICD / CRT","maker":"General","short":"心房リードで感知される自己P波の大きさ（mV）。値が小さいとアンダーセンシングの原因になり、フォローで経時的に確認する感知余裕の指標。植込み時は2.0mV以上が目安。心房細動時はさらに減弱する。","tags":"Follow-up / PM / ICD / CRT / General / AF"},{"term":"R-wave amplitude","en":"Ventricular sensing amplitude","abbr":"","cat":"センシング","device":"PM / ICD / CRT / Leadless","maker":"General","short":"心室チャネルで測定するR波振幅。ICDでは頻拍感知にも重要。植込み時は5.0mV以上が目安。","tags":"Follow-up / PM / ICD / CRT / Leadless / General"},{"term":"AV synchrony","en":"Atrioventricular synchrony","abbr":"","cat":"AV・タイミング","device":"PM / CRT / Leadless","maker":"General","short":"心房収縮と心室収縮が適切な時間差で協調している状態（房室同期）。これが保たれると心房収縮による充満効果（心房キック）が得られ、心拍出量が増す。崩れるとペースメーカ症候群の原因となる。","tags":"Clinical / PM / CRT / Leadless / General"},{"term":"Capture failure","en":"Loss of capture","abbr":"","cat":"トラブル","device":"PM / ICD / CRT / Leadless","maker":"General","short":"刺激スパイクは出ているが、その後に標的心筋の脱分極が起きない状態。出力を上げても捕捉しなければ再手術を検討する。","tags":"Trouble / PM / ICD / CRT / Leadless / General / threshold / capture"},{"term":"Output failure","en":"Failure to pace","abbr":"","cat":"トラブル","device":"PM / ICD / CRT","maker":"General","short":"予定した部位に刺激パルスが出ない状態（出力不全）。リード断線・接続不良・オーバーセンシングによる抑制などが原因で、心電図上はスパイクが欠落する。心電図上スパイクそのものが見えない。","tags":"Trouble / PM / ICD / CRT / General / noise / oversensing / lead trouble"},{"term":"Lead noise","en":"Lead-related noise","abbr":"","cat":"トラブル","device":"PM / ICD / CRT","maker":"General","short":"リード由来の非生理的高周波/断続信号。oversensingやICD不適切治療の原因。体位変換や上肢の運動で再現できることがある。","tags":"Trouble / PM / ICD / CRT / General / noise / oversensing / lead trouble"},{"term":"AV Search+","en":"AV Search Plus","abbr":"","cat":"ペーシング","device":"PM / ICD / CRT","maker":"Boston Scientific","short":"Boston ScientificのAV delay延長型自己伝導探索機能。不要なRV pacing低減を目的とする。間欠的な房室ブロックでは、探索のたびに伝導の有無が変わりうる。","tags":"Manufacturer / PM / ICD / CRT / Boston Scientific / PMT"},{"term":"PaceSafe","en":"PaceSafe Automatic Threshold","abbr":"","cat":"ペーシング","device":"PM / ICD / CRT","maker":"Boston Scientific","short":"Boston Scientificの自動閾値測定/出力管理機能群。心房・右室・左室それぞれで独立して閾値を管理する。","tags":"Manufacturer / PM / ICD / CRT / Boston Scientific / threshold / capture / AF"},{"term":"RightRate","en":"RightRate Pacing","abbr":"","cat":"ペーシング","device":"PM","maker":"Boston Scientific","short":"Boston Scientificのminute ventilation等を利用したrate-adaptive pacing機能。体動を伴わない負荷にも反応しやすいのが分時換気量方式の利点。","tags":"Manufacturer / PM / Boston Scientific"},{"term":"QuickOpt","en":"QuickOpt algorithm","abbr":"","cat":"CRT・CSP","device":"CRT / PM","maker":"Abbott","short":"Abbottの心内EGM情報からAV/VV timingの推奨値を算出する最適化支援機能。短時間で推奨値を算出できる。","tags":"Manufacturer / CRT / PM / Abbott"},{"term":"CLS","en":"Closed Loop Stimulation","abbr":"CLS","cat":"レート応答","device":"PM / ICD / CRT","maker":"BIOTRONIK","short":"BIOTRONIKのrate response。心筋収縮に伴う心内インピーダンス変化をbeat-to-beatで評価しレートへ反映する。体動を伴わない精神的負荷にも反応しやすい。","tags":"Manufacturer / PM / ICD / CRT / BIOTRONIK"},{"term":"Capture Control","en":"Automatic Capture Control","abbr":"","cat":"ペーシング","device":"PM / CRT","maker":"BIOTRONIK","short":"BIOTRONIKの自動capture threshold測定・出力調整機能。定期的に閾値を測り、安全域を確保した出力へ自動調整する。","tags":"Manufacturer / PM / CRT / BIOTRONIK / threshold / capture"},{"term":"MRI AutoDetect","en":"MRI AutoDetect / MRI Guard","abbr":"","cat":"MRI・EMI","device":"PM / CRT","maker":"BIOTRONIK","short":"対応機種でMRI環境を検知し、設定期間内に自動でMRI modeへ移行する機能。設
