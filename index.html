.2mm ロープロファイル（ショートピン）**、**単極が IS-1/VS-1（ショートピン）／3.2mm 単極ロープロファイル（ロングピン）／3.2mm 単極ロングピン（コーディスタイプ）／5mm 単極ロングピン／6mm 単極ショートピン（コーディスタイプ）**の12形式に分類されている。本体交換時は規格一致の確認と変換アダプタの要否を事前に確認する。","tags":"6mm 5mm Cordis 旧規格 コネクタ 12形式 二股 双極同軸 双極インライン ロープロファイル メドトロニックタイプ コーディスタイプ ショートピン ロングピン DATA BOOK 2012 2013"},{"term":"Shared Bipolar（LV tip–RV ring）","en":"Shared Bipolar","abbr":"","cat":"CRT・CSP","device":"CRT","maker":"General","short":"LV先端を陰極、RVリングを陽極として左室を刺激するCRT極性。出力によりアノーダル刺激やキャプチャロスに注意。四極リードがなかった時代からある方法。","tags":"shared bipolar LV tip RV ring アノーダル"},{"term":"Marshall静脈（VOM）","en":"Vein of Marshall","abbr":"VOM","cat":"CRT・CSP","device":"CRT","maker":"General","short":"左房後外側に走る冠静脈の枝。心房不整脈アブレーションの標的にもなる。左室リードを進める際に迷入することがある。","tags":"VOM Marshall 冠静脈 アブレーション"},{"term":"Wilson中心電極","en":"Wilson Central Terminal","abbr":"","cat":"心電図","device":"PM / ICD / CRT","maker":"General","short":"単極胸部誘導の基準（不関電極）。四肢電極を抵抗で結んだ電気的中心。胸部誘導や単極四肢誘導の基準として用いる。","tags":"Wilson 中心電極 単極 誘導 不関電極 indifferent electrode 単極誘導"},{"term":"心電図記録紙（較正）","en":"ECG Paper / Calibration","abbr":"","cat":"心電図","device":"PM / ICD / CRT","maker":"General","short":"標準は紙送り25mm/秒・較正10mm/mV。横1mm=0.04秒(40ms)、縦10mm=1mV。大きい1マス（5mm）は0.2秒にあたる。","tags":"記録紙 25mm 較正 10mm/mV"},{"term":"UTR","en":"Upper Tracking Rate","abbr":"UTR","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"自己P波に追従して心室ペーシングする上限。MTRと同義（メーカーで呼称が異なる）。超えるとウェンケバッハ/2:1応答。低すぎると運動時に両室ペーシングが脱落する。","tags":"UTR MTR 上限追従 tracking 上限追従レート upper tracking rate 両室ペーシング脱落 Slow VT レートヒストグラム"},{"term":"USR","en":"Upper Sensor Rate","abbr":"USR","cat":"レート応答","device":"PM / ICD / CRT","maker":"General","short":"レート応答センサで到達できる上限レート（Upper Sensor Rate）。MSRと同義で、運動時にセンサが指示できる最大の心拍数を決める。P波追従の上限であるUTRとは別に設定する。P波追従の上限（UTR）とは別に設定する。","tags":"USR MSR センサ上限 sensor"},{"term":"2:1ブロックレート","en":"2:1 Block Rate","abbr":"","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"これ以上の心房レートで心室追従が2:1になる境界。約60000÷TARP(ms) bpm。心拍数が急に半減するため患者は症状を自覚しやすい。","tags":"2:1 block TARP 上限"},{"term":"上限レートウェンケバッハ","en":"Upper Rate Wenckebach","abbr":"","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"上限追従レート付近でAVディレイが徐々に延び、時折心室追従が1拍抜ける挙動。2:1応答より緩やかな移行となる。","tags":"wenckebach 上限 追従 Wenckebach作動 wenckebach"},{"term":"センサ指示レート","en":"Sensor-Indicated Rate","abbr":"SIR","cat":"レート応答","device":"PM / ICD / CRT","maker":"General","short":"センサが算出した『今出すべきレート』。実際のペーシングレートの目安。実際のレートと見比べて設定の適否を評価する。AVEIR VR では心室レートヒストグラム上に黄色の点として表示される（センサがOnまたはPassiveの場合）。","tags":"SIR sensor indicated rate AVEIR 心室レートヒストグラム 黄色の点 ノイズリバージョン 非同期"},{"term":"睡眠時レート","en":"Sleep / Rest Rate","abbr":"","cat":"レート応答","device":"PM / ICD / CRT","maker":"General","short":"就寝帯に下限レートを下げる設定（Sleep Rate/Rest Rate）。夜間の不要なペーシングと電池消耗を減らせる。","tags":"sleep rest rate 睡眠 夜間"},{"term":"ADLレート","en":"ADL Rate","abbr":"","cat":"レート応答","device":"PM / ICD / CRT","maker":"General","short":"レート応答で、日常生活動作（歩行など中等度の活動）に対応して到達する目安のレート。運動時のより高いレートとは別に、普段の活動域を快適にするための設定点。日常生活の快適さを左右する設定点。","tags":"ADL rate 活動 レート応答"},{"term":"レートヒステリシス","en":"Rate Hysteresis","abbr":"","cat":"レート応答","device":"PM / ICD / CRT","maker":"General","short":"自己心拍が出たら次の刺激までのレートを設定より下げ、自己脈を優先する。待つ間の心拍数は下限より低くなる。","tags":"hysteresis ヒステリシス レート"},{"term":"サーチヒステリシス","en":"Search Hysteresis","abbr":"","cat":"レート応答","device":"PM / ICD / CRT","maker":"General","short":"一定間隔ごとに一時的にレートを下げ、自己脈が出るか探索する機能。自己伝導が回復していれば不要なペーシングを減らせる。ヒステリシスを自動で行う発展型。探索中に一時的な徐脈が生じうる。","tags":"search hysteresis サーチ"},{"term":"レート応答性AVディレイ","en":"Rate-Adaptive AV Delay","abbr":"","cat":"レート応答","device":"PM / ICD / CRT","maker":"General","short":"レートが上がるとAVディレイを自動短縮し、生理的な房室伝導に近づける。上限追従レートを確保しやすくなる。","tags":"rate adaptive AV dynamic AV 動的AV"},{"term":"センス補正（SAVオフセット）","en":"Sense Compensation","abbr":"","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"自己P波感知の遅れを見込み、SAVをPAVより短く設定する差分。これにより実際の房室間隔をPAVと揃えられる。","tags":"sense compensation SAV offset"},{"term":"PVAB","en":"Post-Ventricular Atrial Blanking","abbr":"PVAB","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"心室イベント直後に心房で全く感知しない期間。ファーフィールドR波の誤検出を防ぐ。長すぎると本当の心房イベントを見落とす。","tags":"PVAB ブランキング far-field"},{"term":"VRP","en":"Ventricular Refractory Period","abbr":"VRP","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"心室イベント後、心室感知を計時に反映しない期間。T波やPVCの誤検出を抑える。長すぎると本来検出すべき不整脈を見落とす。","tags":"VRP 心室不応期 refractory"},{"term":"ARP","en":"Atrial Refractory Period","abbr":"ARP","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"心房イベント後に設けられる心房の不応期。この間の心房シグナルは計時に反映しない。遠隔R波やペーシング後の残存電位を誤感知しないための保護期間で、PVARPもこの一部にあたる。AAIでファーフィールドR波を拾う場合に延長を検討する。","tags":"ARP 心房不応期 refractory"},{"term":"心室ブランキング（心房刺激後）","en":"Post-Atrial Ventricular Blanking","abbr":"PAVB","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"心房刺激直後に心室で感知しない短い窓。クロストーク（心房スパイクの心室誤感知）を防ぐ。この窓の後にクロストークセンシングウインドウが続く。","tags":"PAVB crosstalk クロストーク ブランキング"},{"term":"ノイズリバージョン","en":"Noise Reversion","abbr":"","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"連続雑音を感知すると一時的に非同期ペーシングへ切替え、過抑制を防ぐ。DOO/VOO/AOOの下限レートで非同期ペーシングとなる。AVEIR VR（リードレス）では、不応期に連続ノイズがセンシングされると発動し、基本レートまたはセンサ指示レート（SIR）で非同期ペーシングを行い、ノイズがなくなると終了する。","tags":"noise reversion 雑音 非同期 noise reversion DOO VOO AOO 非同期 自己脈識別 AVEIR VR リードレス 基本レート SIR 非同期 ノイズ消失で終了"},{"term":"レスポンスファクター（スロープ）","en":"Response Factor / Slope","abbr":"","cat":"レート応答","device":"PM / ICD / CRT","maker":"General","short":"活動量に対してどれだけレートを上げるかの傾きの設定。値を大きくすると軽い活動でもレートが上がりやすくなる。センサ感度全体を左右する基本パラメータ。上げすぎると軽い動作で頻脈になり、動悸の訴えにつながる。","tags":"response factor slope スロープ 傾き"},{"term":"リアクションタイム","en":"Reaction Time","abbr":"","cat":"レート応答","device":"PM / ICD / CRT","maker":"General","short":"レート応答で、活動が始まってからレートが上がり始めるまでの速さの設定。短くすると立ち上がりが機敏になり、長くすると緩やかになる。患者の活動様式に合わせて調整する。短くしすぎると日常動作で頻繁にレートが上がる。","tags":"reaction time 立ち上がり"},{"term":"リカバリータイム","en":"Recovery Time","abbr":"","cat":"レート応答","device":"PM / ICD / CRT","maker":"General","short":"レート応答で、活動終了後にレートが下限へ戻るまでの速さの設定。短いと急に戻り、長いと余韻を持って下がる。運動直後の息切れ感などを見て調整する。運動直後の息切れ感を見ながら調整する。","tags":"recovery time 回復"},{"term":"NCAP","en":"Non-Competitive Atrial Pacing","abbr":"NCAP","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"心房不応期内の自己P波の直後は、少し遅らせて心房刺激し競合を避ける機能。心房の受攻期への刺激を避け、心房細動の誘発を防ぐ。","tags":"NCAP 非競合 心房"},{"term":"検出時間（Duration）","en":"Detection Duration","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"治療前に頻拍が続くべき時間。長めにすると不適切作動・不要治療が減る。MADIT-RITでは延長が総死亡の減少にもつながった。","tags":"duration 検出時間 NID"},{"term":"ATPバースト","en":"ATP Burst","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"一定間隔の連続刺激でVTを停止するATP。回数・連結期・刺激数を設定。設定が単純で加速させにくく、第一選択となることが多い。","tags":"ATP burst バースト Burst Burst ATP"},{"term":"ATPランプ","en":"ATP Ramp","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"刺激間隔を1拍ごとに短縮していく抗頻拍ペーシング。頻拍周期に食い込みながら停止を狙う方式で、バーストと並ぶ代表的なATP。バーストより加速のリスクがやや高い。","tags":"ATP ramp ランプ Ramp Ramp ATP"},{"term":"ショックエネルギー","en":"Shock Energy","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"ICDが放電する電気ショックの出力（J）。初回・2回目以降・最大などを設定し、除細動閾値に十分な安全域をとる。高いほど確実だが充電時間と電池消耗が増える。高いほど充電時間が延び、電池を消耗する。","tags":"shock energy J 除細動 出力"},{"term":"SVTリミット","en":"SVT Limit","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"SVT鑑別を適用する上限レート。これを超えると鑑別せず治療する。危険な頻拍の治療が鑑別で遅れるのを防ぐ安全装置。","tags":"SVT limit 鑑別 上限"},{"term":"VVディレイ","en":"VV Delay","abbr":"VV","cat":"CRT・CSP","device":"CRT","maker":"General","short":"両室ペーシングで右室と左室を刺激する時間差の設定。0〜数十msの範囲で、心エコーやデバイスの最適化アルゴリズムを用いて、左室の同期が最良となる値に調整する。latencyがある場合は左室を先行させて補正する。","tags":"VV delay interval 両室 VV delay VVペースディレイ SyncAV LVオフセット V-V delay Interventricular Delay"},{"term":"LV-only／BiV設定","en":"LV-only vs BiV Pacing","abbr":"","cat":"CRT・CSP","device":"CRT","maker":"General","short":"左室単独か両室同時かのペーシング設定。AdaptivCRT等で自動切替も。自己房室伝導が保たれていればLV-onlyでも同等の再同期が得られることがある。","tags":"LV-only BiV fusion 融合"},{"term":"Reveal LINQ / LINQ II","en":"Reveal LINQ II","abbr":"LINQ","cat":"フォロー","device":"ICM","maker":"Medtronic","short":"メドトロニックの挿入型心電計。専用の挿入ツールで低侵襲に留置し、遠隔モニタリング（CareLink）で検出イベントを自動送信する。国内で広く用いられる代表的なICMで、小型・長寿命が特徴。小型で3年間の記録が可能。","tags":"Reveal LINQ / LINQ II LINQ ICM 挿入型心電計 ループレコーダー"},{"term":"Confirm Rx / Assert-IQ","en":"Confirm Rx / Assert-IQ","abbr":"","cat":"フォロー","device":"ICM","maker":"Abbott","short":"アボットの挿入型心電計。スマートフォンアプリと連携し、症状の記録やデータ送信を患者側から行えるのが特徴。国内で使用可能で、遠隔フォローに対応する。患者自身がアプリで症状を記録できる。","tags":"Confirm Rx / Assert-IQ  ICM 挿入型心電計 ループレコーダー"},{"term":"シングルコイル","en":"Single-coil lead","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"RV先端に除細動コイルを1つ持つICDリード。構造が単純で慢性期の抜去が比較的容易。SVCコイルがない分、除細動閾値がやや高くなる場合があるが、現在は多くの症例で十分な有効性が得られる。抜去が容易で、近年はこちらが選ばれることが多い。","tags":"シングルコイル  Single-coil lead"},{"term":"デュアルコイル","en":"Dual-coil lead","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"RV先端とSVC（上大静脈）位置に除細動コイルを2つ持つICDリード。除細動閾値を下げやすい一方、慢性期は癒着でリード抜去がやや難しくなることがある。慢性期の癒着で抜去が難しくなる。","tags":"デュアルコイル  Dual-coil lead"},{"term":"高除細動閾値","en":"High DFT","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"確実な除細動に必要なエネルギーが高い状態。コイル位置の調整、SVCコイルのON/OFF、ショック極性の変更、皮下アレイの追加などで対応する。DFT 25J以上、または安全域10J未満が定義の目安。","tags":"高除細動閾値  High DFT 高DFT high DFT High DFT 25J 10J ブルガダ アミオダロン 電解質異常 アシドーシス"},{"term":"受攻性上限試験","en":"Upper Limit of Vulnerability","abbr":"ULV","cat":"ICD","device":"ICD","maker":"General","short":"T波頂上付近に段階的な刺激を与え、心室細動を誘発しない最小エネルギーを求める検査。細動を誘発せずに除細動の安全域を推定できる方法。細動を誘発せずに済む一方、センシングの評価はできない。","tags":"受攻性上限試験 ULV Upper Limit of Vulnerability ULV Upper Limit of Vulnerability T波ピーク 20msec 15J"},{"term":"ショックリダクション","en":"Shock reduction","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"不要・不適切なショックを減らす設定やアルゴリズムの総称。検出遅延の延長、高レートカットオフ、SVT鑑別、T波オーバーセンシング対策などを組み合わせる。不適切作動は予後やQOLに影響するため重視される。","tags":"ショックリダクション  Shock reduction"},{"term":"ミニマムインターバル","en":"Minimum interval","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"ICDが心拍として計数する最短の間隔。これより短い信号は雑音などとして扱い、二重計数や過剰検出を避ける。二重計数による過剰検出を防ぐ。","tags":"ミニマムインターバル  Minimum interval"},{"term":"心室細動","en":"Ventricular fibrillation","abbr":"VF","cat":"不整脈・EP","device":"ICD","maker":"General","short":"心室が無秩序に興奮し有効な拍出が失われる致死的不整脈。ICDの主要な治療対象で、検出後に高エネルギーショックで停止させる。数秒で意識を失い、放置すれば死に至る。","tags":"心室細動 VF Ventricular fibrillation reversible 可逆的要因 虚血 電解質"},{"term":"心室頻拍","en":"Ventricular tachycardia","abbr":"VT","cat":"不整脈・EP","device":"ICD","maker":"General","short":"心室起源の頻拍。レートや血行動態に応じてATPやショックで治療する。持続性・非持続性、単形性・多形性に分けられる。血行動態が破綻していれば速やかにショックへ移行する。","tags":"心室頻拍 VT Ventricular tachycardia monomorphic polymorphic sustained non-sustained 単形性 多形性 持続性 非持続性 右脚ブロック型 左脚ブロック型"},{"term":"非持続性心室頻拍","en":"Non-sustained VT","abbr":"NSVT","cat":"不整脈・EP","device":"ICD","maker":"General","short":"3連発以上で30秒未満に自然停止する心室頻拍。ICDでは治療されず記録され、リスク評価やフォローの材料になる。心筋症でのICD適応判断の材料となる。","tags":"非持続性心室頻拍 NSVT Non-sustained VT 非持続性VT NSVT Non-sustained VT"},{"term":"トルサード・ド・ポアント","en":"Torsade de pointes","abbr":"TdP","cat":"不整脈・EP","device":"ICD","maker":"General","short":"QT延長を背景に生じる多形性心室頻拍。基線を軸にねじれる波形が特徴で、失神や心室細動へ移行しうる。原因薬剤の中止と電解質補正、Mg投与が基本となる。","tags":"トルサード・ド・ポアント TdP Torsade de pointes TdP 多形性心室頻拍 polymorphic VT QT依存"},{"term":"定電圧方式","en":"Constant voltage output","abbr":"","cat":"ペーシング","device":"PM / ICD / CRT","maker":"General","short":"設定した電圧を保って刺激する出力方式。現在のペースメーカの標準で、リードインピーダンスに応じて流れる電流が変化する。インピーダンスの推移がそのまま電池消耗に影響する。","tags":"定電圧方式  Constant voltage output"},{"term":"定電流方式","en":"Constant current output","abbr":"","cat":"ペーシング","device":"PM / ICD / CRT","maker":"General","short":"設定した電流を保って刺激する出力方式。インピーダンスが変化しても電流が一定になる。旧来の一部機種で用いられた。インピーダンスが変動しても刺激強度が安定する。","tags":"定電流方式  Constant current output"},{"term":"セーフティマージン試験","en":"Safety margin test","abbr":"","cat":"ペーシング","device":"PM / ICD / CRT","maker":"General","short":"設定出力が刺激閾値に対して十分な余裕を持つか確認する試験。通常は閾値の約2倍を目安に安全域をとる。閾値上昇時に捕捉不全とならないかを事前に確認する目的で行う。","tags":"セーフティマージン試験  Safety margin test"},{"term":"スルーレート","en":"Slew rate","abbr":"","cat":"センシング","device":"PM / ICD / CRT","maker":"General","short":"感知波形の立ち上がりの鋭さ（電位の変化速度）。大きいほど鋭く、良好な感知の指標。低いと感知不全の一因になる。目安は心房0.5V/秒、心室1.0V/秒以上。","tags":"スルーレート  Slew rate"},{"term":"相対不応期","en":"Relative refractory period","abbr":"","cat":"不整脈・EP","device":"","maker":"General","short":"強い刺激なら興奮を起こせるが、伝導や興奮が遅れる期間。絶対不応期に続く回復途上の時期。この時期の刺激は緩徐伝導を生みリエントリーの契機となる。","tags":"相対不応期  Relative refractory period RRP"},{"term":"有効不応期","en":"Effective refractory period","abbr":"ERP","cat":"不整脈・EP","device":"","maker":"General","short":"期外刺激を与えても伝導がその先へ進まない、最も長い連結期。伝導系の性質を評価する電気生理指標。期外刺激法で測定する。","tags":"有効不応期 ERP Effective refractory period"},{"term":"機能的不応期","en":"Functional refractory period","abbr":"FRP","cat":"不整脈・EP","device":"","maker":"General","short":"ある部位を通過して出てくる興奮の最短間隔。その部位の伝導能を表す電気生理指標。有効不応期と対にして房室結節の性質を評価する。","tags":"機能的不応期 FRP Functional refractory period"},{"term":"補充調律","en":"Escape rhythm","abbr":"","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"上位のペースメーカが止まったとき、下位（房室接合部や心室）が肩代わりして出す調律。徐脈時の生命維持に働く。接合部なら毎分40〜50、心室なら30〜40と遅い。","tags":"補充調律  Escape rhythm 接合部補充調律 心室補充調律 junction"},{"term":"リエントリー","en":"Reentry","abbr":"","cat":"不整脈・EP","device":"","maker":"General","short":"興奮が旋回して持続する不整脈の主要機序。瘢痕や副伝導路を旋回路とし、多くのVT・SVTの原因になる。緩徐伝導・一方向性ブロック・回路の3条件で成立する。","tags":"リエントリー  Reentry reentry 一方向性ブロック 緩徐伝導"},{"term":"心房細動","en":"Atrial fibrillation","abbr":"AF","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"心房が無秩序に興奮し、心室応答が不規則になる不整脈。デバイスではモードスイッチや心房頻拍記録の対象で、抗凝固の判断にも関わる。CRTでは両室ペーシングの欠落を招く。","tags":"心房細動 AF Atrial fibrillation paroxysmal persistent permanent 発作性 持続性 永続性 両室ペーシング欠落 CRT 房室結節アブレーション 新規発症 植込み後2.5年 10%"},{"term":"心房粗動","en":"Atrial flutter","abbr":"AFL","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"心房内の旋回興奮による規則的な頻拍。1:1伝導では速い心室応答となり、デバイスの心房追従にも影響する。R-Rが一定になりやすく、ICDではVTとの鑑別が難しい。","tags":"心房粗動 AFL Atrial flutter AFL 通常型 非通常型 Wells Wells 反時計回転 時計回転 鋸歯状"},{"term":"心房頻拍","en":"Atrial tachycardia","abbr":"AT","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"心房起源の規則的な頻拍。デバイスはこれを検出してモードスイッチや心房ATPで対応する。デバイス上はAT/AF burdenとして記録される。","tags":"心房頻拍 AT Atrial tachycardia AT focal マクロリエントリー AT isoelectric line 等電位線 特発性 続発性"},{"term":"上室頻拍","en":"Supraventricular tachycardia","abbr":"SVT","cat":"不整脈・EP","device":"ICD","maker":"General","short":"心房・房室接合部起源の頻拍の総称。ICDではVTとの鑑別が重要で、鑑別を誤ると不適切作動の原因になる。Onset・Stability・波形識別で鑑別する。","tags":"上室頻拍 SVT Supraventricular tachycardia SVT PSVT 発作性上室頻拍 paroxysmal"},{"term":"上室期外収縮","en":"Premature atrial contraction","abbr":"PAC","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"心房起源の早期収縮。頻発すると心房頻拍・心房細動の引き金になりうる。PVARP内に落ちると心室ペーシングの欠落を招く。","tags":"上室期外収縮 PAC Premature atrial contraction APC PAC APC 心房期外収縮 atrial premature contraction"},{"term":"心室期外収縮","en":"Premature ventricular contraction","abbr":"PVC","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"心室起源の早期収縮。デバイスはこれを感知してPVARP延長などで対応し、PMTの予防にも関わる。CRTではPVCレスポンスによる両室ペーシング欠落に注意する。","tags":"心室期外収縮 PVC Premature ventricular contraction VPC PVC 期外収縮 特発性 器質的 scar 瘢痕 多源性"},{"term":"ディスシンクロニー","en":"Dyssynchrony","abbr":"","cat":"CRT・CSP","device":"CRT","maker":"General","short":"心室内・心室間の収縮タイミングのずれ。左脚ブロックなどで生じ、CRTの適応と効果判定の中心概念。左脚ブロックでは中隔が先に収縮し側壁が遅れる。","tags":"ディスシンクロニー  Dyssynchrony 心室同期不全 dyssynchrony"},{"term":"心室内伝導障害","en":"Intraventricular conduction disturbance","abbr":"IVCD","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"脚や末梢の伝導障害でQRSが幅広くなる状態。左脚ブロック型はCRTの良い適応となりうる。QRS幅120ms以上がCRT適応の目安となる。","tags":"心室内伝導障害 IVCD Intraventricular conduction disturbance"},{"term":"脚ブロック","en":"Bundle branch block","abbr":"BBB","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"右脚または左脚の伝導障害。左脚ブロックは心室同期障害を来し、CRTの効果が期待できる。右脚ブロックでは左室興奮がほぼ保たれる。","tags":"脚ブロック BBB Bundle branch block 左脚ブロック 右脚ブロック LBBB RBBB"},{"term":"高度房室ブロック","en":"Advanced AV block","abbr":"","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"連続する複数のP波が心室へ伝わらない重い房室ブロック。症候性なら恒久ペーシングの適応となる。長い心停止や失神の危険がある。","tags":"高度房室ブロック  Advanced AV block"},{"term":"洞房ブロック","en":"Sinoatrial block","abbr":"SA block","cat":"不整脈・EP","device":"PM","maker":"General","short":"洞結節の興奮が心房へ伝わらず、心房興奮が欠落する状態。洞不全症候群の一型。P波ごと欠落するのが特徴。","tags":"洞房ブロック SA block Sinoatrial block"},{"term":"洞性徐脈","en":"Sinus bradycardia","abbr":"","cat":"不整脈・EP","device":"PM","maker":"General","short":"洞結節由来で心拍が遅い状態。症候性であれば恒久ペーシングの適応になりうる。運動選手や睡眠中では生理的なこともある。","tags":"洞性徐脈  Sinus bradycardia"},{"term":"血管迷走神経性失神","en":"Vasovagal syncope","abbr":"","cat":"不整脈・EP","device":"PM","maker":"General","short":"迷走神経反射による一過性の徐脈・血圧低下で起こる失神。心停止型ではレートドロップ反応などのペーシングが検討される。若年者に多く、一般に予後は良好。","tags":"血管迷走神経性失神  Vasovagal syncope vasovagal tilt"},{"term":"頸動脈洞症候群","en":"Carotid sinus syndrome","abbr":"","cat":"不整脈・EP","device":"PM","maker":"General","short":"頸動脈洞への刺激で強い徐脈・血圧低下を来す病態。心抑制型はペーシングの適応になりうる。ひげ剃りや頸部の圧迫が誘因となる。","tags":"頸動脈洞症候群  Carotid sinus syndrome carotid sinus 過敏性頸動脈洞"},{"term":"QT延長症候群","en":"Long QT syndrome","abbr":"LQTS","cat":"不整脈・EP","device":"ICD","maker":"General","short":"QT延長によりTdPや突然死のリスクが高まる病態。二次予防や高リスク例でICDが考慮される。先天性と、薬剤・電解質異常による後天性がある。","tags":"QT延長症候群 LQTS Long QT syndrome LQTS Romano-Ward Jervell-Lange-Nielsen LQT1 LQT2 LQT3 LQT1 LQT2 LQT3 KCNQ1 KCNH2 SCN5A メキシレチン ナドロール"},{"term":"ブルガダ症候群","en":"Brugada syndrome","abbr":"","cat":"不整脈・EP","device":"ICD","maker":"General","short":"右側胸部誘導の特徴的ST上昇を示し、心室細動・突然死を来しうる遺伝性不整脈。適応例でICDが用いられる。夜間・安静時の心室細動が特徴で、除細動閾値が高いことがある。","tags":"ブルガダ症候群  Brugada syndrome Brugada coved saddleback SCN5A coved saddle back type1 type2 ピルジカイニド ボックリ病 High DFT 高除細動閾値"},{"term":"カテコラミン誘発性多形性心室頻拍","en":"CPVT","abbr":"CPVT","cat":"不整脈・EP","device":"ICD","maker":"General","short":"運動や情動で多形性VTを生じる遺伝性不整脈。薬物治療を基本とし、高リスク例でICDを併用する。β遮断薬が治療の基本となる。","tags":"カテコラミン誘発性多形性心室頻拍 CPVT CPVT CPVT CPVT Catecholaminergic polymorphic VT"},{"term":"肥大型心筋症","en":"Hypertrophic cardiomyopathy","abbr":"HCM","cat":"不整脈・EP","device":"ICD","maker":"General","short":"心筋の異常肥大を来す疾患。突然死リスク評価に基づき、一次・二次予防でICDが考慮される。若年・失神・突然死の家族歴・著明な壁厚がリスク因子。","tags":"肥大型心筋症 HCM Hypertrophic cardiomyopathy HCM HOCM 非閉塞性 サルコメア ASH"},{"term":"拡張型心筋症","en":"Dilated cardiomyopathy","abbr":"DCM","cat":"不整脈・EP","device":"CRT","maker":"General","short":"心室拡大と収縮低下を来す疾患。低心機能・伝導遅延例ではCRTやICDの適応になる。薬物治療を最適化したうえで適応を判断する。","tags":"拡張型心筋症 DCM Dilated cardiomyopathy"},{"term":"心筋梗塞","en":"Myocardial infarction","abbr":"MI","cat":"不整脈・EP","device":"ICD","maker":"General","short":"冠動脈閉塞による心筋壊死。梗塞後の低心機能はICD適応の代表的背景で、瘢痕はVTの基質になる。瘢痕とその周囲の緩徐伝導部位がVTの基質となる。","tags":"心筋梗塞 MI Myocardial infarction"},{"term":"心臓突然死","en":"Sudden cardiac death","abbr":"SCD","cat":"不整脈・EP","device":"ICD","maker":"General","short":"心原性の予期せぬ急死。多くは致死性心室性不整脈が原因で、ICDによる一次・二次予防の対象。発症から時間が経つほど救命率が下がる。","tags":"心臓突然死 SCD Sudden cardiac death"},{"term":"リバースリモデリング","en":"Reverse remodeling","abbr":"","cat":"CRT・CSP","device":"CRT","maker":"General","short":"CRTが奏効し、左室容積の縮小と収縮機能の改善が得られる現象。効果判定の重要な指標。症状より客観的で、効果判定に適した指標。","tags":"リバースリモデリング  Reverse remodeling"},{"term":"反復性非リエントリー性室房同期","en":"RNRVAS","abbr":"RNRVAS","cat":"トラブル","device":"CRT","maker":"General","short":"逆行性室房伝導により心房が持続的に不応期に入り、心房追従が失われて有効な同期が保てなくなる現象。設定調整で対処する。PVARP短縮・AVディレイ短縮・下限レート低下で対応する。","tags":"反復性非リエントリー性室房同期 RNRVAS RNRVAS RNRVAS 室房伝導時間 PVARP ペーシングインターバル AV delay RNRVAS 無効ペーシング PVARP AV delay 下限レート レート応答 MVP blocked PAC"},{"term":"デバイス感染","en":"CIED infection","abbr":"","cat":"トラブル","device":"PM / ICD / CRT","maker":"General","short":"本体やリードに及ぶ感染。ポケット感染から菌血症・感染性心内膜炎に至ると、全システムの抜去が原則となる。新規植込みより交換手術のほうがリスクが高い。","tags":"デバイス感染  CIED infection CIED infection ポケット感染 CDRIE 死亡率5% 電池交換 表皮ブドウ球菌 MRSA 不明熱"},{"term":"ポケット感染","en":"Pocket infection","abbr":"","cat":"トラブル","device":"PM / ICD / CRT","maker":"General","short":"本体を収めるポケットの感染。発赤・腫脹・排膿を呈し、抗菌薬のみでの治癒は難しく、デバイス抜去を要することが多い。血腫は発症の危険因子となる。","tags":"ポケット感染  Pocket infection 表層性ポケット感染 CDRIE 血腫 抗菌薬 全システム抜去"},{"term":"心タンポナーデ","en":"Cardiac tamponade","abbr":"","cat":"トラブル","device":"PM / ICD / CRT","maker":"General","short":"心嚢内への出血・液貯留で心臓が圧迫され拍出が低下する状態。リード穿孔の重篤な合併症で緊急対応を要する。ベックの三徴と奇脈に留意し、心エコーで診断する。","tags":"心タンポナーデ  Cardiac tamponade ベックの三徴 血圧低下 頸静脈怒張 微弱心音 奇脈 心囊ドレナージ 経胸壁心エコー cardiac tamponade タンポナーデ"},{"term":"三尖弁（デバイス関連）","en":"Tricuspid valve / lead-related TR","abbr":"","cat":"リード","device":"ICD","maker":"General","short":"右室リードが三尖弁を通過するため、弁の可動制限や逆流（TR）を来すことがある。リード位置や本数に配慮する。三尖弁逆流の悪化は心不全の増悪要因となりうる。","tags":"三尖弁（デバイス関連）  Tricuspid valve / lead-related TR"},{"term":"Twiddler症候群","en":"Twiddler's syndrome","abbr":"","cat":"トラブル","device":"PM / ICD / CRT","maker":"General","short":"患者が本体をポケット内で回してしまい、リードが巻きついて脱転位・断線する現象。ペーシング不全や横隔膜刺激の原因になる。大きすぎるポケットや固定不良が背景にある。","tags":"Twiddler症候群  Twiddler's syndrome Twiddler ツイドラー 回転 捻れ たわみ消失 再手術"},{"term":"皮膚圧迫壊死","en":"Skin erosion","abbr":"","cat":"トラブル","device":"PM / ICD / CRT","maker":"General","short":"本体やリードが皮膚を圧迫し、菲薄化・露出（びらん）を来す状態。感染に準じて扱い、被覆・移設や抜去を要することが多い。痩せ型では大胸筋膜下以深への植込みが推奨される。","tags":"皮膚圧迫壊死  Skin erosion 圧迫壊死 血行障害 創部離解 デバイス露出 大胸筋膜下"},{"term":"リード抜去","en":"Lead extraction","abbr":"","cat":"植込み・手技","device":"PM / ICD / CRT","maker":"General","short":"感染・断線・不要リードなどを体内から抜き取る手技。癒着が強い慢性期はレーザーシースなどの専用器具を用いる。重篤な合併症のリスクを伴い、外科バックアップ体制が必要。","tags":"リード抜去  Lead extraction 完全抜去 全システム抜去 経皮的 外科的 レーザー ロッキングスタイレット スネア"},{"term":"レーザー抜去（レーザーシース）","en":"Laser lead extraction","abbr":"","cat":"植込み・手技","device":"PM / ICD / CRT","maker":"General","short":"レーザーで癒着組織を切離しながらリードを抜去する方法。慢性期の強固な癒着例で用いられる。発振波長308nmで、照射時は紫外線防護眼鏡を装着する。","tags":"レーザー抜去（レーザーシース）  Laser lead extraction エキシマレーザー 308nm 紫外線防護眼鏡 アウターシース ロッキングスタイレット 細菌培養"},{"term":"抜去用シース（メカニカル/回転式）","en":"Mechanical/rotational sheath","abbr":"","cat":"植込み・手技","device":"PM / ICD / CRT","maker":"General","short":"機械的に癒着を剥離してリードを抜去するシース。回転刃を備えるタイプもある。レーザーが使えない施設でも用いられる。","tags":"抜去用シース（メカニカル/回転式）  Mechanical/rotational sheath"},{"term":"ロッキングスタイレット","en":"Locking stylet","abbr":"","cat":"植込み・手技","device":"PM / ICD / CRT","maker":"General","short":"リード内腔で固定し、抜去時の牽引力を先端まで伝える器具。リードの伸びや断裂を防ぐ。抜去手技の基本となる器具。","tags":"ロッキングスタイレット  Locking stylet"},{"term":"デバイスリセット","en":"Device reset","abbr":"","cat":"トラブル","device":"PM / ICD / CRT","maker":"General","short":"強い電磁干渉などで設定が初期値へ戻る現象（パワーオンリセット）。予期せぬモード・レートになりうるため点検で確認する。基本レートでのVVIとなるため、検脈値が発見の手がかりになる。AVEIR LP（リードレス）では、まず正常な動作条件の回復を試み、成功しなかった場合は読取り専用メモリモードおよび EVVI ペーシングになる。いずれの場合もアラートが表示される。","tags":"デバイスリセット  Device reset パワーオンリセット リセット値 VVI 電磁干渉 AVEIR LP LP Device Reset 読取り専用メモリモード EVVI アラート リードレス"},{"term":"フィードスルー","en":"Feedthrough","abbr":"","cat":"デバイス構造","device":"PM / ICD / CRT","maker":"General","short":"気密封止を保ったまま電気信号を本体の内外へ通す構造部品。信頼性の要となる。貫通型コンデンサとして高周波を遮断する役割も持つ。","tags":"フィードスルー  Feedthrough ニオビウム サファイア 貫通型コンデンサ feedthrough filter 450MHz 携帯電話"},{"term":"非侵襲的経皮ペーシング","en":"Transcutaneous pacing","abbr":"","cat":"ペーシング","device":"PM / ICD / CRT","maker":"General","short":"胸壁のパッドから体外式に心臓を刺激する緊急ペーシング。恒久植込みまでのつなぎに用いる。痛みを伴うため鎮静・鎮痛を併用し、デマンドモードを基本とする。","tags":"非侵襲的経皮ペーシング  Transcutaneous pacing demand mode non demand mode 同期モード 非同期モード 固定モード"},{"term":"一時的心外膜ペーシングワイヤ","en":"Temporary epicardial wire","abbr":"","cat":"ペーシング","device":"PM / ICD / CRT","maker":"General","short":"心臓手術時に心外膜へ縫着する一時ペーシング用の細い電線。術後の徐脈に備える。不要になれば体表から牽引して抜去する。","tags":"一時的心外膜ペーシングワイヤ  Temporary epicardial wire ハートワイヤー heart wire"},{"term":"皮下血腫","en":"Pocket hematoma","abbr":"","cat":"トラブル","device":"PM / ICD / CRT","maker":"General","short":"ポケット内の出血・血腫。抗凝固・抗血小板薬使用時に増える。感染リスクを高めるため管理が重要。強い緊満は疼痛や皮膚壊死を招く。","tags":"皮下血腫  Pocket hematoma 抗凝固薬 止血不十分 ポケット感染 血腫除去 再止血"},{"term":"ホルター心電図","en":"Holter monitoring","abbr":"","cat":"心電図","device":"PM / ICD / CRT","maker":"General","short":"長時間の携帯型心電図記録。不整脈やペーシング動作の評価、症状との対応づけに用いる。デバイス患者ではNASA誘導とCM5誘導の組合せが一般的。","tags":"ホルター心電図  Holter monitoring"},{"term":"QT補正（Bazett/Fridericia）","en":"Corrected QT","abbr":"QTc","cat":"心電図","device":"PM / ICD / CRT","maker":"General","short":"心拍数の影響を除いてQTを評価する補正法。TdPリスクの評価に用いる。小児など心拍が速い場合はFridericiaを用いる。","tags":"QT補正（Bazett/Fridericia） QTc Corrected QT"},{"term":"体外カルディオバージョン","en":"External cardioversion","abbr":"","cat":"ICD","device":"PM / ICD / CRT","maker":"General","short":"体外から同期ショックで頻拍を停止させる処置。植込みデバイス例では設定確認や磁石対応、パッド位置に注意する。パッドは本体から離し、前後方向（AP）に貼る。","tags":"体外カルディオバージョン  External cardioversion"},{"term":"セーフティマージン","en":"safety margin","abbr":"","cat":"ペーシング","device":"PM","maker":"General","short":"閾値や感知波高の変動を見込み、設定値と実測値の間に確保する余裕（safety margin）。小さすぎると捕捉不全、大きすぎると電池消耗を招く。","tags":"PM / General / safety / margin / threshold / capture / AF 安全域 safety margin 出力マージン Output safety margin 安全域 マージン safety margin"},{"term":"センシング感度","en":"sensitivity","abbr":"","cat":"センシング","device":"PM","maker":"General","short":"心内波を検出するためのセンシング閾値設定。mV表示では通常、数値が小さいほど高感度。鋭くしすぎるとノイズやT波を、鈍くしすぎると自己波を見落とす。","tags":"PM / General / sensitivity / noise / oversensing / lead trouble / threshold / capture 感度 感度 sensitivity 感知閾値 sensing threshold"},{"term":"リードインピーダンス","en":"lead impedance","abbr":"","cat":"リード","device":"PM / ICD / CRT","maker":"General","short":"リード刺激回路のインピーダンス。通常Ωで表示し、絶縁・導体・接続状態の評価に用いる。断線では上昇、絶縁不良では低下し、推移の比較が重要。","tags":"Lead / PM / ICD / CRT / General / lead / impedance / noise / oversensing / lead trouble リード抵抗 リード抵抗 impedance"},{"term":"グロメット","en":"Grommet","abbr":"","cat":"リード","device":"PM / ICD / CRT","maker":"General","short":"リード挿入孔に埋め込まれたシリコーン製の封止材。接続部への体液侵入を防ぐ。ここが劣化すると体液侵入によるトラブルにつながる。","tags":"グロメット  Grommet seal シーリング"},{"term":"キャパシタ","en":"Capacitor","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"ICDが高電圧ショックを出すために電気を一時的に蓄える大容量コンデンサ。充電時間や本体サイズに影響する。長期間使わないと性能が落ちるため定期的な再形成が行われる。","tags":"キャパシタ  Capacitor コンデンサ 蓄電 capacitor charge time 充電時間"},{"term":"ペーシングエネルギー","en":"Pacing energy","abbr":"","cat":"ペーシング","device":"PM / ICD / CRT","maker":"General","short":"刺激1回のエネルギー。電圧の2乗×パルス幅÷抵抗で決まり、出力設定と電池消耗の目安になる。電圧が2乗で効くため、電圧を下げるのが最も節電になる。","tags":"ペーシングエネルギー  Pacing energy E=V2RT energy"},{"term":"ヨウ素リチウム電池","en":"Lithium-iodine battery","abbr":"","cat":"電池","device":"PM","maker":"General","short":"ペースメーカに広く使われる一次電池。高い信頼性と低い自己放電が特徴で、初期電圧は約2.8〜3.2V。電圧がなだらかに下がるため、推移から交換時期を推定できる。","tags":"ヨウ素リチウム電池  Lithium-iodine battery リチウムヨウ素 lithium iodine"},{"term":"銀酸化バナジウム・リチウム電池","en":"Silver vanadium oxide-lithium battery","abbr":"SVO","cat":"電池","device":"ICD","maker":"General","short":"ICD/CRT-Dに使われる電池。内部抵抗が非常に低く、ショック用の電気を短時間でキャパシタに蓄えられる。長期間使わないと性能が落ちるため定期的な再形成が行われる。","tags":"銀酸化バナジウム・リチウム電池 SVO Silver vanadium oxide-lithium battery バナジウム silver vanadium"},{"term":"BOL","en":"Begin of life","abbr":"BOL","cat":"電池","device":"PM / ICD / CRT","maker":"General","short":"電池の使い始めの段階。以降ERI（推奨交換時期）→EOS（寿命末期）へと消耗が進む。この段階では推定寿命の表示も長めに出る。","tags":"BOL BOL Begin of life 使い始め begin of life 使用開始時電池状態 BOL beginning of life"},{"term":"チップ電極","en":"Tip electrode","abbr":"","cat":"リード","device":"PM / ICD / CRT","maker":"General","short":"リード先端の電極。双極リードでは陰極として刺激・感知を行う。表面積が小さいほど電流密度が上がり閾値が下がる。","tags":"チップ電極  Tip electrode 先端電極 陰極 tip"},{"term":"リング電極","en":"Ring electrode","abbr":"","cat":"リード","device":"PM / ICD / CRT","maker":"General","short":"先端から約1cm手前のリング状電極。双極リードでは陽極となる。ICDリードではこの有無で感知構成が変わる。","tags":"リング電極  Ring electrode 陽極 ring"},{"term":"同軸構造","en":"Coaxial construction","abbr":"","cat":"リード","device":"PM / ICD / CRT","maker":"General","short":"双極リード内部構造の一つ。中心の**インナーコイル（Inner Coil＝カソード／陰極）**を配し、その外側に絶縁被膜・**アウターコイル（Outer Coil＝アノード／陽極）**・外側絶縁被膜を同心円状に重ねる。**導線は1本の針金ではなく3〜4本の線をより合わせたコイル**になっている。細く作れるが、内外の導体が擦れると絶縁不良（MIO）の原因になる。","tags":"同軸構造  Coaxial construction coaxial 同軸 同軸リード coaxial lead Outer Coil Anode Inner Coil Cathode アウターコイル インナーコイル 3〜4本 多条コイル 内側絶縁 外側絶縁"},{"term":"平行巻構造","en":"Parallel-wound construction","abbr":"","cat":"リード","device":"PM / ICD / CRT","maker":"General","short":"双極リード内部構造の一つ。絶縁被覆した陰極・陽極コンダクタを並べてコイル状に巻いた構造。同軸構造より内部での擦れが起きにくい。","tags":"平行巻構造  Parallel-wound construction parallel wound"},{"term":"マルチルーメン構造","en":"Multi-lumen construction","abbr":"","cat":"リード","device":"ICD","maker":"General","short":"内部に複数の導体を通すため複数の管腔を持つICDリードの断面構造。電極配置はメーカーで異なる。構造が複雑なぶん、耐久性が課題となる。","tags":"マルチルーメン構造  Multi-lumen construction multilumen ルーメン構造 lumen" br":"","cat":"トラブル","device":"PM","maker":"General","short":"ユニポーラペーシングなどで、本体（陽極）付近の大胸筋が刺激されぴくつく現象。絶縁不良やルーズピンでも生じる。","tags":"大胸筋刺激（twitching）  Pectoral muscle twitching twitching ポケット筋収縮 ルーズピン 絶縁体不良 単極ペーシング 極性変更"},{"term":"マルチサイトペーシング（NBG第5文字）","en":"Multisite pacing (NBG 5th)","abbr":"","cat":"モード","device":"PM / ICD / CRT","maker":"General","short":"NBGコード第5文字が表す、同一心腔内の複数部位ペーシング機能の有無。両室ペーシングやマルチポイントペーシングが該当する。","tags":"マルチサイトペーシング（NBG第5文字）  Multisite pacing (NBG 5th) multisite NBG"},{"term":"AVディレイ","en":"atrio-ventricular delay","abbr":"AV delay","cat":"AV・タイミング","device":"PM","maker":"General","short":"心房イベントから心室刺激までの待機時間。AV delay。長すぎると房室同期が崩れ、短すぎると心室充満が不十分になる。","tags":"PM / General / atrio-ventricular / delay / PMT 房室遅延 AV delay AVディレイ"},{"term":"心房エスケープインターバル","en":"Atrial escape interval","abbr":"","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"自己P波を感知してから次の心房ペーシングまでの間隔。ペーシングインターバルからAVディレイを引いた時間に相当する。心室を基準に計時する方式で用いられる。","tags":"心房エスケープインターバル  Atrial escape interval AEI"},{"term":"エスケープインターバル","en":"Escape interval","abbr":"","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"感知した自己心拍を起点に、次のペーシングまでを計時する間隔。この時間内に自己波が出なければペーシングが入る。","tags":"エスケープインターバル  Escape interval escape"},{"term":"クロストークセンシングウインドウ","en":"Crosstalk sensing window","abbr":"","cat":"AV・タイミング","device":"PM / CRT","maker":"General","short":"心房刺激後の心室絶対不応期の後半に設けられた窓。ここで感知があると心室安全ペーシング（VSP）が作動する。心室ブランキングの直後に置かれる短い窓。","tags":"クロストークセンシングウインドウ  Crosstalk sensing window crosstalk window"},{"term":"FFRWS Type I/II","en":"Far-field R-wave sensing types","abbr":"","cat":"センシング","device":"PM / CRT","maker":"General","short":"R波を心房側で誤検出するFFRWSの分類。R波の後に出るものがType I、前に出るものがType II。対処法が異なる。Type IはPVAB延長、Type IIは感度調整で対応する。","tags":"FFRWS Type I/II  Far-field R-wave sensing types FFRWS FFRW type Type1 Type2 FFRWS PVAB モードスイッチ誤作動"},{"term":"A-Aカウンター","en":"A-A counter","abbr":"","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"心房イベントから次の心房ペーシングまでを計時する方式。自己QRSが出てもA-A間隔は変わらない。レートが安定しやすく、現在の多くの機種が採用する。","tags":"A-Aカウンター  A-A counter A-A counter"},{"term":"V-Vカウンター","en":"V-V counter","abbr":"","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"心室イベントを基準に計時する方式。V-A間隔が一定になるよう心房ペーシングし、自己QRSが早く出るとレートが上がりうる。自己QRSが早いと全体のレートがやや速くなる。","tags":"V-Vカウンター  V-V counter V-V counter"},{"term":"変時性不全","en":"Chronotropic incompetence","abbr":"","cat":"不整脈・EP","device":"PM","maker":"General","short":"運動時に心拍数を十分に上げられない、または上昇に時間がかかる状態。レートレスポンス機能の適応になる。徐脈がなくても運動耐容能が低下する。","tags":"変時性不全  Chronotropic incompetence chronotropic incompetence"},{"term":"分時換気量センサ","en":"Minute ventilation sensor","abbr":"","cat":"レート応答","device":"PM","maker":"General","short":"胸郭インピーダンスの変化から呼吸数・分時換気量を推定してレートを調整するセンサ。加速度センサと併用されることが多い。生理的な負荷をよく反映するが、反応はやや遅い。","tags":"分時換気量センサ  Minute ventilation sensor MV sensor minute ventilation 分時換気量"},{"term":"加速度センサ","en":"Accelerometer","abbr":"","cat":"レート応答","device":"PM","maker":"General","short":"体動・振動に反応してレートを調整する、最も広く使われるセンサ。植込みの向きに影響されない。反応は速いが、階段を降りる動作などには反応しにくい。","tags":"加速度センサ  Accelerometer accelerometer 加速度 activity"},{"term":"AT/AFエビデンスカウント","en":"AT/AF Evidence Count","abbr":"","cat":"モード","device":"PM / ICD / CRT","maker":"General","short":"メドトロニックのモードスイッチ基準。心室イベント間に心房センシングが2回以上ある拍を数え、一定数でモードスイッチする。単発のPACでは切り替わらないよう設計されている。","tags":"AT/AFエビデンスカウント  AT/AF Evidence Count Medtronic evidence count"},{"term":"FARI","en":"Filtered Atrial Rate Interval","abbr":"FARI","cat":"モード","device":"PM / ICD / CRT","maker":"General","short":"アボットのモードスイッチ基準。心房インターバルの移動平均で、PACに過敏にならずAFに素早く反応する。移動平均を用いるため、心房細動に素早く反応する。","tags":"FARI FARI Filtered Atrial Rate Interval Abbott 移動平均心房インターバル"},{"term":"WARAD","en":"Window of Atrial Rate Acceleration Detection","abbr":"WARAD","cat":"モード","device":"PM / ICD / CRT","maker":"MicroPort CRM","short":"MicroPort CRM（旧 Sorin）の心房イベント検出窓。**心房センスの「早期性」を見て、不整脈としての心房波（AF・AFL・AT）と洞性P波を区別するアルゴリズム。**各心房イベント（心房センス／心房ペース／WARAD・PVARP内センス）でウインドウがトリガされ、**ウインドウ長は先行するP-P（AP/AS を含む）の75％（レート80未満では62.5％）。Arセンスから始まるウインドウは先行WARADと同じ長さで、後続は最大500msに制限される。WARAD内で感知された心房イベントはすべて不応期マーカー「Ar」として表示される。**この中で心房:心室がn:1となる心室周期をサスピションフェーズとして数え、Fallback Mode Switch の判定に使う。","tags":"WARAD Window of Atrial Rate Acceleration Detection MicroPort Sorin 早期性 75% 62.5% 500ms Ar 不応期マーカー サスピション P-P Avg8P-P モードスイッチ"},{"term":"サスピションフェーズ","en":"Suspicion phase","abbr":"","cat":"モード","device":"PM / ICD / CRT","maker":"MicroPort CRM","short":"MicroPort CRM のモードスイッチ判定の中間段階。**WARAD 内で心房波／心室イベントが n:1 になった心室周期を数える**（心房波の数ではなく心室周期の数で数える）。**32心周期中28周期以上（87.5％）で第1基準、32心周期中18周期以上（56％）が2ブロック連続で第2基準**を満たし、Fallback Mode Switch により DDI(R) へ移行する。","tags":"サスピションフェーズ Suspicion phase MicroPort suspicion n:1 心室周期 32心周期 28周期 18周期 87.5% 56% 第1基準 第2基準 FMS"},{"term":"自己房室伝導優先機能","en":"Intrinsic AV conduction preference","abbr":"","cat":"ペーシング","device":"PM / ICD / CRT","maker":"General","short":"不要な右室ペーシングを避け、自己房室伝導を優先する機能の総称。MVP・Search AV+・VIP・IRSplus・RYTHMIQ・VS Suppression などが該当する。AAI⇄DDD切替型とAVディレイ延長型に大別される。","tags":"自己房室伝導優先機能  Intrinsic AV conduction preference MVP Search AV+ VIP IRSplus RYTHMIQ VS Suppression 心室ペーシング抑制 managed ventricular pacing"},{"term":"AVディレイヒステリシス","en":"AV delay hysteresis","abbr":"","cat":"AV・タイミング","device":"PM / ICD / CRT","maker":"General","short":"一時的にAVディレイを延長して自己房室伝導が出るか探し、出れば優先する機能。間欠的房室ブロックで有用。探索の間はAV間隔が長くなり、心室充満に影響しうる。","tags":"AVディレイヒステリシス  AV delay hysteresis Search AV+ VIP AV hysteresis"},{"term":"バルーン付きペーシングカテーテル","en":"Balloon-tipped pacing catheter","abbr":"","cat":"植込み・手技","device":"PM","maker":"General","short":"先端バルーンを膨らませ血流に乗せて右室へ順行性に挿入できる一時ペーシング用カテーテル。透視がない状況でも挿入しやすい。","tags":"バルーン付きペーシングカテーテル  Balloon-tipped pacing catheter balloon Swan-Ganz 体外式"},{"term":"レートヒストグラム","en":"Rate histogram","abbr":"","cat":"フォロー","device":"PM / ICD / CRT","maker":"General","short":"一定期間の心拍数分布を示すフォローの記録。レート設定やレートレスポンスの調整に用いる。上限追従レートの設定にも役立つ。","tags":"レートヒストグラム  Rate histogram rate histogram"},{"term":"一次予防","en":"Primary prevention","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"持続性VT/VFの既往はないが、突然死のリスクが高い病態に対して、発症前にICDを植込む予防。低心機能や特定の心筋症などが対象。MADIT-IIやSCD-HeFTが根拠となる。","tags":"一次予防  Primary prevention primary prevention MADIT-II DANISH DEFINITE SCD-HeFT EF30% NYHA 左室径65mm"},{"term":"二次予防","en":"Secondary prevention","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"過去に心停止・持続性VT・VFを起こした患者に、再発による突然死を防ぐ目的で行うICD治療。AVID試験で有効性が確立している。","tags":"二次予防  Secondary prevention secondary prevention AVID VT VF 既往 アミオダロン"},{"term":"ショックリード","en":"Shock lead / ICD lead","abbr":"","cat":"リード","device":"ICD","maker":"General","short":"感知・ペーシング電極と除細動用コイル電極を備えたICD用リード。多線条（マルチルーメン）構造で耐久性が課題となる。断線するとVT/VFへの治療が届かず、致命的となりうる。","tags":"ショックリード  Shock lead / ICD lead shock lead ICDリード"},{"term":"二相性ショック","en":"Biphasic shock waveform","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"極性が第1相と第2相で逆になる除細動波形。単相性より除細動閾値を下げられ、現在の標準となっている。心筋障害も少なく、現在の標準波形。","tags":"二相性ショック  Biphasic shock waveform biphasic バイフェージック"},{"term":"tilt（チルト）","en":"Tilt","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"ショック放電時の初期電圧と終末電圧の比率（傾斜率）。固定tiltと可変tiltがあり、設定でDFTが変わることがある。インピーダンスに応じて変える可変tiltもある。","tags":"tilt（チルト）  Tilt tilt 傾斜率 固定tilt 可変tilt"},{"term":"蓄電エネルギー","en":"Stored energy","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"キャパシタに充電されるエネルギー。実際に心臓へ届く放電エネルギーとは区別され、機種により表示・設定基準が異なる。表示・設定の基準がメーカーで異なるため比較時に注意する。","tags":"蓄電エネルギー  Stored energy stored energy 蓄電"},{"term":"放電エネルギー","en":"Delivered energy","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"実際に患者へ放電されたエネルギー。キャパシタに蓄えた蓄電エネルギーより小さくなる。回路や組織での損失があるぶん小さくなる。","tags":"放電エネルギー  Delivered energy delivered energy"},{"term":"同期下ショック（カルディオバージョン）","en":"Synchronized cardioversion","abbr":"CV","cat":"ICD","device":"ICD","maker":"General","short":"QRS(R波)に同期させて放電し、頻拍を停止させる治療。意識のある頻拍で低エネルギーから行うことが多い。T波への放電を避けて心室細動の誘発を防ぐ。","tags":"同期下ショック（カルディオバージョン） CV Synchronized cardioversion cardioversion CV 同期"},{"term":"ポストショックペーシング","en":"Post-shock pacing","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"ショック後の一時的な徐脈に備え、一定時間バックアップとして行うペーシング。ショック直後の心停止に備える安全機構。","tags":"ポストショックペーシング  Post-shock pacing post-shock backup"},{"term":"検出ゾーン","en":"Detection zones (VF/VT/FVT)","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"頻拍を心拍数で区切った検出帯。VFゾーン・VTゾーン・Fast VT(FVT)ゾーン・モニタゾーンなどを設定する。ゾーンごとに治療内容と検出時間を設定する。","tags":"検出ゾーン  Detection zones (VF/VT/FVT) VF zone VT zone FVT monitor 検出ゾーン設定"},{"term":"Fast VTゾーン","en":"Fast VT zone","abbr":"FVT","cat":"ICD","device":"ICD","maker":"General","short":"VTゾーンとVFゾーンの間に置く高レートVTの帯。ATPで無痛停止を狙える速いVTを別に扱う。本来ショックとなるレートでもATPを試みられる。","tags":"Fast VTゾーン FVT Fast VT zone FVT fast VT"},{"term":"累積カウント方式","en":"Consecutive interval counting","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"連続して設定拍数を満たすと頻拍と判定する方式。1拍でも基準を外れるとカウントが0に戻る。VT検出に用いる。規則的なVTの検出に適している。","tags":"累積カウント方式  Consecutive interval counting consecutive count 累積検出"},{"term":"X/Y検出（ウインドウセンシング）","en":"X-of-Y detection","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"直近Y拍のうちX拍が検出帯に入れば頻拍と判定する方式。間欠的アンダーセンシングがあっても検出を継続できる。VF検出に用いる。振幅が変動する心室細動の検出に適している。","tags":"X/Y検出（ウインドウセンシング）  X-of-Y detection X/Y window sensing ウインドウ"},{"term":"onset基準","en":"Onset criterion","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"心拍数の立ち上がりの急峻さでSVTとVTを鑑別するSVT鑑別基準。ゆるやかな上昇の洞頻拍を除外する。厳しくしすぎると運動誘発性VTの治療を抑制してしまう。","tags":"onset基準  Onset criterion onset SVT鑑別 Onset Sudden onset criterion Onset率 洞頻拍 鑑別 運動誘発性VT 不適切抑制 single-chamber onset criteria オンセット基準"},{"term":"stability基準","en":"Stability criterion","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"R-R間隔の変動の大きさでSVTとVTを鑑別する基準。不安定なら心房細動、安定ならVTと判定する。心房細動中でもR-Rが安定すると治療を抑制できない。","tags":"stability基準  Stability criterion stability SVT鑑別 Stability Interval stability Stability値 R-Rばらつき 心房細動 VT鑑別 single-chamber stability criteria スタビリティ基準"},{"term":"パターン識別","en":"Pattern recognition (PR Logic)","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"心房波と心室波の関係（P-P・R-R間隔、順序）をパターン化してSVTとVTを鑑別する方法。心房情報が必要でデュアルチャンバで用いる。心房リードのない機種では使えない。","tags":"パターン識別  Pattern recognition (PR Logic) pattern PR Logic 房室関係 PR Logic Medtronic Double Tachy Wavelet AF/AFL Sinus Tachy Other 1:1"},{"term":"興奮間隙","en":"Excitable gap","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"リエントリー回路内で興奮可能な部分。ATPの刺激がここに侵入し、興奮前面と衝突して頻拍を停止させる。ここに刺激が入り込めるかがATPの成否を分ける。","tags":"興奮間隙  Excitable gap excitable gap wave front 興奮前面 excitable gap entrainment excitable gap III群 リエントリー 不応期延長 心房粗動"},{"term":"スキャン（ATP）","en":"Scan ATP","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"バーストの周期をシーケンスごとに少しずつ短縮していくATPの設定。スキャンバーストとして用いる。一定の周期で止まらない頻拍に有効なことがある。","tags":"スキャン（ATP）  Scan ATP scan スキャンバースト"},{"term":"T波ダブルカウント","en":"T-wave double counting","abbr":"","cat":"トラブル","device":"ICD","maker":"General","short":"感度を鋭くしすぎた際、1拍のR波とT波を二重に数えてしまう現象。頻拍の過剰検出・不適切作動の原因になる。感度やフィルタの調整で対応する。","tags":"T波ダブルカウント  T-wave double counting T wave double count TWOS TWOS R波ダブルカウント 不適切作動"},{"term":"不適切作動","en":"Inappropriate therapy","abbr":"","cat":"トラブル","device":"ICD","maker":"General","short":"VT/VF以外（SVT・オーバーセンシング・リード雑音など）をICDが誤って治療してしまうこと。QOLを大きく損なう。発生割合は7.6〜13％と報告され、心房細動が最多の原因。","tags":"不適切作動  Inappropriate therapy inappropriate therapy 不適切ショック unnecessary Inappropriate shock Inappropriate ICD therapy inappropriate 7.6% 13% 上室不整脈 EMI 筋電位 ダブルカウント 不適切抑制"},{"term":"心臓再同期療法","en":"Cardiac resynchronization therapy","abbr":"CRT","cat":"CRT・CSP","device":"CRT","maker":"General","short":"右室と左室をほぼ同時にペーシングして心室の同期不全を改善し、心拍出量やQOL、心不全症状の改善を図る治療。長期的には生命予後の改善も期待できる。","tags":"心臓再同期療法 CRT Cardiac resynchronization therapy CRT resynchronization 両心室"},{"term":"CRT-P","en":"CRT pacemaker","abbr":"CRT-P","cat":"CRT・CSP","device":"CRT","maker":"General","short":"除細動機能のない両心室ペースメーカ。RVリードは通常のペースメーカリードを用いる。CARE-HF試験では除細動機能がなくても突然死を減らせた。","tags":"CRT-P CRT-P CRT pacemaker CRT-P pacemaker"},{"term":"CRT-D","en":"CRT defibrillator","abbr":"CRT-D","cat":"CRT・CSP","device":"CRT","maker":"General","short":"除細動機能を備えたCRT。RVにショックコイル付きリードを用い、心不全と致死性心室不整脈の双方に対応する。再同期治療と致死性不整脈への治療を兼ねる。","tags":"CRT-D CRT-D CRT defibrillator CRT-D defibrillator"},{"term":"両心室ペーシング","en":"Biventricular pacing","abbr":"BiV","cat":"CRT・CSP","device":"CRT","maker":"General","short":"右室と左室を同時期に刺激して心室の同期を回復させるペーシング。CRTの基本動作。この割合（BiV%）を高く保つことが効果に直結する。","tags":"両心室ペーシング BiV Biventricular pacing BiV biventricular BiV pacing Biventricular pacing"},{"term":"ガイディングカテーテル（CS）","en":"Guiding catheter","abbr":"","cat":"CRT・CSP","device":"CRT","maker":"General","short":"冠静脈洞(CS)へLVリードを導くための専用シース。CSまでのトンネルを作り側枝へリードを進める。留置後は縦に切開して抜去する。","tags":"ガイディングカテーテル（CS）  Guiding catheter guiding catheter CS 冠静脈洞"},{"term":"QRS幅","en":"QRS duration","abbr":"","cat":"心電図","device":"PM / ICD / CRT","maker":"General","short":"心室興奮が伝わる時間を表す指標。左脚ブロックで延長(wide)し、CRTの適応や効果判定に用いる。120ms以上がCRT適応判断の目安となる。","tags":"QRS幅  QRS duration QRS width narrow wide 左脚ブロック"},{"term":"NYHA心機能分類","en":"NYHA functional class","abbr":"NYHA","cat":"フォロー","device":"CRT","maker":"General","short":"心不全の自覚症状による重症度分類（I〜IV）。CRTなどの適応判断に用いる。II度以上がCRT適応判断の目安となる。","tags":"NYHA心機能分類 NYHA NYHA functional class NYHA class 心不全"},{"term":"左室駆出率","en":"Left ventricular ejection fraction","abbr":"LVEF","cat":"フォロー","device":"CRT","maker":"General","short":"左室が拍出する血液の割合。低下例（例:35%以下）はCRT/ICDの適応の目安になる。35％以下がCRT・ICD適応の一つの目安。","tags":"左室駆出率 LVEF Left ventricular ejection fraction LVEF EF 駆出率"},{"term":"心胸比","en":"Cardiothoracic ratio","abbr":"CTR","cat":"フォロー","device":"CRT","maker":"General","short":"胸部X線での心臓と胸郭の幅の比。心拡大の指標で、CRT奏効例では縮小する。50％を超えると心拡大とされる。","tags":"心胸比 CTR Cardiothoracic ratio CTR 心拡大"},{"term":"僧帽弁逆流","en":"Mitral regurgitation","abbr":"MR","cat":"フォロー","device":"CRT","maker":"General","short":"僧帽弁が閉じきらず左室から左房へ血液が逆流する状態。同期不全で悪化し、CRTで改善しうる。心不全増悪の要因にもなる。","tags":"僧帽弁逆流 MR Mitral regurgitation MR mitral regurgitation 僧帽弁閉鎖不全"},{"term":"BNP","en":"B-type natriuretic peptide","abbr":"BNP","cat":"フォロー","device":"CRT","maker":"General","short":"心臓への負荷で上昇する心不全のバイオマーカー。CRT奏効例では低下する。治療効果の判定にも用いられる。","tags":"BNP BNP B-type natriuretic peptide BNP ナトリウム利尿ペプチド"},{"term":"MADIT-II","en":"MADIT-II trial","abbr":"","cat":"エビデンス","device":"ICD","maker":"General","short":"陳旧性心筋梗塞で低心機能の患者に対する、ICDの一次予防効果を示した代表的試験。EF30％以下・陳旧性心筋梗塞1,232名が対象。","tags":"MADIT-II  MADIT-II trial MADIT-II primary prevention EF30% 陳旧性心筋梗塞 1232名 19.1%減少 2001年 クラスI"},{"term":"SCD-HeFT","en":"SCD-HeFT trial","abbr":"","cat":"エビデンス","device":"ICD","maker":"General","short":"心不全患者でICDが総死亡を減らすことを示した一次予防の代表的試験。虚血性・非虚血性の双方を含む。","tags":"SCD-HeFT  SCD-HeFT trial SCD-HeFT 心不全 primary EF35% NYHA II III 2005年 一次予防 非虚血性"},{"term":"発作性心房細動","en":"Paroxysmal AF","abbr":"","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"治療の有無にかかわらず7日以内に洞調律へ戻る心房細動。発作性→持続性→永続性へと進行しやすい。多くは48時間以内に自然停止する。","tags":"発作性心房細動  Paroxysmal AF paroxysmal 発作性"},{"term":"持続性心房細動","en":"Persistent AF","abbr":"","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"7日を超えて持続する心房細動。1年以上続くものは長期持続性と呼ぶ。除細動や薬物で洞調律に戻せる可能性が残る。","tags":"持続性心房細動  Persistent AF persistent 持続性"},{"term":"永続性心房細動","en":"Permanent AF","abbr":"","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"洞調律維持を考慮しない（除細動不可能と判断される）心房細動。レートコントロールと抗凝固が治療の中心となる。","tags":"永続性心房細動  Permanent AF permanent 永続性"},{"term":"CHADS2スコア","en":"CHADS2 score","abbr":"","cat":"薬剤","device":"PM / ICD / CRT","maker":"General","short":"心房細動の脳梗塞リスク評価。心不全・高血圧・年齢≥75・糖尿病を各1点、脳卒中/TIA既往を2点で算定し、抗凝固の判断に用いる。1点以上でDOACが推奨される。","tags":"CHADS2スコア  CHADS2 score CHADS2 脳梗塞 抗凝固 心不全 高血圧 75歳 糖尿病 脳梗塞TIA 2点 DOAC 抗凝固"},{"term":"潜因性脳梗塞","en":"Cryptogenic stroke","abbr":"","cat":"不整脈・EP","device":"ICM","maker":"General","short":"原因が特定できない脳梗塞。背景に隠れた発作性心房細動を疑い、挿入型心電計(ICM)で長期モニタリングして検出する。心房細動が確認されないとDOACの適応にならない。","tags":"潜因性脳梗塞  Cryptogenic stroke cryptogenic 原因不明 脳梗塞 ICM"},{"term":"通常型心房粗動","en":"Typical atrial flutter","abbr":"","cat":"不整脈・EP","device":"PM / ICD / CRT","maker":"General","short":"三尖弁輪を反時計回りに旋回するマクロリエントリー。下壁誘導で陰性の鋸歯状F波を示す。三尖弁輪下大静脈間峡部（CTI）のアブレーションが有効。","tags":"通常型心房粗動  Typical atrial flutter typical AFL 三尖弁輪"},{"term":"等電位線","en":"Isoelectric line","abbr":"","cat":"心電図","device":"PM / ICD / CRT","maker":"General","short":"P波やF波の間にみられる平坦な基線。心房粗動では等電位線を認めないのが特徴。心房頻拍との鑑別点になる。","tags":"等電位線  Isoelectric line isoelectric 基線"},{"term":"マクロリエントリー","en":"Macroreentry","abbr":"","cat":"不整脈・EP","device":"","maker":"General","short":"大きな解剖学的旋回路を電気的興奮が周回して持続する頻拍の機序。心房粗動などが該当する。瘢痕関連の心室頻拍もこの機序による。","tags":"マクロリエントリー  Macroreentry macroreentry 旋回"},{"term":"撃発活動","en":"Triggered activity","abbr":"","cat":"不整脈・EP","device":"","maker":"General","short":"後脱分極が引き金となって生じる異常興奮。遅延後脱分極(DAD)はCPVTなどに関与する。ジギタリス中毒やCa過負荷が背景となる。","tags":"撃発活動  Triggered activity triggered activity DAD 後脱分極"},{"term":"緩徐伝導","en":"Slow conduction","abbr":"","cat":"不整脈・EP","device":"","maker":"General","short":"障害心筋などを興奮がゆっくり伝わる状態。伝導遅延部を作りリエントリーを成立させる。障害心筋を興奮がゆっくり伝わることで回路が閉じる。","tags":"緩徐伝導  Slow conduction slow conduction 伝導遅延"},{"term":"エントレインメント","en":"Entrainment","abbr":"","cat":"不整脈・EP","device":"","maker":"General","short":"頻拍回路を外部からペーシングし、融合波を経て回路内に取り込む現象。回路の同定に用いる。潜在性エントレインメントは回路上のペーシングを示す。アブレーションの標的部位を決める際に用いる。","tags":"エントレインメント  Entrainment entrainment concealed 潜在性"},{"term":"遅延電位","en":"Late potential","abbr":"LP","cat":"心電図","device":"","maker":"General","short":"QRS終末部に現れる小さな遅延した電位。加算平均心電図で検出され、リエントリー基質の存在を示唆する。3指標のうち2つが異常なら陽性と判定する。","tags":"遅延電位  Late potential late potential 加算平均心電図 SAECG late potential LP Late potential"},{"term":"虚血性心疾患","en":"Ischemic heart disease","abbr":"IHD","cat":"不整脈・EP","device":"ICD","maker":"General","short":"冠動脈の狭窄・閉塞で心筋が虚血・壊死する疾患群。梗塞後の瘢痕はVTの基質となり、ICD適応の代表的背景。血行再建と薬物治療を行ったうえで適応を判断する。","tags":"虚血性心疾患 IHD Ischemic heart disease IHD 心筋梗塞 虚血"},{"term":"不整脈原性右室心筋症","en":"Arrhythmogenic RV cardiomyopathy","abbr":"ARVC","cat":"不整脈・EP","device":"ICD","maker":"General","short":"右室心筋の脂肪・線維化を特徴とする遺伝性心筋症。ε波や右前胸部誘導の陰性T波を示し、VT/VFによる突然死のリスクが高い。右室の脂肪・線維置換が病理学的特徴。","tags":"不整脈原性右室心筋症 ARVC Arrhythmogenic RV cardiomyopathy ARVC epsilon ε波 fibrofatty ARVC ARVC Arrhythmogenic RV cardiomyopathy"},{"term":"催不整脈作用","en":"Proarrhythmia","abbr":"","cat":"薬剤","device":"PM / ICD / CRT","maker":"General","short":"抗不整脈薬が逆に不整脈を誘発・悪化させる作用。I群薬の伝導遅延やIII群薬のQT延長によるTdPなどがある。洞停止や完全房室ブロックを来すこともある。","tags":"催不整脈作用  Proarrhythmia proarrhythmia 催不整脈 proarrhythmia 洞停止 完全房室ブロック 徐脈頻脈症候群 Ic群 抗コリン作用"},{"term":"活動電位","en":"Action potential","abbr":"AP","cat":"不整脈・EP","device":"","maker":"General","short":"心筋細胞が脱分極で興奮した際の電位変化。第0相〜第4相の5相からなり、体表面から見たものが心電図となる。0相の急速脱分極から4相の静止膜電位まで続く。","tags":"活動電位 AP Action potential action potential 0相 4相"},{"term":"イオンチャネル","en":"Ion channel","abbr":"","cat":"不整脈・EP","device":"","maker":"General","short":"細胞膜のイオンの出入りを担う通路。Na・Ca・Kチャネルの働きで活動電位が形成される。遺伝子異常はチャネル病(QT延長・Brugada等)を起こす。抗不整脈薬はこれらのチャネルを標的とする。","tags":"イオンチャネル  Ion channel ion channel Na Ca K チャネル病"},{"term":"遅延後脱分極","en":"Delayed afterdepolarization","abbr":"DAD","cat":"不整脈・EP","device":"","maker":"General","short":"再分極後に細胞内Ca過負荷などで生じる異常な脱分極。撃発活動を介してCPVTなどの不整脈を起こす。細胞内Ca過負荷が引き金となる。","tags":"遅延後脱分極 DAD Delayed afterdepolarization DAD afterdepolarization triggered"},{"term":"過常期","en":"Supernormal phase","abbr":"","cat":"不整脈・EP","device":"","maker":"General","short":"相対不応期の終わりにみられる、通常より弱い刺激でも興奮しやすい一過性の時期。理論上、この時期の弱い刺激でも興奮が起こりうる。","tags":"過常期  Supernormal phase supernormal phase"},{"term":"活動電位持続時間","en":"Action potential duration","abbr":"APD","cat":"不整脈・EP","device":"","maker":"General","short":"1回の活動電位が続く時間。不応期の長さと関連し、延長はQT延長・TdPに関与する。III群抗不整脈薬はこれを延長させて不応期を延ばす。","tags":"活動電位持続時間 APD Action potential duration APD action potential duration"},{"term":"洞房結節","en":"Sinoatrial node","abbr":"SAN","cat":"不整脈・EP","device":"PM","maker":"General","short":"右心房と上大静脈移行部の心外膜下にある、心臓の正常な歩調取り（ペースメーカ）。障害されると洞不全症候群になる。自律神経の影響を強く受ける。","tags":"洞房結節 SAN Sinoatrial node SAN 洞結節 sinus node"},{"term":"結節間伝導路","en":"Internodal tracts","abbr":"","cat":"不整脈・EP","device":"","maker":"General","short":"洞房結節から房室結節へ興奮を伝える経路。前・中(Wenckebach)・後(Thorel)結節間路があり、Bachmann束は左房へ分岐する。左房への分岐がバッハマン束にあたる。","tags":"結節間伝導路  Internodal tracts internodal Bachmann Wenckebach Thorel"},{"term":"プルキンエ線維","en":"Purkinje fibers","abbr":"","cat":"不整脈・EP","device":"","maker":"General","short":"脚から心室筋へ興奮を速く伝える終末の伝導網。心室のほぼ同時興奮（narrow QRS）を担う。この網を介さない右室ペーシングではQRSが広くなる。","tags":"プルキンエ線維  Purkinje fibers Purkinje 脚 線維網"},{"term":"脚（右脚・左脚）","en":"Bundle branches","abbr":"","cat":"不整脈・EP","device":"","maker":"General","short":"ヒス束から分岐して心室中隔を下行する伝導路。左脚はさらに前枝・後枝に分かれる。障害で脚ブロックとなる。右脚は細い1本、左脚は扇状に広がる。","tags":"脚（右脚・左脚）  Bundle branches bundle branch RBB LBB 右脚 左脚"},{"term":"線維三角","en":"Fibrous trigone","abbr":"","cat":"植込み・手技","device":"","maker":"General","short":"4つの弁口を囲む線維性骨格のうち、左右の房室弁口と大動脈弁口を結ぶ部位。房室束(ヒス束)がここを貫く。刺激伝導系ペーシングを理解するうえで重要な構造。","tags":"線維三角  Fibrous trigone fibrous trigone 線維性骨格"},{"term":"分界稜","en":"Crista terminalis","abbr":"","cat":"植込み・手技","device":"","maker":"General","short":"右心房でSVCとIVC開口部の右側を連ねる隆起。自由壁と中隔面を隔てる目印になる。心房リードの留置位置を考える際の目印になる。リードレス心房デバイスでは、分界稜より前方（側壁）には櫛状筋があり、後方（後壁）には櫛状筋がないため、留置部位を考えるうえでの境目になる。","tags":"分界稜  Crista terminalis crista terminalis 分界稜 リードレス 心房用LP 側壁 後壁 櫛状筋 AVEIR AR"},{"term":"櫛状筋","en":"Pectinate muscle","abbr":"","cat":"植込み・手技","device":"","maker":"General","short":"右心房自由壁を走る櫛状の筋束。右心耳に連なる。タインド型リードはこの筋束に絡めて固定する。心房用リードレスペースメーカ（AVEIR AR／AR2）の推奨留置部位である右心耳基部は、この筋束が密で安定性と安全性が得られる部位とされる。","tags":"櫛状筋  Pectinate muscle pectinate muscle 櫛状筋 リードレス 右心耳基部 AVEIR AR AR2 緻密"},{"term":"卵円窩","en":"Fossa ovalis","abbr":"","cat":"植込み・手技","device":"","maker":"General","short":"心房中隔中央の窪み。卵円孔開存があるとリード挿入時にまれに左房へ迷入することがある。心房中隔ペーシングの目印にもなる。","tags":"卵円窩  Fossa ovalis fossa ovalis 卵円孔 PFO"},{"term":"Eustachian弁","en":"Eustachian valve","abbr":"","cat":"植込み・手技","device":"","maker":"General","short":"下大静脈開口部にある遺残弁。Chiari網とともにリード操作の障害になることがある。冠静脈洞へのアクセスを難しくすることがある。","tags":"Eustachian弁  Eustachian valve Eustachian Chiari 遺残弁"},{"term":"Thebesian弁","en":"Thebesian valve","abbr":"","cat":"植込み・手技","device":"CRT","maker":"General","short":"冠静脈洞(CS)入口部にある弁組織。CSリード挿入の障害になることがある。CRTのリード挿入が困難になる原因となる。","tags":"Thebesian弁  Thebesian valve Thebesian CS 冠静脈洞弁"},{"term":"橈側皮静脈","en":"Cephalic vein","abbr":"","cat":"植込み・手技","device":"PM / ICD / CRT","maker":"General","short":"大胸筋と三角筋の溝(deltopectoral groove)を走る静脈。カットダウン法でリードを直接挿入でき、気胸などの合併症を避けられる。カットダウン法では気胸のリスクがない。","tags":"橈側皮静脈  Cephalic vein cephalic 橈側皮静脈 カットダウン deltopectoral 三角筋大胸筋溝 deltopectoral groove カットダウン"},{"term":"腋窩静脈","en":"Axillary vein","abbr":"","cat":"植込み・手技","device":"PM / ICD / CRT","maker":"General","short":"胸郭外穿刺の標的血管。合流部より近位で穿刺すると肋鎖靭帯の影響でリード損傷のリスクが上がるため、合流部近位で穿刺する。第二肋骨上あたりでの穿刺が推奨される。","tags":"腋窩静脈  Axillary vein axillary 腋窩静脈 胸郭外穿刺"},{"term":"鎖骨下穿刺","en":"Subclavian puncture","abbr":"","cat":"植込み・手技","device":"PM / ICD / CRT","maker":"General","short":"鎖骨下静脈を穿刺してリードを挿入する方法。近位すぎると肋鎖靭帯でリードが挟まれ、断線（サブクラビアンクラッシュ）を来しやすい。胸郭外で穿刺することで圧迫を避けられる。","tags":"鎖骨下穿刺  Subclavian puncture subclavian 鎖骨下 crush 肋鎖靭帯"},{"term":"大腿静脈","en":"Femoral vein","abbr":"","cat":"植込み・手技","device":"Leadless","maker":"General","short":"下肢の静脈。リードレスペースメーカ植込み時のアクセス血管として用いられる（右大腿静脈）。27Frのイントロデューサーを挿入する。","tags":"大腿静脈  Femoral vein femoral 大腿静脈 leadless"},{"term":"左上大静脈遺残","en":"Persistent left SVC","abbr":"PLSVC","cat":"植込み・手技","device":"PM / ICD / CRT","maker":"General","short":"左側にも上大静脈が遺残する先天奇形（成人の約0.3〜0.5%）。左側アプローチ時に想定し、拡張したCSを手がかりに術前診断する。拡張した冠静脈洞が手がかりとなる。","tags":"左上大静脈遺残 PLSVC Persistent left SVC PLSVC 遺残 左上大静脈"},{"term":"卵円孔開存","en":"Patent foramen ovale","abbr":"PFO","cat":"植込み・手技","device":"PM / ICD / CRT","maker":"General","short":"卵円窩の卵円孔が閉じずに残る状態（各年代で約9%）。リードが左室へ迷入する原因になりうる。透視での位置確認が重要となる。","tags":"卵円孔開存 PFO Patent foramen ovale PFO 卵円孔開存"},{"term":"横隔神経刺激","en":"Phrenic nerve stimulation","abbr":"PNS","cat":"トラブル","device":"CRT","maker":"General","short":"左室ペーシングで横隔神経を刺激し、しゃっくり様のけいれんを生じる合併症。四極LVリードで刺激電極を変えて回避する。吃逆様の症状となり、出力低下や極性・部位の変更で回避する。体位によって出現しやすさが変わる。","tags":"横隔神経刺激 PNS Phrenic nerve stimulation PNS phrenic しゃっくり twitching PNS PNS Phrenic Nerve Stimulation PNS phrenic nerve stimulation 吃逆 しゃっくり 4極リード 極性 体位 QOL"},{"term":"LVペーシングベクトル","en":"LV pacing vector","abbr":"","cat":"CRT・CSP","device":"CRT","maker":"General","short":"四極LVリードで、陰極と陽極の電極の組合せ。10通り前後から、横隔神経刺激の回避・閾値・遅延時間を考慮して最良のベクトルを選ぶ。横隔神経刺激が出た場合の回避手段としても使う。","tags":"LVペーシングベクトル  LV pacing vector vector LV ベクトル cathode anode LV vector Left ventricular pacing vector LVペーシング極性 LV Pacing Polarity"},{"term":"Q-LV間隔","en":"Q-LV interval","abbr":"","cat":"CRT・CSP","device":"CRT","maker":"General","short":"QRSの始まりからLVリードで得られる左室電位までの間隔。長い（伝導遅延部）ほどCRTの効果が高いとされる留置部位の指標。長い症例ほどCRTに反応しやすい。","tags":"Q-LV間隔  Q-LV interval Q-LV 遅延 QLV"},{"term":"RV-LV遅延時間","en":"RV-LV delay","abbr":"","cat":"CRT・CSP","device":"CRT","maker":"General","short":"右室と左室リード間の伝導時間。簡易的にLVの遅延部位を評価でき、最適なLVペーシング部位選択に用いる。簡便に電気的遅延部位を評価できる。","tags":"RV-LV遅延時間  RV-LV delay RV-LV delay 遅延時間"},{"term":"至適化（オプティマイゼーション）","en":"AV/VV optimization","abbr":"","cat":"CRT・CSP","device":"CRT","maker":"General","short":"心機能が最大になるようAVディレイ・VVディレイを調整すること。心エコーやデバイスの自動プログラムで行い、時間とともに変化するため定期評価する。心不全の状態が変われば再調整が必要になる。","tags":"至適化（オプティマイゼーション）  AV/VV optimization optimization 至適化 AV VV AV optimization AV delay optimization AV/VV timing AV VV optimization タイミング調整"},{"term":"レスポンダー","en":"CRT responder","abbr":"","cat":"CRT・CSP","device":"CRT","maker":"General","short":"CRT導入後に心不全の改善（症状・エコー・再入院・BNP等）が得られた症例。改善しない例をノンレスポンダーと呼ぶ。どの指標を用いるかで該当割合が変わる。","tags":"レスポンダー  CRT responder responder レスポンダー"},{"term":"ノンレスポンダー","en":"CRT non-responder","abbr":"","cat":"CRT・CSP","device":"CRT","maker":"General","short":"CRTで効果が得られない症例（3〜4割）。至適化不足・不整脈・低ペーシング率・LVリード位置・薬物不足などが要因。BiV率・リード位置・至適化・薬物療法の順に確認する。","tags":"ノンレスポンダー  CRT non-responder non-responder ノンレスポンダー non-response non responder 非反応例"},{"term":"胸郭インピーダンス","en":"Intrathoracic impedance","abbr":"","cat":"フォロー","device":"CRT","maker":"General","short":"リードと本体間で測る胸腔内の体液量の指標。心不全で肺水腫になると低下し、増悪の早期発見に用いる（OptiVol/CorVue等）。OptiVolやCorVueとして搭載される。","tags":"胸郭インピーダンス  Intrathoracic impedance intrathoracic impedance OptiVol CorVue 胸腔"},{"term":"マルチポイントペーシング","en":"Multipoint pacing","abbr":"MPP","cat":"CRT・CSP","device":"CRT","maker":"General","short":"1本の四極LVリードの離れた2点から左室を刺激し、より広く左室心筋を興奮させる方式。ノンレスポンダー対策に用いるが電池消耗が増える。刺激回数が増えるため電池の消耗は大きくなる。","tags":"マルチポイントペーシング MPP Multipoint pacing MPP multipoint MultiSite MultiPole 多点 MPP MPP MultiPoint Pacing"},{"term":"プログラマ","en":"Programmer","abbr":"","cat":"デバイス構造","device":"PM / ICD / CRT","maker":"General","short":"デバイスと通信して設定変更やデータ読み出しを行う専用機。テレメトリーワンドやRFアンテナ、体表面心電図ケーブル等を備える。緊急ショックボタンの位置と使い方を事前に把握しておく。","tags":"プログラマ  Programmer programmer プログラマ プログラマー programmer"},{"term":"テレメトリーワンド","en":"Telemetry wand","abbr":"","cat":"デバイス構造","device":"PM / ICD / CRT","maker":"General","short":"デバイス直上に置いて有線的に交信する装置。植込み部の直上に密着させ、無線式ではワンド不要でイントロゲートできる。通信が不安定なときは位置と密着を確認する。","tags":"テレメトリーワンド  Telemetry wand telemetry wand programming head ワンド"},{"term":"デバイスチェック","en":"Device check / follow-up","abbr":"","cat":"フォロー","device":"PM / ICD / CRT","maker":"General","short":"本体・リードの保守点検と、不整脈データによる患者管理を継続的に行う外来。基本パラメータ→電池→リード→イベント→診断補助データの順で確認する。前回からの変化に注目して読む。","tags":"デバイスチェック  Device check / follow-up device check follow-up デバイス外来"},{"term":"心内マーカ","en":"Intracardiac marker","abbr":"","cat":"センシング","device":"PM / ICD / CRT","maker":"General","short":"デバイスが認識したイベント（AP/AS/VP/VS等）を示す注釈。メーカーで表記が異なる。イベントの解釈に用いる。心内電位図と並べて読むことで動作を解釈できる。","tags":"心内マーカ  Intracardiac marker marker AP AS VP VS AEGM VEGM"},{"term":"バックアップモード","en":"Backup / safety mode","abbr":"","cat":"トラブル","device":"PM / ICD / CRT","maker":"General","short":"ERI/EOL到達時などにモードや基本レートが自動で切り替わる安全動作。テレメトリー前に手帳や前回状態を確認する必要がある。予期しない設定になっていることがあるため必ず確認する。","tags":"バックアップモード  Backup / safety mode backup safety mode ERI EOL 補助モード backup mode"},{"term":"睡眠傾斜","en":"Sleep incline","abbr":"","cat":"フォロー","device":"CRT","maker":"General","short":"就寝時の体の傾き（起坐呼吸の程度）をモニタする機能。睡眠時無呼吸や夜間発作性呼吸困難の把握に用いる。起坐呼吸の程度を客観的に把握できる。","tags":"睡眠傾斜  Sleep incline sleep incline 睡眠傾斜 起坐呼吸"},{"term":"心拍間隔変動","en":"Heart rate variability","abbr":"HRV","cat":"心電図","device":"CRT","maker":"General","short":"心拍間隔のゆらぎ。自律神経機能を反映し、低いHRVは心不全増悪・死亡リスクと関連する予後指標。デバイスのフォローでも予後評価の指標になる。","tags":"心拍間隔変動 HRV Heart rate variability HRV heart rate variability 自律神経"},{"term":"起坐呼吸","en":"Orthopnea","abbr":"","cat":"フォロー","device":"CRT","maker":"General","short":"臥位で呼吸困難が増し、起坐位・半坐位で軽減する状態。左心不全の主要な徴候。肺うっ血による左心不全の代表的徴候。","tags":"起坐呼吸  Orthopnea orthopnea 起坐呼吸 夜間発作性呼吸困難 PND"},{"term":"アクティビティデータ","en":"Activity data","abbr":"","cat":"フォロー","device":"PM / ICD / CRT","maker":"General","short":"加速度センサが記録する身体活動量の推移。心不全増悪では活動量が低下する。他の指標と組み合わせて増悪の兆候を捉える。","tags":"アクティビティデータ  Activity data activity data 活動量"},{"term":"洞停止","en":"Sinus arrest / pause","abbr":"","cat":"不整脈・EP","device":"PM","maker":"General","short":"洞結節の興奮が一時的に途絶し、P波もQRSも出ない状態（ポーズ）。徐脈頻脈症候群では頻拍停止時に長いポーズを生じる。失神の原因となり、ペーシングの適応を検討する。","tags":"洞停止  Sinus arrest / pause sinus arrest pause 洞停止 ポーズ"},{"term":"Wenckebach型2度房室ブロック","en":"Mobitz I (Wenckebach)","abbr":"","cat":"不整脈・EP","device":"PM","maker":"General","short":"PR間隔が徐々に延長し、ついにQRSが脱落する2度房室ブロック。房室結節内の機能的ブロックが多く、若年では良性のことが多い。多くは房室結節内のブロックで予後は良好。","tags":"Wenckebach型2度房室ブロック  Mobitz I (Wenckebach) Wenckebach Mobitz I 2度"},{"term":"Mobitz II型2度房室ブロック","en":"Mobitz II AV block","abbr":"","cat":"不整脈・EP","device":"PM","maker":"General","short":"PR間隔の延長なしに突然QRSが脱落する2度房室ブロック。His束以下の器質的障害が多く、恒久ペーシングを要することが多い。His束以下の障害が多く、無症状でもペーシングを考慮する。","tags":"Mobitz II型2度房室ブロック  Mobitz II AV block Mobitz II 2度 His下"},{"term":"接合部補充調律","en":"Junctional escape rhythm","abbr":"","cat":"不整脈・EP","device":"PM","maker":"General","short":"房室接合部から生じる補充調律。QRS幅は比較的狭く、毎分40〜50前後のことが多い。心室補充調律より安定している。","tags":"接合部補充調律  Junctional escape rhythm junctional escape 接合部補充"},{"term":"心室補充調律","en":"Ventricular escape rhythm","abbr":"","cat":"不整脈・EP","device":"PM","maker":"General","short":"心室（プルキンエ線維など）から生じる補充調律。QRS幅が広くレートも遅く、接合部補充調律より重篤で緊急性が高い。いつ止まってもおかしくなく、緊急性が高い。"," いAF検出率が示された。","tags":"塞栓源不明の脳塞栓症 ESUS Embolic stroke of undetermined source ESUS 塞栓源不明 心原性脳塞栓 心房細動検出 DOAC 塞栓源不明の脳塞栓症"},{"term":"バッハマン束","en":"Bachmann's bundle","abbr":"","cat":"不整脈・EP","device":"","maker":"General","short":"洞房結節付近から左房前壁へ興奮を伝える心房間の主要な伝導路。左右の心房がほぼ同時に興奮するのはこの経路による。障害されるとP波幅が延長する。","tags":"Bachmann束 Bachmann's bundle Bachmann bundle 心房間伝導路 左房 結節間伝導路 Bachmann束 Bachmann bundle 心房間伝導路"},{"term":"冠静脈洞","en":"Coronary sinus","abbr":"CS","cat":"CRT・CSP","device":"CRT","maker":"General","short":"右房へ開口する冠静脈の本幹。CRTではここから左室リードを挿入する。入口部にThebesian弁があるとカニュレーションが難しくなる。","tags":"冠静脈洞 CS Coronary sinus CS 冠静脈洞 カニュレーション Thebesian弁 CRT"},{"term":"大心静脈","en":"Great cardiac vein","abbr":"GCV","cat":"CRT・CSP","device":"CRT","maker":"General","short":"冠静脈洞から前室間溝へ向かう主幹部。ここから側壁静脈や後側壁静脈が分岐し、左室リードの通り道となる。ここから目的の枝へ選択的にリードを進める。","tags":"大心静脈 GCV Great cardiac vein GCV 大心静脈 前室間溝 分岐"},{"term":"側壁静脈","en":"Lateral vein","abbr":"","cat":"CRT・CSP","device":"CRT","maker":"General","short":"左室側壁を走る冠静脈の枝。電気的遅延が大きくCRTの効果が得やすいため、左室リードの第一の標的となる。心尖部からのペーシングは効果が乏しい。","tags":"側壁静脈 Lateral vein lateral vein 側壁静脈 標的枝 LVリード"},{"term":"後側壁静脈","en":"Posterolateral vein","abbr":"","cat":"CRT・CSP","device":"CRT","maker":"General","short":"左室後側壁を走る枝。側壁静脈と並んでCRTの標的となることが多い。側壁静脈が使えないときの代替になる。","tags":"後側壁静脈 Posterolateral vein posterolateral vein 後側壁静脈 標的枝"},{"term":"中心静脈","en":"Middle cardiac vein","abbr":"MCV","cat":"CRT・CSP","device":"CRT","maker":"General","short":"後室間溝を走る枝。心尖部寄りとなるためCRTの効果は乏しく、標的にはなりにくい。やむを得ない場合の選択肢にとどまる。","tags":"中心静脈 MCV Middle cardiac vein MCV 中心静脈 後室間溝"},{"term":"コミッテッド","en":"Committed shock","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"充電が完了したら、頻拍が停止していても必ずショックを放電する設定。確実に治療できる一方、不要なショックが出ることがある。自然停止していても放電されるため不要ショックとなりうる。","tags":"コミッテッド Committed shock committed 放電 必ず 不要ショック"},{"term":"ノンコミッテッド","en":"Non-committed shock","abbr":"","cat":"ICD","device":"ICD","maker":"General","short":"充電完了後、放電の直前にもう一度頻拍が続いているかを確認し、停止していれば放電を中止する設定。不要なショックを避けられる。再確認の分だけ放電までわずかに時間がかかる。","tags":"ノンコミッテッド Non-committed shock non-committed 再確認 中止 不要ショック回避"},{"term":"ユニポーラ","en":"Unipolar","abbr":"Uni","cat":"センシング","device":"PM / ICD / CRT","maker":"General","short":"リード先端の電極とデバイス本体の間で刺激・感知を行う極性。感知波高は大きいが筋電位や外来ノイズを拾いやすく、心電図上のスパイクは大きい。リード断線時の一時的な切替先にもなる。","tags":"ユニポーラ Uni Unipolar 単極 unipolar 缶 筋電位 スパイク大"},{"term":"バイポーラ","en":"Bipolar","abbr":"Bi","cat":"センシング","device":"PM / ICD / CRT","maker":"General","short":"リード先端のチップ電極とリング電極という近接した2点で刺激・感知を行う極性。狭い範囲だけを見るためノイズに強く現在の標準。心電図上のスパイクは小さい。","tags":"バイポーラ Bi Bipolar 双極 bipolar チップ リング ノイズに強い 標準"},{"term":"RAO","en":"Right anterior oblique","abbr":"RAO","cat":"植込み・手技","device":"PM / ICD / CRT","maker":"General","short":"右前斜位。透視で心臓を右前方から見る角度で、CRTでは冠静脈の長軸方向（心基部〜心尖部）の位置関係を評価する。長軸方向の留置部位を評価する。","tags":"RAO RAO Right anterior oblique 右前斜位 長軸 透視 冠静脈"},{"term":"LAO","en":"Left anterior oblique","abbr":"LAO","cat":"植込み・手技","device":"PM / ICD / CRT","maker":"General","short":"左前斜位。透視で心臓を左前方から見る角度で、中隔と自由壁の関係や、冠静脈の短軸方向（前壁〜側壁〜後壁）の位置を評価する。短軸方向の留置部位を評価する。","tags":"LAO LAO Left anterior oblique 左前斜位 短軸 透視 中隔"},{"term":"Cathode電極","en":"Cathode (陰極)","abbr":"","cat":"ペーシング","device":"PM / ICD / CRT","maker":"General","short":"電流が流れ出す側の電極で、心筋の興奮はここで起こる。通常はリード先端のチップ電極が該当し、陽極側より低い出力で捕捉できる。表面積が小さいほど電流密度が上がり、閾値が下がりやすい。","tags":"Cathode電極 Cathode (陰極) 陰極 カソード チップ 電流流出 捕捉"},{"term":"Anode電極","en":"Anode (陽極)","abbr":"","cat":"ペーシング","device":"PM / ICD / CRT","maker":"General","short":"電流が戻る側の電極。双極ではリング電極、単極では本体が該当する。通常は興奮を起こさないが、出力が高いと陽極刺激が生じる。陽極刺激が疑われる場合は出力調整や極性変更で回避する。","tags":"Anode電極 Anode (陽極) 陽極 アノード リング 電流流入 陽極刺激"},{"term":"左脚ブロック","en":"Left bundle branch block","abbr":"LBBB","cat":"心電図","device":"PM / ICD / CRT","maker":"General","short":"左脚の伝導障害でQRS幅が0.12秒以上に延長し、V5・V6でノッチのある幅広いR波、V1でrSまたはQS型を示す。中隔性q波が消失する。心機能低下例ではCRTの効果が最も期待できる波形。","tags":"左脚ブロック LBBB Left bundle branch block LBBB 完全左脚ブロック QRS0.12 中隔性q波消失 CRT適応"},{"term":"右脚ブロック","en":"Right bundle branch block","abbr":"RBBB","cat":"心電図","device":"PM / ICD / CRT","maker":"General","short":"右脚の伝導障害でQRS幅が延長し、V1でrsR'型（M字型）、V5・V6で幅広いS波を示す。左室の興奮はほぼ正常に保たれるため、CRTの効果は左脚ブロックより乏しい。","tags":"右脚ブロック RBBB Right bundle branch block RBBB 完全右脚ブロック rsR M字型 V1"},{"term":"ルーメン構造","en":"Lumen structure","abbr":"","cat":"リード","device":"PM / ICD / CRT","maker":"General","short":"リード内部の管腔の構造。スタイレットを通す内腔を持つものと、導体を別々の管腔に分けたマルチルーメン構造がある。スタイレット挿入時に血液が入ると凝固して操作が難しくなる。","tags":"ルーメン構造 Lumen structure lumen 内腔 スタイレット マルチルーメン ICDリード"},{"term":"2極LVリード","en":"Bipolar LV lead","abbr":"","cat":"CRT・CSP","device":"CRT","maker":"General","short":"電極を2つ備えた左室リード。選べるペーシングベクトルが限られるため、横隔神経刺激が出ると打つ手が限られる。現在は4極リードが主流。","tags":"2極LVリード Bipolar LV lead 2極 双極 LVリード ベクトル限定 4極が主流"},{"term":"イスムス","en":"Isthmus","abbr":"","cat":"不整脈・EP","device":"","maker":"General","short":"リエントリー回路の中で興奮の通り道が狭くなっている部分。通常型心房粗動では三尖弁輪と下大静脈の間（CTI）が該当し、ここをアブレーションでブロックすると頻拍が止まる。","tags":"イスムス Isthmus isthmus 峡部 CTI 三尖弁輪 下大静脈 アブレーション標的"},{"term":"Sinus Tachy","en":"Sinus tachycardia","abbr":"","cat":"不整脈・EP","device":"ICD","maker":"General","short":"洞結節由来の頻拍。P波の形は洞調律と同じで、レートは徐々に上がる。ICDではVTとの鑑別が必要で、Onset基準を厳しくしすぎると運動誘発性VTを見逃す。","tags":"Sinus Tachy Sinus tachycardia 洞頻拍 洞性頻脈 Onset 鑑別 不適切作動"},{"term":"コッホの三角","en":"Triangle of Koch","abbr":"","cat":"不整脈・EP","device":"","maker":"General","short":"右房中隔にある三角形の領域で、Todaro腱・三尖弁中隔尖の付着部・冠静脈洞入口部を境界とする。頂点付近に房室結節があり、この領域の手技では房室ブロックのリスクに注意する。","tags":"コッホの三角 Triangle of Koch Koch Todaro腱 三尖弁 冠静脈洞 房室結節 目印"},{"term":"赤黒ワニピン","en":"Alligator clip cable","abbr":"","cat":"植込み・手技","device":"PM / ICD / CRT","maker":"General","short":"PSAとリードをつなぐ挟み込み型のケーブル。赤が陽極、黒が陰極に対応するのが一般的。接続の取り違えは測定値の誤読につながるため、色と接続先を必ず確認する。","tags":"赤黒ワニピン Alligator clip cable ワニ口クリップ PSA 赤 陽極 黒 陰極 接続"},{"term":"ハートレートスコア","en":"Heart Rate Score","abbr":"HRS","cat":"フォロー","device":"PM / ICD / CRT","maker":"General","short":"レートヒストグラムで、最も多い心拍数帯が全体に占める割合を示す指標。値が高いほど心拍数の変動が乏しいことを意味し、高値は予後不良と関連するとされる。","tags":"ハートレートスコア HRS Heart Rate Score Heart Rate Score レートヒストグラム 心拍変動 予後"},{"term":"器質的心疾患","en":"Structural heart disease","abbr":"SHD","cat":"不整脈・EP","device":"","maker":"General","short":"心筋梗塞、心筋症、弁膜症など心臓の構造そのものに異常がある病態の総称。心室不整脈のリスクが高く、CAST試験の教訓からI群抗不整脈薬は原則使用しない。ICDの適応判断でも重要な前提となる。","tags":"器質的心疾患 SHD Structural heart disease SHD 器質的 心筋梗塞 心筋症 CAST ICD適応"},{"term":"バッハマン束ペーシング","en":"Bachmann's bundle pacing","abbr":"BBP","cat":"ペーシング","device":"PM / CRT","maker":"General","short":"心房中隔上部のバッハマン束領域を刺激するペーシング。右心耳ペーシングより心房の興奮時間が短くP波幅も狭くなり、心房細動の抑制効果が期待される。固定には能動的固定リードを用いる。","tags":"バッハマン束ペーシング BBP Bachmann's bundle pacing BBP 心房中隔 中隔ペーシング P波短縮 AF抑制"},{"term":"ワンパンクチャーツーシース法","en":"One-puncture two-sheath technique","abbr":"","cat":"植込み・手技","device":"PM / ICD / CRT","maker":"General","short":"1回の静脈穿刺でガイドワイヤを2本通し、2本のシースを挿入してリードを2本留置する方法。穿刺回数が減るため、気胸などの合併症リスクを下げられる。","tags":"ワンパンクチャーツーシース法 One-puncture two-sheath technique ワンパンクチャー 2シース 穿刺1回 ガイドワイヤ 合併症低減"},{"term":"リコール","en":"Recall","abbr":"","cat":"トラブル","device":"PM / ICD / CRT","maker":"General","short":"不具合が判明した製品を回収・是正する措置。デバイスやリードでは対象患者の抽出、フォロー間隔の見直し、遠隔モニタリングの強化、必要に応じた交換の検討を行う。学会や工業会から情報提供されるため、日頃から把握しておく。","tags":"リコール Recall recall 回収 是正 対象患者 フォロー強化 交換検討"},{"term":"Latency","en":"Latency","abbr":"","cat":"ペーシング","device":"PM / ICD / CRT","maker":"General","short":"刺激を出してから心筋の興奮が始まるまでの遅れ。電極が梗塞部位や線維化した部位にあると長くなる。CRTでは左室を先行させてVVディレイを補正する。","tags":"Latency Latency latency 伝導遅延 梗塞部位 線維化 VVディレイ"},{"term":"傷害電流","en":"Current of injury","abbr":"COI","cat":"植込み・手技","device":"PM / ICD / CRT / CSP / Leadless","maker":"General","short":"リード先端が心筋に接触・固定された直後に生じる電位変化（ST偏位）。スクリュー固定での組織接触の指標になる一方、植込み直後の計測値を不安定にする。STモニタリングが植込みから4時間はデータを取得しないのは、これとポケット内状態の不安定さのため。LBBAPでは、大幅な変化や消失が中隔穿孔の手がかりになる。AVEIR LP ではプログラマのコマンドEGMで傷害電流を計測でき、プレマッピング後・固定後・テザーモードでの評価に用いる。","tags":"傷害電流 current of injury COI リード固定 心筋 接触 植込み直後 4時間 STモニタリング ポケット 障害電流 injury current Injury current ST上昇 損傷電流 スクリュー固定 組織接触 CSP LBBAP 穿孔 コマンドEGM AVEIR リードレス プレマッピング 固定確認"}];

/* 検索の関連度ランク。数値が小さいほど上位。
   0=見出し語が完全一致 / 1=別名（英名・略語・型番など）が完全一致
   2=見出し語が前方一致 / 3=別名が前方一致
   4=見出し語に含む   / 5=別名に含む / 6=それ以外（概念マップ・本文一致など） */
function relRank(primary,aliases,q){
 if(!q)return 9;
 var nq=String(q).trim().toLowerCase();
 if(!nq)return 9;
 var n=function(v){return String(v==null?"":v).trim().toLowerCase()};
 var p=n(primary), al=(aliases||[]).map(n).filter(Boolean);
 if(p===nq)return 0;
 if(al.indexOf(nq)>=0)return 1;
 if(p.indexOf(nq)===0)return 2;
 if(al.some(function(a){return a.indexOf(nq)===0}))return 3;
 if(p.indexOf(nq)>=0)return 4;
 if(al.some(function(a){return a.indexOf(nq)>=0}))return 5;
 return 6;
}

function byRelevance(rows,q,keyfn){
 if(!q||!String(q).trim())return rows;
 return rows.map(function(r,i){return {r:r,i:i,k:keyfn(r)}})
   .sort(function(a,b){return (a.k-b.k)||(a.i-b.i)})
   .map(function(o){return o.r});

<script>
(function(){
  function textW(el){
    var r=document.createRange(); r.selectNodeContents(el);
    var rects=r.getClientRects(), w=0;
    for(var i=0;i<rects.length;i++){ w=Math.max(w,rects[i].width); }
    return w||r.getBoundingClientRect().width;
  }
  function fitEyebrow(){
    var box=document.querySelector('.hdrrow .hdrtext');
    if(!box) return;
    var h1=box.querySelector('h1'), eb=box.querySelector('.eyebrow');
    if(!h1||!eb) return;
    var target=textW(h1);
    if(!target) return;
    var n=(eb.textContent||'').length; if(!n) return;
    var fs=11;
    eb.style.letterSpacing='0px';
    eb.style.marginRight='0px';
    eb.style.fontSize=fs+'px';
    var w=textW(eb), guard=0;
    while(w>target && fs>8 && guard++<40){
      fs-=0.25; eb.style.fontSize=fs+'px'; w=textW(eb);
    }
    /* タイトル幅に合わせて字間を広げるが、広げすぎないよう上限を設ける。
       文字数が少ないサブタイトル（PM | ICD | CRT など）でも間延びしない。 */
    var MAX_LS=1.4;
    var ls=(target-w)/n;
    if(ls>MAX_LS)ls=MAX_LS;
    if(ls>0){
      eb.style.letterSpacing=ls.toFixed(3)+'px';
      eb.style.marginRight=(-ls).toFixed(3)+'px';
    }
  }
  window.fitEyebrow=fitEyebrow;
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',fitEyebrow);}else{fitEyebrow();}
  window.addEventListener('resize',fitEyebrow);
  window.addEventListener('orientationchange',function(){setTimeout(fitEyebrow,150);});
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fitEyebrow);}
  setTimeout(fitEyebrow,300); setTimeout(fitEyebrow,1200);
})();
</script>

 var MAKER_ORDER=["Medtronic","Abbott","BIOTRONIK","Boston Scientific","MicroPort CRM"];

 var CK="ciedsnavi.ext.";           /* キャッシュ接頭辞 */
 var cache={}, loaded={};

 function readCache(name){try{return JSON.parse(localStorage.getItem(CK+name)||"null")}catch(e){return null}}
 function writeCache(name,d){try{localStorage.setItem(CK+name,JSON.stringify(d))}catch(e){}}

 /* 必要になったタブのデータだけ取りに行く */
 async function load(name){
  if(loaded[name])return cache[name];
  var c=readCache(name); if(c){cache[name]=c;}
  try{
   var r=await fetch(name+".json?t="+Date.now(),{cache:"no-store"});
   if(r.ok){var d=await r.json(); cache[name]=d; writeCache(name,d);}
  }catch(e){/* オフラインならキャッシュのまま */}

 var LEADICO='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h3v4H3z"/><path d="M6 8c4 0 4 8 8 8s4-4 7-4"/><circle cx="21" cy="12" r="1.2"/></svg>';

 function renderPList(){

  var scope=all.filter(function(x){
   return (!pK||x.kind===pK)&&(!pM||x.maker===pM)});

  chips($("#pCats"),cats,pC,function(v){pC=v;renderP()});

     ||String(a.maker).localeCompare(String(b.maker),"ja")
     ||(CAT_ORDER.indexOf(a.cat)<0?99:CAT_ORDER.indexOf(a.cat))
       -(CAT_ORDER.indexOf(b.cat)<0?99:CAT_ORDER.indexOf(b.cat))

  var flat=!!q;

  var out="",cur=null;

   if(!flat&&x.maker!==cur){cur=x.maker;out+='<p class="mkhead">'+esc(cur)+'</p>'}
   var m=pMeta(x);
   out+='<button class="arow prow" data-id="'+esc(x.id)+'">'+

 function openProd(id){

  pOpen=id;
  function sec(title,pairs){
   var r=pairs.filter(function(p){return p[1]}).map(function(p){
    return '<div><dt>'+esc(p[0])+'</dt><dd>'+esc(p[1])+'</dd></div>'}).join("");
   return r?'<section><h4>'+esc(title)+'</h4><dl class="kv">'+r+'</dl></section>':'';
  }
  /* コネクタ規格ごとの接点数。イラストのリング数に反映する */
  function connPins(s){
   var k=String(s||"").toUpperCase();
   if(k.indexOf("IS4")>=0||k.indexOf("IS-4")>=0)return 4;
   if(k.indexOf("DF4")>=0||k.indexOf("DF-4")>=0)return 4;
   if(k.indexOf("DF-1")>=0)return 1;
   if(k.indexOf("SQ-1")>=0)return 1;
   if(k.indexOf("6MM")>=0||k.indexOf("5MM")>=0)return 1;

   if(k.indexOf("IS-1")>=0)return 2;
   return 2;
  }

  function connStd(s){
   var m=String(s||"").match(/IS-?4|DF-?4|DF-1|IS-1|VS-1|SQ-1|6mm|5mm/i);
   return m?m[0]:String(s||"").split("（")[0];
  }
  /* ヘッダーの断面イラスト。ポートごとに接点数の違う差込口を描く */
  function connSvg(rows){

      'fill="#e9edf3" stroke="#64748b" stroke-width="1.4"/>';
   rows.forEach(function(r,i){
    var y=pad+i*h+h/2, n=connPins(r[0]);
    s+='<rect x="34" y="'+(y-8)+'" width="'+(bw-46)+'" height="16" rx="3" '+
       'fill="#ffffff" stroke="#64748b" stroke-width="1.1"/>';
    s+='<circle cx="27" cy="'+y+'" r="3.4" fill="none" stroke="#64748b" stroke-width="1.3"/>';
    for(var k=0;k<n;k++){
     var cx=46+k*Math.min(22,(bw-70)/Math.max(n,1));
     s+='<circle cx="'+cx+'" cy="'+y+'" r="4.2" fill="#dbe3ee" stroke="#334155" stroke-width="1.3"/>';
    }
    s+='<text x="'+(bw+16)+'" y="'+(y+4)+'" font-size="12" fill="#0f172a">'+
       esc(connStd(r[0]))+' <tspan font-weight="700">('+esc(r[1])+')</tspan></text>';
   });
   return s+'</svg>';
  }
  /* 資料に単位が含まれる値（例「6.5F」）には単位を付け足さない */
  function u(v,unit){
   if(!v)return "";
   return /^[0-9.\/×\s]+$/.test(String(v)) ? v+" "+unit : String(v);
  }

 /* 詳細を右スワイプで閉じる */
 (function(){
  var x0=0,y0=0,t0=0,track=false;
  /* 開いている詳細画面（アルゴ／製品）を返す */
  function openPane(){
   var ids=[["aDetail",function(){closeAlgo()}],["pDetail",function(){closeProd()}]];
   for(var i=0;i<ids.length;i++){
    var el=document.getElementById(ids[i][0]);
    if(el&&!el.hidden)return {el:el,close:ids[i][1]};
   }
   return null;
  }
  function detailOpen(){return !!openPane()}
  function start(x,y){x0=x;y0=y;t0=Date.now();track=true}
  function move(x,y){
   if(!track)return;
   var dx=x-x0, dy=y-y0;
   if(Math.abs(dy)>Math.abs(dx)*1.2){track=false;setX(0);return}  /* 縦優先 */
   setX(dx>0?dx*0.3:0);
  }
  function end(x,y){
   var p=openPane();
   setX(0);
   if(!track)return; track=false;
   var dx=x-x0, dy=y-y0, dt=Date.now()-t0;
   if(dx>55 && Math.abs(dx)>Math.abs(dy)*1.2 && dt<1200 && p)p.close();
  }
  function setX(px){
   var p=openPane(); if(!p)return;
   p.el.style.transform = px ? "translateX("+px+"px)" : "";
  }
  document.addEventListener("touchstart",function(e){
   if(!detailOpen()||e.touches.length!==1){track=false;return}
   start(e.touches[0].clientX,e.touches[0].clientY);
  },{passive:true});
  document.addEventListener("touchmove",function(e){
   if(!detailOpen()||e.touches.length!==1)return;
   move(e.touches[0].clientX,e.touches[0].clientY);
  },{passive:true});
  document.addEventListener("touchend",function(e){
   if(!detailOpen())return;
   var t=e.changedTouches[0]; end(t.clientX,t.clientY);
  },{passive:true});
  document.addEventListener("touchcancel",function(){track=false;setX(0)},{passive:true});
  /* マウス環境でも同じ操作で戻れるように */
  document.addEventListener("pointerdown",function(e){
   if(e.pointerType!=="mouse"||!detailOpen())return;
   start(e.clientX,e.clientY);
  });
  document.addEventListener("pointerup",function(e){
   if(e.pointerType!=="mouse"||!detailOpen())return;
   end(e.clientX,e.clientY);
  });
 })();
 /* メーカー別 ⇔ 一覧表 を左右スワイプで切り替える（詳細を開いていないときだけ） */
 (function(){

   return curTab==="a" && $("#aBrowse") && !$("#aBrowse").hidden
          && $("#aDetail") && $("#aDetail").hidden;
  }
  function s(el,x,y){
   if(!ready()||(el&&el.closest("select,input,textarea"))){tr=false;return}
   x0=x;y0=y;t0=Date.now();tr=true;
  }
  function fin(x,y){
   if(!tr)return; tr=false;
   if(!ready())return;
   var dx=x-x0, dy=y-y0, dt=Date.now()-t0;
   if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5||dt>900)return;
   var next=dx<0?"c":"m";            /* 左へ払うと一覧表、右へ払うとメーカー別 */
   if(next===aMode)return;
   aMode=next;aM="";aC="";renderA();window.scrollTo(0,0);
  }
  document.addEventListener("touchstart",function(e){
   if(e.touches.length!==1){tr=false;return}
   s(e.target,e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
  document.addEventListener("touchmove",function(e){
   if(e.touches.length!==1)tr=false},{passive:true});
  document.addEventListener("touchend",function(e){
   var c=e.changedTouches[0];fin(c.clientX,c.clientY)},{passive:true});
  document.addEventListener("touchcancel",function(){tr=false},{passive:true});
  document.addEventListener("pointerdown",function(e){
   if(e.pointerType!=="mouse")return; s(e.target,e.clientX,e.clientY)});
  document.addEventListener("pointerup",function(e){
   if(e.pointerType!=="mouse")return; fin(e.clientX,e.clientY)});
