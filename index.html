 /* ================= MRI 組合せ検索 ================= */
 var sel={maker:"",type:"",dev:"",ra:"",rv:"",lv:""},searched=false;
 var NONE="__none__";   /* 「使用していない」を表す値 */

 function mriItems(){return items("mri")}
 function opts(el,ph,list,cur,dis){
  el.disabled=!!dis;
  el.innerHTML='<option value="">'+ph+'</option>'+list.map(function(o){
   return '<option value="'+esc(o.v)+'"'+(o.v===cur?' selected':'')+'>'+esc(o.t)+'</option>'}).join("");
 }
 function uniqBy(list,key){
  var seen={},out=[];
  list.forEach(function(x){if(!seen[x[key]]){seen[x[key]]=1;out.push(x)}});
  return out;
 }
 /* 現在の選択に矛盾しないグループ群 */
 function candidates(){
  return mriItems().filter(function(g){
   if(sel.maker&&g.maker!==sel.maker)return false;
   if(sel.type&&g.type!==sel.type)return false;
   if(sel.dev&&!g.devices.some(function(d){return d.model===sel.dev}))return false;
   return true;
  });
 }
 function leadIn(list,v){
  if(!v||v===NONE)return true;              /* 未選択・未使用は許容 */
  return list.some(function(l){return l.model===v});
 }
 /* 候補にリード型番の登録があるか */
 function hasLeadList(cs){
  return cs.some(function(g){return (g.ra&&g.ra.length)||(g.rv&&g.rv.length)});
 }

 function renderM(){
  var all=mriItems();
  if(!all.length){
   $("#mVerdict").innerHTML="";
   $("#mDetail").innerHTML=blank("mri","template_mri.csv");
   return;
  }
  /* メーカー */
  opts($("#mMaker"),"選択してください",
   sortMakers(uniqBy(all.map(function(g){return {v:g.maker,t:g.maker}}),"v")),sel.maker);
  /* 種別 */
  var byMaker=all.filter(function(g){return !sel.maker||g.maker===sel.maker});
  opts($("#mType"),"選択してください",
   uniqBy(byMaker.map(function(g){return {v:g.type,t:g.type}}),"v"),sel.type,!sel.maker);
  /* 本体 */
  var byType=byMaker.filter(function(g){return !sel.type||g.type===sel.type});
  var devs=[];
  byType.forEach(function(g){g.devices.forEach(function(d){
   /* 型番が別に登録されているときだけ（型番）を後ろに付ける */
   devs.push({v:d.model,t:d.name+(d.model&&d.model!==d.name?"（"+d.model+"）":"")})})});
  opts($("#mDev"),"選択してください",uniqBy(devs,"v"),sel.dev,!sel.type);
  /* リード（本体が決まってから） */
  var cs=candidates();
  var ra=[],rv=[],lv=[];
  cs.forEach(function(g){
   g.ra.forEach(function(l){ra.push({v:l.model,t:l.name})});
   g.rv.forEach(function(l){rv.push({v:l.model,t:l.name})});
   (g.lv||[]).forEach(function(l){lv.push({v:l.model,t:l.name})});
  });
  var noneOpt={v:NONE,t:"使用していない／不明"};
  var leadKnown=hasLeadList(cs);
  $("#mRaRow").hidden=!leadKnown; $("#mRvRow").hidden=!leadKnown;
  if(leadKnown){
   opts($("#mRa"),"選択してください",uniqBy(ra,"v").concat(noneOpt),sel.ra,!sel.dev);
   opts($("#mRv"),"選択してください",uniqBy(rv,"v").concat(noneOpt),sel.rv,!sel.dev);
  }
  var hasLv=leadKnown&&lv.length>0;
  $("#mLvRow").hidden=!hasLv;
  if(hasLv)opts($("#mLv"),"選択してください",uniqBy(lv,"v").concat(noneOpt),sel.lv,!sel.dev);

  if(searched)renderVerdict(cs,hasLv,leadKnown);
 }

 function renderVerdict(cs,hasLv,leadKnown){
  var need=[];
  if(!sel.maker)need.push("メーカー");
  if(!sel.type)need.push("種別");
  if(!sel.dev)need.push("本体");
  if(leadKnown&&sel.dev&&!sel.ra)need.push("心房リード");
  if(leadKnown&&sel.dev&&!sel.rv)need.push("心室リード");
  if(hasLv&&sel.dev&&!sel.lv)need.push("左室リード");
  if(need.length){
   $("#mVerdict").innerHTML='<div class="verdict wait"><p class="vt">判定</p>'+
    '<p class="vv">'+esc(need.join("・"))+'を選んでください</p></div>';
   $("#mDetail").innerHTML="";
   return;
  }
  /* 全条件を満たすグループを探す */
  var hit=cs.filter(function(g){
   return leadIn(g.ra,sel.ra)&&leadIn(g.rv,sel.rv)&&(!hasLv||leadIn(g.lv||[],sel.lv));
  })[0];
  if(!hit){
   $("#mVerdict").innerHTML='<div class="verdict ng"><p class="vt">判定</p>'+
    '<p class="vv">非対応</p>'+
    '<p class="vs">この本体とリードの組合せは、条件付きMRI対応の構成として登録されていません。'+
    '添付文書と各社の最新情報で必ず確認してください。</p></div>';
   $("#mDetail").innerHTML="";
   return;
  }
  var t15=hit.tesla.indexOf("1.5T")>=0, t30=hit.tesla.indexOf("3.0T")>=0;
  $("#mVerdict").innerHTML='<div class="verdict ok"><p class="vt">判定</p>'+
   '<p class="vv">'+esc(hit.tesla.join(" / "))+' で撮像可</p>'+
   '<div class="tesla"><span class="'+(t15?"y":"n")+'">1.5T '+(t15?"○":"×")+'</span>'+
   '<span class="'+(t30?"y":"n")+'">3.0T '+(t30?"○":"×")+'</span></div>'+
   '<p class="vs">'+esc(hit.group)+'（'+esc(hit.maker)+'・'+esc(hit.type)+'）の条件が適用されます。</p></div>';
  var c=hit.cond||{};
  var rows=Object.keys(c).map(function(k){return [k,c[k]]});
  $("#mDetail").innerHTML='<div class="pcard"><h3>撮像条件</h3>'+dl(rows)+
   '<p class="mrinote">記載は組合せ判定の目安です。実施前に必ず添付文書および各社の最新情報を確認してください。'+
   (hit.verify?'<br>※このデータは取り込み後の検証が未了です。':'')+'</p></div>';
 }

 function bindM(){
  var map={"#mMaker":"maker","#mType":"type","#mDev":"dev","#mRa":"ra","#mRv":"rv","#mLv":"lv"};
  document.addEventListener("change",function(e){
   for(var s in map){
    if(e.target.matches&&e.target.matches(s)){
     var k=map[s]; sel[k]=e.target.value;
     /* 上位を変えたら下位をリセット */
     var order=["maker","type","dev","ra","rv","lv"];
     var idx=order.indexOf(k);
     order.slice(idx+1).forEach(function(x){sel[x]=""});
     searched=false;
     $("#mVerdict").innerHTML="";$("#mDetail").innerHTML="";
     renderM(); return;
    }
   }
  });
  document.addEventListener("click",function(e){
   if(e.target.closest("#mSearch")){
    searched=true;renderM();
    var v=$("#mVerdict");if(v)v.scrollIntoView({behavior:"smooth",block:"nearest"});
    return;
   }
   if(e.target.closest("#mReset")){
    sel={maker:"",type:"",dev:"",ra:"",rv:"",lv:""};searched=false;
    $("#mVerdict").innerHTML="";$("#mDetail").innerHTML="";renderM();
   }
  });
 }
 bindM();

 /* ================= タブ切替 ================= */
 var SEC={g:null,p:"#secProducts",a:"#secAlgos",m:"#secMri"};
 var curTab="g";
 var GLOSS=["header","main.wrap:not([id])",".overlay"];
 async function go(tab){
  /* 用語集の既存UI（ヘッダー内の検索・並べ替え等）は用語集タブのみ表示 */
  var head=document.querySelector("header");
  var gmain=document.querySelector('main.wrap:not([id])');
  if(head)head.style.display=(tab==="g")?"":"none";
  if(tab==="g"&&typeof setView==="function"&&view!=="g")setView("g");
  if(gmain)gmain.hidden=(tab!=="g");
  curTab=tab;
  ["p","a","m"].forEach(function(k){var el=$(SEC[k]);if(el)el.hidden=(tab!==k)});
  Array.prototype.forEach.call(document.querySelectorAll("#tabbar button"),function(b){
   var on=b.dataset.tab===tab; b.classList.toggle("on",on); b.setAttribute("aria-selected",on)});
  window.scrollTo(0,0);
  if(tab==="p"){await load("products");renderP()}
  if(tab==="a"){await load("algos");if(tab!=="a")aOpen=null;renderA()}
  if(tab==="m"){await load("mri");renderM()}
 }
 document.addEventListener("click",function(e){
  var b=e.target.closest("#tabbar button"); if(!b)return;
  var tab=b.dataset.tab;
  /* 表示中のタブをもう一度タップしたら、開いている詳細を閉じて一覧へ戻る */
  if(tab===curTab){
   if(tab==="p"&&$("#pDetail")&&!$("#pDetail").hidden){closeProd();return}
   if(tab==="a"&&$("#aDetail")&&!$("#aDetail").hidden){closeAlgo();return}
  }
  go(tab)});
 (function(){
  document.addEventListener("change",function(e){
   if(e.target.matches("#pKind")){pK=e.target.value;pC="";renderP()}
   if(e.target.matches("#pMaker")){pM=e.target.value;renderP()}
   if(e.target.matches("#aMaker")){aM=e.target.value;renderA()}
   if(e.target.matches("#aCat")){aC=e.target.value;renderA()}
   if(e.target.matches("#mMaker")){mM=e.target.value;renderM()}
   if(e.target.matches("#mTesla")){mT=e.target.value;renderM()}
  })})();
})();
</script>

<script>
/* オーバーレイの開閉に合わせて body にクラスを付け外しする */
(function(){
 var ids=["#overlay","#detailOverlay"];
 function sync(){
  var open=ids.some(function(s){var el=document.querySelector(s);
   return el&&(el.classList.contains("open")||getComputedStyle(el).display!=="none")});
  document.body.classList.toggle("modal-open",open);
 }
 ids.forEach(function(s){
  var el=document.querySelector(s); if(!el)return;
  new MutationObserver(sync).observe(el,{attributes:true,attributeFilter:["class","style"]});
 });
 document.addEventListener("click",function(){setTimeout(sync,0)},true);
 sync();
})();
</script>
